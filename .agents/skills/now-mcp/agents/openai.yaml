interface:
  display_name: "NOW MCP"
  short_description: "Route classic Macintosh tasks through NOW"
  default_prompt: "Use $now-mcp to inspect the connected classic Macintosh."
dependencies:
  tools:
    - type: "mcp"
      value: "now"
      description: "NOW's app-owned local HTTP MCP for a connected classic Macintosh"
      transport: "streamable_http"
      url: "http://127.0.0.1:5254/mcp"
policy:
  allow_implicit_invocation: true
