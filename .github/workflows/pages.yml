# Documentation deploys independently from the main website. This workflow is
# deliberately downstream of CI: only the exact integrated main revision that
# passed the full repository gate may become the public documentation site.
name: Deploy documentation

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

# Keep the workflow token read-only unless a job explicitly narrows or
# elevates it for the Pages deployment operation below.
permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Install pinned documentation toolchain
        run: python -m pip install -r docs/requirements.txt
      - name: Build and verify release documentation
        env:
          NOW_DOCS_RELEASE: "1"
          NOW_DOCS_SITE_URL: https://docs.newoldworldmac.com/
        run: NOW_DOCS_PYTHON=python scripts/docs-build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build-docs/site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified documentation
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
