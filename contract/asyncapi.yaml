      name: software.listing
      payload: { $ref: "#/components/schemas/SoftwareListing" }
    agentAccess:
      name: agent.access
      payload: { $ref: "#/components/schemas/AgentAccess" }

  schemas:
    Hello:
      type: object
      required: [type, contract, side, version]
      additionalProperties: false
      properties:
        type: { const: hello }
        contract:
          type: integer
          description: Contract revision; unequal revisions are refused.
        side: { enum: [guest, host] }
        version:
          type: string
          description: Sending app's own version, for display only.
        build:
          type: string
          maxLength: 64
          description: >
            Opaque build identity of the sending app — a string that differs
            between two builds of the same `version`. NOW's guests send their
            compile timestamp ("Mmm dd yyyy hh:mm:ss"). For display and for
            telling builds apart, never parsed and never compared for order:
            "different" is the only question it answers.
            ABSENT means the sender does not report one, which is a fact about
            the sender and NOT a claim that the build is old, unknown-good or
            the same as any other. A receiver shows nothing rather than
            guessing, and must not fall back to `version` — a version equal
            across two builds is exactly the failure this field exists for.
        agent:
          enum: [disabled, read-only, full]
          description: >
            The SENDING MACHINE'S OWN ANSWER to whether a companion agent may
            drive it, and how far. Not a capability and not a negotiation: the
            machine states its position and the receiver is what enforces it.
            `disabled` REFUSES — the installer omitted the agent features, or
            somebody flipped the switch. `read-only` and `full` CONSENT, to
            that much. The values are ORDERED (disabled < read-only < full) so
            a further tier can slot above `full` without re-shaping the field
            or the wire; there is no such tier today and none may be invented
            without something behind it.
            ABSENT means the sender predates this field — a fact about the
            sender and NOT an answer. It must never be read as consent, which
            is why a refusing machine says `disabled` out loud rather than
            staying silent: an installer that omits the agent features and a
            guest older than the field would otherwise look identical here.
            DECISION, 2026-07-30, to revisit rather than a property of the
            field: an absent value currently fails OPEN, because that matches
            today's default-on behaviour and keeps every already-deployed
            machine working. The moment the installer ships is the moment
            silence stops being the common case, and the flip gets recorded
            here rather than drifting.
            A tier this receiver does not recognise is likewise NOT consent —
            it is a newer sender, and a receiver that cannot name the ceiling
            cannot claim to be under it.
            This is the answer AT CONNECT TIME, and it is not the last word:
            `agent.access` revises it mid-session, and a receiver that holds
            this value must hold the revision in the same place. A receiver
            that treats hello as the permanent answer enforces a tier the
            machine has already withdrawn.
        name:
          type: string
          description: Human-facing machine name, e.g. "Power Mac G3".
        os:
          type: string
          description: Guest OS version string, e.g. "9.1".
        chunk:
          type: integer
          minimum: 512
          maximum: 32768
          description: >
            Sender's preferred bulk chunk size in bytes; the connection uses
            the smaller of the two sides' preferences. Default 8192.
    AgentAccess:
      type: object
      required: [type, agent]
      additionalProperties: false
      description: >
        GUEST TO HOST ONLY, unsolicited: the sending machine has changed its
        mind about whether a companion agent may drive it, and says so on the
        link already up. `hello.agent` is the same fact at connect time; this
        is that fact revised, and the two carry identical tokens because they
        are one answer, not two.

        WHY IT EXISTS. `hello` is sent once per connection and nothing
        revised it, so a person who set Read Only mid-session kept being
        driven at the tier they had just withdrawn until the link was
        rebuilt. That is the one place in this product where a stale belief
        has a safety edge — the person believes they have restricted the
        machine, and the receiver goes on permitting what they restricted.

        THE GUEST INITIATES, always. There is deliberately no host-to-guest
        form and no request that sets this: a tier the far end could raise is
        not consent. The receiver may read this value and must never write
        it.

        NOT ACKNOWLEDGED, and carries no `id`. The sender learns that it
        said this, never that the receiver acted on it — the same standing
        `hello.agent` has, and the guest's page is worded to claim only what
        it said. An ack would be a new host-to-guest message and is not
        needed for the receiver to enforce, which it does on receipt.

        ADDITIVE — no revision bump. Both shipping halves ignore a control
        message they cannot decode once the handshake is past (the host logs
        it and keeps the wire; the guest's reader falls through), so an older
        receiver misses the revision and goes on enforcing the connect-time
        answer, which is exactly today's behaviour and no worse than it.

        A receiver that never got a `hello.agent` (a sender predating that
        field) and then gets one of these has been given an answer where it
        had silence, and must use it: absence means "did not say", and this
        message is the machine saying.
      properties:
        type: { const: agent.access }
        agent:
          enum: [disabled, read-only, full]
          description: >
            The machine's answer now, spelled exactly as `hello.agent` spells
            it and meaning exactly the same thing — including that the values
            are ORDERED and that a tier a receiver does not recognise is not
            consent. REQUIRED here, unlike in hello: a message whose only
            purpose is to state the answer has no reading in which the answer
            is absent, and a receiver must ignore one that omits it rather
            than inventing a tier.
    Refuse:
      type: object
      required: [type, contract, reason]
      additionalProperties: false
      properties:
        type: { const: refuse }
        contract: { type: integer }
        reason:
          type: string
          description: Human-readable; shown in the UI, never swallowed.
    Ping:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: ping }
        id: { type: integer }
    Pong:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: pong }
        id: { type: integer }
    Bye:
      type: object
      required: [type, code]
      additionalProperties: false
      properties:
        type: { const: bye }
        code:
          enum: [normal, shutting-down, protocol-error]
          description: >
            Why the sender is closing, WS-close-code style. Distinguishes a
            calm "guest quit" from a failure in the peer's UI and lets the
            peer free state without waiting out the keepalive window.
        reason:
          type: string
          description: Optional human-readable detail; shown, never parsed.
    Error:
      type: object
      required: [type, code, message]
      additionalProperties: false
      properties:
        type: { const: error }
        id:
          type: integer
          description: Echoes the failed request's id when there is one.
        code:
          type: string
          description: Stable machine-readable slug, e.g. "capture-no-memory".
        message: { type: string }
    CommandRequest:
      type: object
      required: [type, id, name]
      additionalProperties: false
      properties:
        type: { const: command.request }
        id: { type: integer }
        name:
          type: string
          description: >
            A command from the x-commands registry below. An unknown name is
            answered with ok=false, error code "unknown-command" — never a
            protocol error; that is what keeps commands additive.
        args:
          type: object
          description: >
            Per-command arguments, typed; schema in x-commands. What a
            caller that KNOWS the command sends.
        line:
          type: string
          description: >
            The raw text after the command name, exactly as a human typed
            it — what a CONSOLE sends, because a console knows no
            command's grammar (see the two-callers rule in the preamble).
            The receiver parses it with that command's own grammar, which
            is therefore implemented once, on the machine that serves the
            verb.

            PRESENCE IS THE SIGNAL, and an empty string is present: it
            says "a human typed this command with no arguments", which is
            not the same request as a typed call with no args. gestalt is
            the command where the two differ — absent `line` returns every
            group (what a module asks for), `line: ""` returns the
            snapshot a human wants to read.

            SYMMETRY: command.request has only ever travelled host to guest.
            The guest's own console runs its commands in-process and never
            asks the host to run one, and the host serves no commands — so
            this field adds no asymmetry, because the other direction does
            not exist yet. If it ever does, `line` means the same thing
            there: the raw text a human typed, parsed by the receiver.

            `args` wins if both arrive: a caller that filled in the typed
            field asked for something specific. A receiver that predates
            this field ignores it and sees a bare command — so a console
            line reaching such a guest runs that command's no-argument
            behaviour instead of failing. Stated plainly because it is the
            one dishonest edge in an otherwise additive field: on a guest
            older than this revision's date, `ls Lab:Code` lists the root.
    CommandResult:
      type: object
      required: [type, id, ok]
      additionalProperties: false
      properties:
        type: { const: command.result }
        id: { type: integer, description: Echoes the request id. }
        ok: { type: boolean }
        output:
          type: object
          description: Present when ok; schema per command in x-commands.
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable slug, e.g. "unknown-command".
            message: { type: string }
    ExecRequest:
      type: object
      required: [type, id, line]
      additionalProperties: false
      properties:
        type: { const: exec.request }
        id:
          type: integer
          description: >
            Correlates every exec.output and the exec.result, and IS the
            exec's identity for exec.cancel. There is no separate session
            field, for the same reason a stream's id is its capture.begin
            id: a second identifier is a second thing to get wrong.
        line:
          type: string
          description: >
            The whole line, exactly as typed, INCLUDING the verb. This is
            the field the plane exists for and the one rule about it is
            that the sender does not look inside it. Contrast
            CommandRequest.line, which is the text AFTER a name the host
            already split off — that split is a host-side grammar, and
            removing it is most of what makes this plane honest.

            An empty line is a no-op answered ok with no output, not an
            error: a human pressing return at a prompt has asked for
            nothing, which is a thing a console does constantly.

            NOT DECLARED, ON PURPOSE. No x-commands entry constrains this
            string, and none ever should. A guest may interpret it with
            its command table (all of them do today), and a guest that
            one day hands it to some other interpreter is conforming, not
            extending. The contract's silence here is load-bearing.
    ExecOutput:
      type: object
      required: [type, id, seq, text]
      additionalProperties: false
      properties:
        type: { const: exec.output }
        id: { type: integer, description: Echoes the request id. }
        seq:
          type: integer
          description: >
            0-based, contiguous, per exec. The host renders in seq order
            and a gap is a bug worth surfacing rather than papering over.
        text:
          type: string
          description: >
            Free text — the bytes the guest's OWN console would have
            shown for this line. Deliberately unstructured: a plane that
            does not know the command cannot know its columns, and the
            [label, value] rows of the typed plane are exactly the cage
            this escapes. Embedded newlines are ordinary content; a frame
            is a chunk, not a line, and carries no promise of ending on a
            line boundary.

            ENCODING: the guest's text is MacRoman; the host decodes it
            as MacRoman and must not assume UTF-8. A guest sends what it
            would have drawn, not a transcoding of it.
    ExecResult:
      type: object
      required: [type, id, ok]
      additionalProperties: false
      properties:
        type: { const: exec.result }
        id: { type: integer, description: Echoes the request id. }
        ok: { type: boolean }
        code:
          type: string
          description: >
            Present when ok is false. Stable slug — "unknown-command"
            when the interpreter did not recognise the line,
            "not-running" for a cancel naming an exec that has already
            finished, "cancelled" for one that was stopped.
        message:
          type: string
          description: >
            The guest's own words, rendered as-is. The host never
            composes a failure sentence of its own: it does not know what
            the line was supposed to do.
      description: >
        TERMINAL STATUS ONLY — this message carries no output, ever. The
        text lives in exec.output, including for a guest that sends
        exactly one. Splitting them is what lets streaming arrive later
        as a guest-only change.
    ExecInput:
      type: object
      required: [type, id, text]
      additionalProperties: false
      properties:
        type: { const: exec.input }
        id:
          type: integer
          description: The exec.request this line is an answer to.
        text:
          type: string
          description: >
            One line, as a human typed it, answering a prompt the guest sent
            as exec.output. Unsolicited input - for an exec that is not
            waiting, or an id that is not running - is DROPPED, not buffered:
            a line typed at a prompt that has already gone would otherwise be
            answered into the next one, which is how a console runs something
            nobody meant.

            THE WAIT IS BOUNDED AND THE GUEST SAYS SO. A classic Mac is
            cooperatively scheduled, so a guest waiting forever on this
            message is a machine that needs a power cycle. A guest that
            prompts must bound its wait, must keep pumping while it waits so
            it stays answerable, and must treat exec.cancel as an immediate
            end. The reference implementation is now_exec_read_input
            (now-guest-ppc/src/core/wire.c) at 30 seconds.
    ExecCancel:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: exec.cancel }
        id:
          type: integer
          description: >
            The exec.request id to stop. Always answered with an
            exec.result — ok:false "cancelled" if it was stopped,
            ok:false "not-running" if the guest no longer has it. A
            cancel that goes unanswered is the wedge stream.stop was
            hardened against; this family inherits the rule rather than
            rediscovering it.
    CensusRequest:
      type: object
      required: [type, id, probe]
      additionalProperties: false
      properties:
        type: { const: census.request }
        id: { type: integer }
        probe:
          type: string
          description: >
            A probe from the x-census registry. An unknown probe is
            answered with outcome "refused" and a note — never a
            protocol error; that is what keeps the registry additive.
        cursor:
          type: integer
          description: Continue a paginated report from this index; 0 or
            absent starts the probe over.
    CensusReport:
      type: object
      required: [type, id, probe, outcome, rows, more]
      additionalProperties: false
      properties:
        type: { const: census.report }
        id: { type: integer, description: Echoes the request id. }
        probe: { type: string }
        outcome:
          enum: [present, absent, partial, refused, failed, not-attempted]
          description: >
            Semantics in x-census. The distinction is load-bearing;
            "absent" (the machine said no) is never conflated with
            "refused" (the responder declined to look).
        rows:
          type: array
          maxItems: 16
          description: >
            One page of [name, raw, meaning] string triples. The raw
            value always survives beside the decoded meaning; a value
            the responder cannot decode keeps its raw form and says so
            in the meaning column rather than being dropped.
          items:
            type: array
            minItems: 3
            maxItems: 3
            items: { type: string }
        more: { type: boolean }
        cursor:
          type: integer
          description: Pass back to continue; meaningful only when more.
        total:
          type: integer
          description: Total rows the probe will yield, when known.
        note:
          type: string
          description: >
            One human sentence about the outcome — why partial, why
            refused, what "absent" means on this machine.
    CaptureRequest:
      type: object
      required: [type, id, depth]
      additionalProperties: false
      properties:
        type: { const: capture.request }
        id: { type: integer }
        depth: { enum: [1, 2, 4, 8, 16, 32] }
        chunkKb: { type: integer, minimum: 1, maximum: 32 }
        paceMs: { type: integer, minimum: 0, maximum: 100 }
        pack: { type: boolean }
    StreamRequest:
      type: object
      required: [type, depth]
      additionalProperties: false
      properties:
        type: { const: stream.request }
        depth: { enum: [1, 2, 4, 8, 16, 32] }
    StreamStart:
      type: object
      required: [type, id, depth]
      additionalProperties: false
      properties:
        type: { const: stream.start }
        id:
          type: integer
          description: Stream id; every frame's capture.begin carries it.
        depth: { enum: [1, 2, 4, 8, 16, 32] }
        minIntervalMs:
          type: integer
          description: >
            Minimum ms between frame starts — the host's ceiling on frame
            rate. 0 or absent leaves the pace to the guest, which applies
            its own floor (~15 fps, backing off to ~4 while frames stay
            empty). Absent is not unbounded: an empty frame carries no
            pixels, so the wire alone does not pace one.
        chunkKb: { type: integer, minimum: 1, maximum: 32 }
        paceMs: { type: integer, minimum: 0, maximum: 100 }
        pack: { type: boolean }
        predictive:
          type: boolean
          description: Read only predicted-dirty rows plus a sweep.
        interlace:
          type: boolean
          description: Capture and send alternate decimated fields.
      description: >
        Tuning fields are the initiator's knobs: absent ones fall back
        to the guest's own panel settings, so a bare stream.start
        behaves exactly as before.
    StreamStop:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: stream.stop }
        id: { type: integer }
    StreamRefresh:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: stream.refresh }
        id: { type: integer }
      description: >
        Host asks for a keyframe: the guest's next frame is sent whole.
        Belt-and-suspenders against compositing drift; deltas reference
        the previous frame implicitly and TCP ordering makes that safe,
        so this should never be load-bearing.
    StreamStopped:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: stream.stopped }
        id: { type: integer }
        reason:
          type: string
          description: >
            Why the guest ended it, when the guest ended it ("busy: a
            transfer is in flight", "capture failed"); absent when
            acking the host's stream.stop.
    FileList:
      type: object
      required: [type, id, path]
      additionalProperties: false
      properties:
        type: { const: file.list }
        id: { type: integer }
        path:
          type: string
          description: Relative to the share root; "" is the root.
        cursor:
          type: integer
          description: Continue a paginated listing from this index.
    FileListing:
      type: object
      required: [type, id, path, entries, more]
      additionalProperties: false
      properties:
        type: { const: file.listing }
        id: { type: integer }
        path: { type: string }
        entries:
          type: array
          maxItems: 16
          items:
            type: object
            required: [name, kind]
            additionalProperties: false
            properties:
              name: { type: string }
              kind: { enum: [folder, file] }
              fileType: { type: string }
              creator: { type: string }
              dataBytes: { type: integer }
              rsrcBytes: { type: integer }
              modified:
                type: integer
                description: Classic Mac seconds since 1904.
              identity:
                type: string
                maxLength: 16
                pattern: "^[0-9a-f]{16}$"
                description: >
                  Opaque responder-generated catalog identity for this exact
                  observation. It is not a path or an authorization token.
                  A mutation may carry it back only as a guest-side
                  precondition recomputed immediately before acting.
        more: { type: boolean }
        cursor: { type: integer }
        root:
          type: string
          description: >
            What the responder is sharing, as that machine would write
            it ("Macintosh HD:Lab:", "/Users/me/Downloads"). Display
            only — never a path to send back, since everything on the
            wire is relative to this. Sent with the root listing so the
            asker can name the place it is looking at instead of
            calling it "the share".
    ProcessList:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: process.list }
        id: { type: integer }
        cursor:
          type: integer
          description: Continue a paginated listing from this index.
    ProcessListing:
      type: object
      required: [type, id, processes, more]
      additionalProperties: false
      properties:
        type: { const: process.listing }
        id: { type: integer }
        processes:
          type: array
          maxItems: 24
          items:
            type: object
            required: [name, kind]
            additionalProperties: false
            properties:
              name: { type: string }
              kind:
                enum: [application, background, finder]
                description: >
                  The responder's classification. background is a faceless
                  process (no user windows or menu bar); finder is that
                  machine's Finder/desktop.
              code:
                type: string
                description: >
                  The process "type" four-character code (e.g. "APPL"), as
                  the responding OS reports it; absent when it has none.
              creator:
                type: string
                description: The process creator four-character code.
              sizeKB:
                type: integer
                description: The process's memory partition, in KB.
              front:
                type: boolean
                description: The one frontmost process on that machine.
              psnHigh:
                type: integer
                description: >
                  High half of the process serial number. The PSN names a
                  running process to the drive verbs (process.front /
                  process.quit): it is valid only while the process lives,
                  so a stale one is refused rather than acted on.
              psnLow:
                type: integer
                description: Low half of the process serial number.
              isSelf:
                type: boolean
                description: >
                  True on the ONE row that is the responder itself — the
                  process serving this listing, and so the process on the
                  other end of this connection. Absent or false on every
                  other row.

                  This is how a caller learns WHICH process a connection
                  belongs to, and it is the only honest answer: a name is
                  not it. An application's file name and the version it
                  reports in `hello` are two independent strings that
                  agree only by convention, so a name derived from a
                  hello ("NOW-68K " + version) names the running process
                  only while nobody has renamed a build — and on
                  2026-07-25 a build deployed as 0.18 whose binary said
                  0.16 made a retire step ask a guest to quit a process
                  that did not exist. It answered honestly, the old build
                  kept running, and a 4 MB machine was left with two.

                  So: read the PSN off the isSelf row of a connection's
                  own listing, and drive THAT. The responder also refuses
                  process.quit for this row (it would sever the reply
                  mid-send), which a UI can say up front instead of
                  discovering.
        more: { type: boolean }
        cursor: { type: integer }
    ProcessFront:
      type: object
      required: [type, id, psnHigh, psnLow]
      additionalProperties: false
      properties:
        type: { const: process.front }
        id: { type: integer }
        psnHigh:
          type: integer
          description: >
            High half of the target's PSN, echoed from a process.listing
            entry. The responder re-validates it against a live process
            and refuses if it has gone.
        psnLow: { type: integer }
    ProcessQuit:
      type: object
      required: [type, id, psnHigh, psnLow]
      additionalProperties: false
      properties:
        type: { const: process.quit }
        id: { type: integer }
        psnHigh:
          type: integer
          description: High half of the target's PSN, as process.front.
        psnLow: { type: integer }
    ProcessShot:
      type: object
      required: [type, id, psnHigh, psnLow]
      additionalProperties: false
      properties:
        type: { const: process.shot }
        id: { type: integer }
        psnHigh:
          type: integer
          description: >
            High half of the target's PSN. The guest brings that process
            forward, waits for it to repaint, then captures ONLY its front
            window and delivers the crop over the capture transport
            (capture.begin/bulk/end), correlated by this id exactly as a
            plain capture.request. On any failure it answers capture.end
            ok:false with this id, so the requester never waits forever.
        psnLow: { type: integer }
        depth:
          enum: [1, 2, 4, 8, 16, 32]
          description: Capture bit depth; the guest's preference if omitted.
    ProcessResult:
      type: object
      required: [type, id, ok]
      additionalProperties: false
      properties:
        type: { const: process.result }
        id: { type: integer }
        ok: { type: boolean }
        reason:
          type: string
          description: Present when ok is false; why the verb did not apply.
    SoftwareList:
      type: object
      required: [type, id, domain]
      additionalProperties: false
      properties:
        type: { const: software.list }
        id: { type: integer }
        domain:
          enum: [apps, extensions, cdevs, startup, apple]
          description: >
            apps sweeps the startup volume's catalog for applications;
            the rest enumerate the System Folder's special folders,
            disabled siblings included.
        cursor:
          type: integer
          description: >
            1-based over the responder's cached inventory. 1 (or absent)
            rebuilds the cache — for apps, the whole sweep.
    SoftwareListing:
      type: object
      required: [type, id, domain, entries, more]
      additionalProperties: false
      properties:
        type: { const: software.listing }
        id: { type: integer }
        domain: { type: string }
        entries:
          type: array
          maxItems: 10
          items:
            type: object
            required: [name, path]
            additionalProperties: false
            properties:
              name: { type: string }
              path:
                type: string
                description: >
                  Full HFS path — the launch key. Empty when the parent
                  chain could not be named honestly (too deep, or the
                  walk failed); such an entry is listed but not
                  launchable from afar.
              type: { type: string, description: Finder type 4CC. }
              creator: { type: string, description: Finder creator 4CC. }
              sizeK:
                type: integer
                description: Data + resource forks; -1 when unreadable.
              off:
                type: boolean
                description: In an Extensions Manager disabled folder.
              running:
                type: boolean
                description: Joined against the responder's processes.
              version:
                type: string
                description: >
                  The 'vers' short version string, read per SERVED
                  entry — a page's worth of fork opens per request, an
                  explicitly bounded cost, never a whole-inventory
                  walk. Absent when the file has no readable 'vers'.
        more: { type: boolean }
        cursor: { type: integer, description: Where the next page starts. }
        note:
          type: string
          description: >
            The honest edges: "no such domain", or the inventory
            truncated at the responder's cache.
    FileGet:
      type: object
      required: [type, id, path]
      additionalProperties: false
      properties:
        type: { const: file.get }
        id: { type: integer }
        path: { type: string }
        container:
          enum: [auto, data, macbinary]
          description: >
            auto (default) applies the container rule; macbinary forces
            the whole artifact.
        offset:
          type: integer
          description: >
            Resume: start the bulk stream at this byte instead of zero.
            Absent or 0 is a fresh pull. The requester is the receiver,
            so the offset is simply how much it already holds.
        resumeToken:
          type: string
          description: >
            The token the guest gave in the file.begin of the interrupted
            attempt. Required whenever offset > 0: the guest recomputes
            its token for the file as it stands NOW and refuses `changed`
            if it differs, because appending the tail of a file onto the
            head of a different one is worse than starting over. Absent
            with offset > 0 is refused `changed` as well — resuming
            blind is not offered.
    FileOffer:
      type: object
      required: [type, id, name, path, container, bytes]
      additionalProperties: false
      properties:
        type: { const: file.offer }
        id: { type: integer }
        name:
          type: string
          description: >
            Leaf name as it should land, already sanitized for HFS by
            the sender (<= 31 characters, no colons, MacRoman-encodable).
        path:
          type: string
          description: >
            Destination FOLDER, relative to the share root; "" is the
            root itself.
        createParents:
          type: boolean
          description: >
            Absent or true preserves the human Files lane: missing parent
            folders are created inside the share. False requires the exact
            destination folder to exist and refuses before mutation.
        container: { enum: [data, macbinary] }
        bytes:
          type: integer
          description: Exact size of the bulk stream to follow.
        fileType: { type: string }
        creator: { type: string }
        modified: { type: integer }
        overwrite:
          type: boolean
          description: >
            Absent or false means an existing file refuses `exists`;
            the sender may retry with true once a human has agreed.
        resumeToken:
          type: string
          description: >
            Stable identity of the SOURCE file, computed by the sender
            and never interpreted by the receiver — it only stores the
            token beside the partial and compares it later. It must
            change whenever the bytes would differ. The receiver answers
            file.accept with `have` > 0 only when it holds a partial
            recorded under this exact token, so an offer with no token,
            or with a token it has not seen, always starts at zero.
    FileAccept:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: file.accept }
        id: { type: integer }
        have:
          type: integer
          description: >
            Bytes of THIS file the receiver already holds from an
            interrupted attempt, and therefore the offset the sender
            should begin at. Absent or 0 means start from the beginning.
            Only ever non-zero when the offer carried a resumeToken
            matching a partial the receiver still has.
        freeBytes:
          type: integer
          minimum: 0
          description: >
            Receiver-observed free bytes before reserving this transfer.
            Optional for older receivers and when the volume cannot report it.
        reservedBytes:
          type: integer
          minimum: 0
          description: >
            Remaining stream bytes for which the receiver successfully
            reserved disk space before accepting.
        staging:
          enum: [same-folder-temp]
          description: >
            Accepted bytes land under a temporary name in the destination
            folder and cannot appear under the final name before validation.
    FileDone:
      type: object
      required: [type, id, ok]
      additionalProperties: false
      properties:
        type: { const: file.done }
        id: { type: integer }
        ok: { type: boolean }
        code:
          enum: [exists, bad-path, io-error, too-big, cancelled, corrupt]
        reason: { type: string }
        received:
          type: integer
          minimum: 0
          description: Receiver-confirmed stream bytes at this outcome.
        crc32:
          type: integer
          description: Receiver-computed CRC-32 of the complete stream.
        finalization:
          enum: [same-folder-rename]
          description: Present only after the temporary item took its final name.
        cleanup:
          enum: [temp-renamed, temp-discarded, partial-retained, unknown]
          description: What happened to the receiver's staging artifact.
    FileProgress:
      type: object
      required: [type, id, received]
      additionalProperties: false
      description: >
        Sent by whichever side is receiving a file, carrying the byte
        count it has actually written from the wire. Advisory: it is
        dropped rather than queued when the control queue is busy, so a
        receiver must treat it as a floor that may skip, never as a
        sequence. Absence means an older peer, not a stalled one.
      properties:
        type: { const: file.progress }
        id:
          type: integer
          description: The file.offer id this progress belongs to.
        received:
          type: integer
          description: >
            Bytes received so far, counted where they are written, not
            where they were sent.
    FileRefuse:
      type: object
      required: [type, id, code]
      additionalProperties: false
      properties:
        type: { const: file.refuse }
        id: { type: integer }
        code:
          enum: [busy, exists, bad-path, not-found, io-error, too-big,
                 changed]
        reason: { type: string }
    FileBegin:
      type: object
      required: [type, id, transfer, name, container, bytes]
      additionalProperties: false
      properties:
        type: { const: file.begin }
        id: { type: integer }
        transfer: { type: integer }
        name: { type: string }
        container: { enum: [data, macbinary] }
        bytes: { type: integer }
        dataBytes: { type: integer }
        rsrcBytes: { type: integer }
        fileType: { type: string }
        creator: { type: string }
        modified: { type: integer }
        offset:
          type: integer
          description: >
            First byte of the file this stream carries. Absent or 0 is a
            whole file. `bytes` remains the size of the WHOLE file, not
            of the stream, so a receiver's progress and a human's
            progress bar mean the same thing on a resumed transfer as on
            a fresh one.
        resumeToken:
          type: string
          description: >
            Identity of the file being sent, for the receiver to store
            beside a partial so a later attempt can prove it is the same
            file. On a pull this is the guest's token for its own file;
            on a push it echoes the offer's.
    FileEnd:
      type: object
      required: [type, id, transfer, ok]
      additionalProperties: false
      properties:
        type: { const: file.end }
        id: { type: integer }
        transfer: { type: integer }
        ok: { type: boolean }
        sendMs: { type: integer }
        crc32:
          type: integer
          description: >
            CRC-32 (IEEE, the zlib polynomial) of the WHOLE file's wire
            bytes. Optional for compatibility: absent means unchecked,
            never correct. A mismatch deletes the partial rather than
            keeping corrupt bytes as a retry candidate.
    FileMove:
      type: object
      required: [type, id, path, toPath]
      additionalProperties: false
      properties:
        type: { const: file.move }
        id: { type: integer }
        path:
          type: string
          description: The item now, relative to the share root.
        toPath:
          type: string
          description: >
            Where it should be, relative to the share root, including
            its name — so a rename and a move are the same operation.
            Missing parent folders are NOT created: moving into a
            folder that is not there is a mistake, not an instruction.
        overwrite: { type: boolean }
    FileTrash:
      type: object
      required: [type, id, path]
      additionalProperties: false
      properties:
        type: { const: file.trash }
        id: { type: integer }
        path: { type: string }
    FileRestore:
      type: object
      required: [type, id, trashedAs, toPath]
      additionalProperties: false
      properties:
        type: { const: file.restore }
        id: { type: integer }
        trashedAs:
          type: string
          description: >
            The item's name inside the Trash, as file.trash reported it.
        toPath:
          type: string
          description: >
            Where to put it back, relative to the share root and
            including its name. The enclosing folder must still exist:
            restoring into a folder we invented would put the item
            somewhere it never was.
    FileMkdir:
      type: object
      required: [type, id, path]
      additionalProperties: false
      properties:
        type: { const: file.mkdir }
        id: { type: integer }
        path:
          type: string
          description: The folder to create, relative to the share root.
    FileResult:
      type: object
      required: [type, id, ok]
      additionalProperties: false
      properties:
        type: { const: file.result }
        id: { type: integer }
        ok: { type: boolean }
        path:
          type: string
          description: Where the item ended up, when that is expressible.
        trashedAs:
          type: string
          description: >
            Answering file.trash: the name the item landed under inside
            the Trash. Pass it back to file.restore.
        code:
          enum: [exists, bad-path, not-found, io-error, busy]
        reason: { type: string }
        crc32:
          type: integer
          description: >
            CRC-32 (IEEE, the zlib polynomial) of the WHOLE file's bytes,
            not of this stream — so a file stitched from two attempts is
            checked as the thing it is meant to be. Optional: absent
            means the sender did not compute one, which a receiver must
            treat as "unchecked", never as "correct". A receiver that
            computes a mismatch answers file.done ok:false code:corrupt
            and keeps nothing.

    FileCancel:
      type: object
      required: [type, transfer]
      additionalProperties: false
      properties:
        type: { const: file.cancel }
        transfer: { type: integer }
    CaptureOffer:
      type: object
      required: [type, id, width, height, depth, rowBytes, bytes]
      additionalProperties: false
      properties:
        type: { const: capture.offer }
        id:
          type: integer
          description: >
            Guest-chosen id; the capture.accept / capture.refuse answer and
            the eventual capture.begin all carry it. A separate id space
            from capture.request — origins never share correlation.
        width: { type: integer }
        height: { type: integer }
        depth: { enum: [1, 2, 4, 8, 16, 32] }
        rowBytes: { type: integer }
        bytes:
          type: integer
          description: Exact bulk-stream size — the capture is already
            encoded when the offer is sent.
        paletteBytes: { type: integer }
        encoding: { enum: [raw, packbits] }
        captureMs: { type: integer }
        encodeMs: { type: integer }
    CaptureAccept:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: capture.accept }
        id: { type: integer }
    CaptureRefuse:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: capture.refuse }
        id: { type: integer }
        reason:
          type: string
          description: Human-readable; it lands in the guest's panel.
    CaptureCancel:
      type: object
      required: [type, transfer]
      additionalProperties: false
      properties:
        type: { const: capture.cancel }
        transfer:
          type: integer
          description: >
            The transfer to abandon, from capture.begin. A guest that is no
            longer sending that transfer ignores the message.
    CaptureBegin:
      type: object
      required: [type, id, transfer, width, height, depth, rowBytes, bytes]
      additionalProperties: false
      properties:
        type: { const: capture.begin }
        paletteBytes:
          type: integer
          description: >
            Leading bytes of the bulk stream holding the palette as RGB
            triples (indexed depths <= 8); 0 for direct colour. Sending the
            guest's own CLUT means the host needs no hardcoded table.
        encoding:
          enum: [raw, packbits]
          description: >
            raw = rows verbatim. packbits = each row PackBits-compressed and
            prefixed with a big-endian u16 packed length. NOT PICT: modern
            macOS cannot decode QuickDraw pictures, so the wire uses a format
            both sides own (PICT remains the guest's on-disk format).
        captureMs:
          type: integer
          description: Guest-side screen blit time, for tuning.
        encodeMs:
          type: integer
          description: Guest-side encode time, for tuning.
        id:
          type: integer
          description: The capture.request id, or a guest-chosen id for
            captures initiated on the guest.
        transfer: { type: integer, minimum: 1, maximum: 65535 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        depth: { enum: [1, 8, 16, 32] }
        rowBytes: { type: integer, minimum: 1 }
        bytes:
          type: integer
          minimum: 1
          description: Total bulk bytes to expect (rowBytes * height).
        frame:
          enum: [key, delta, empty]
          description: >
            Stream frames only (absent on one-shot captures). "key" is a
            whole screen; "delta" carries only the rects, referencing the
            previous frame implicitly (TCP ordering makes that safe);
            "empty" means nothing changed - bytes is 0 and no bulk
            follows, so a static screen still ticks at full rate for
            ~150 bytes a frame.
        rects:
          type: array
          maxItems: 16
          items:
            type: array
            minItems: 4
            maxItems: 5
            description: >
              [row, nRows, colByteOffset, colBytes, rowStep?] - dirty
              rows trimmed to their changed column span, in BYTES into
              the row so the wire stays depth-agnostic. The bulk payload
              is the rects' rows in order, each row's slice encoded
              exactly like a full row (u16-prefixed PackBits, or raw).
              rowStep (default 1) strides the destination rows: an
              interlaced field sends rowStep 2, patching rows row,
              row + 2, ... while the other parity waits for the next
              field.
            items: { type: integer }
    CaptureEnd:
      type: object
      required: [type, id, transfer, ok]
      additionalProperties: false
      properties:
        type: { const: capture.end }
        id: { type: integer }
        transfer: { type: integer }
        ok: { type: boolean }
        sendMs:
          type: integer
          description: Guest-side time spent streaming the bulk chunks.

    # THE SCENE FAMILY. A scene is Mirror's IR v1 — semantic structure, not
    # pixels — and it is a TRANSFER, not a control message, because it does
    # not fit a control frame: NOW's own producer encodes 1193 B for 4
    # processes / 3 windows and 9214 B for 24 / 32, against a 4096-byte cap
    # (wire_limits.h), before menus or controls exist at all.
    # docs/streaming-a-scene.md argues the shape; the short form is that a
    # scene gets the pair capture already has, and only the BOUNDED HALF of
    # that pair is built here. There is deliberately no scene bracket: a
    # picture bracket exists to amortise a 0.5-0.6 s capture, and a semantic
    # walk has no such cost to amortise. If a metal measurement ever says
    # otherwise, the bracket gains a subject at stream.start — it does not
    # gain a second ownership model.
    SceneRequest:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: scene.request }
        id: { type: integer }
        chunkKb: { type: integer, minimum: 1, maximum: 32 }
        paceMs: { type: integer, minimum: 0, maximum: 100 }
        staleAfterMs:
          type: integer
          minimum: 0
          description: >
            How old an anchor sample may be and still be reported clean.
            An older-but-otherwise-valid anchor is REPORTED stale
            (apps[].error "now_anchor_stale"), never silently dropped and
            never a refusal. 0 or absent disables the age gate.
    SceneBegin:
      type: object
      required: [type, id, transfer, bytes, irVersion]
      additionalProperties: false
      properties:
        type: { const: scene.begin }
        id:
          type: integer
          description: The scene.request id this answers.
        transfer: { type: integer, minimum: 1, maximum: 65535 }
        bytes:
          type: integer
          minimum: 1
          description: >
            Total bulk bytes of UTF-8 JSON to expect — the encoded IR
            document, terminator excluded.
        irVersion:
          type: integer
          minimum: 1
          description: >
            The scene IR major version, the SAME number the document's own
            `version` carries (mirror/docs/IR-V1.md, "one number, two
            places"); the guest copies both from one constant. It is
            repeated HERE so a consumer can refuse an unknown major before
            it has spent a transfer decoding the body. That order — read
            the version, refuse an unknown major, then decode — is the
            consumer duty IR-V1.md states, and the envelope is what makes
            it possible to obey.
        seq:
          type: integer
          description: The producer's monotonic scene counter.
        capturedAt:
          type: number
          description: >
            Guest-clock Unix epoch seconds at the walk. Present so a
            consumer can say "same scene, newer moment" without diffing.
        source:
          type: string
          maxLength: 16
          description: >
            The plane the scene was walked from ("peek" for NOW). IR v1
            promoted it precisely so a consumer can tell "no windows" from
            "windows not visible from here".
        walkMs:
          type: integer
          description: Guest-side time spent walking and encoding, for tuning.
    SceneEnd:
      type: object
      required: [type, id, transfer, ok]
      additionalProperties: false
      properties:
        type: { const: scene.end }
        id: { type: integer }
        transfer: { type: integer }
        ok: { type: boolean }
        reason:
          type: string
          description: >
            Why a scene could not be served, on ok:false. The failure is
            whole: a scene that would not fit its buffer, or a walk that
            went wrong, ends the transfer rather than delivering a partial
            document — a partial walk must never arrive as a complete
            scene.
        sendMs:
          type: integer
          description: Guest-side time spent streaming the bulk chunks.

  # The console command registry: the CLOSED set of commands a guest serves.
  # Every entry declares its args and output; the guest's dispatch table and
  # its own console are views of this list. The HOST console is not: it is a
  # dumb shell (see the two-callers rule in the preamble) and learns this set
  # at runtime, from the `help` command below.
  #
  # Each entry's `x-line` says what that command does with a console's raw
  # `line`. It is the whole of the argument grammar a human types, stated
  # where both halves read it — the receiver implements it, and the sender
  # is forbidden from knowing it. No x-line means the command takes no
  # console arguments and ignores the line.
  x-commands:
    help:
      description: >
        What commands THIS machine serves, asked of the machine that
        serves them. The host console carries no command list — there are
        two guests with different tables, and a hardcoded union would be
        wrong for both — so discovery is a request like any other, and a
        guest that implements three commands says three.

        A bare help lists every command with its one-line summary; a
        topic names one and returns its usage and detail. A guest too old
        to serve help answers unknown-command, which is itself the honest
        answer: that machine offers no discovery.
      args:
        type: object
        properties:
          topic:
            type: string
            description: One command name; absent lists them all.
      x-line: The topic, or empty for the list.
      output:
        type: object
        description: >
          Rows for a human to read, not a machine to parse. The list form
          is [name, summary] per command; the topic form is [label, text]
          with the usage first. A caller that needs the command NAMES can
          read the first column of the list form — that is the one
          structural promise here.
        properties:
          help: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    gestalt:
      description: >
        The guest's own account of itself, via the Gestalt Manager. A
        typed call (no `line`) always returns every group; a console line
        selects the slice a human asked for, guest-side — the host cannot
        slice what it does not understand.
      args: {}
      x-line: >
        Empty = the snapshot group alone. --full = every domain group.
        --cpu / --memory / --os / --network / --hardware = that one group.
      output:
        type: object
        description: >
          Grouped, ordered rows. Each group maps to an array of [label, value]
          string pairs, preserving order (unlike a plain object).

          `notice` is not a group of facts about the machine: it is the
          reply's account of itself, and today carries one row —
          ["truncated", "<n> rows omitted - reply buffer full"] — when the
          gather did not fit the responder's result buffer. It exists
          because without it a truncated reply and a machine with fewer
          facts to report are indistinguishable, and the difference matters:
          one is a limit of the wire, the other is the answer. A reader that
          treats every key as a group will show it as one, which is
          harmless; a reader that cares should look for it by name.
        properties:
          snapshot: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
          cpu: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
          memory: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
          os: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
          network: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
          hw: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
          notice: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
      x-rowArray:
        type: array
        items:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: string }
    ls:
      description: >
        List a folder in the guest's share. No path = the share root.
        Output rows: one per entry (name, then kind/type and sizes),
        capped for the console; the Files module uses file.list.
      args:
        path: { type: string }
      x-line: >
        The whole line is the path — HFS names contain spaces and need no
        quoting. Empty lists the share root.
      output:
        type: object
        properties:
          ls: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    put:
      description: >
        Send a file from the guest to the host. The argument names a
        file in the guest's own share; the transfer that follows is the
        ordinary file.offer -> file.accept -> file.begin -> bulk ->
        file.end sequence, so this command declares a WAY IN to that
        family rather than a second mechanism.

        The reply says the offer went out, not that the file arrived —
        the transfer runs afterwards and its outcome is read from
        file.done, or from the guest's own `xfer`. A command that
        blocked until a multi-megabyte file landed would hold a
        command.result for minutes.

        Declared because NOW-68K answers it on the wire. The PowerPC
        guest deliberately does not: a host driving that guest reaches
        the same capability by sending file.list and file.get, and has
        no need to type a verb. NOW-68K is the machine whose display
        fails and whose keyboard is sometimes the only face there is,
        and the host console that talks to it is a dumb shell with no
        knowledge of message families — so on that guest the capability
        has to be a verb on both faces or it is missing from one.
      args:
        name:
          type: string
          description: >
            The file's leaf name inside the guest's share. Not a path:
            the same "no colons, <= 31 characters" rule the file family
            applies everywhere else.
      output:
        type: object
        properties:
          put: { type: string }
    cancel:
      description: >
        Abandon the transfer in flight, in whichever direction it is
        going. The same thing file.cancel does over the wire, and it
        runs the same code — this declares a WAY IN to that message,
        not a second mechanism, exactly as `put` does for file.offer.

        Declared for the same reason `put` is, and it is the sharper
        case. The lane is one transfer wide across both directions, so
        a transfer nobody can end is a machine that will not transfer
        anything again; and the person most likely to need that is
        standing at a classic Mac whose host has stopped answering,
        which is precisely when the wire is not the face available.
        NOW-68K answers it; the PowerPC guest reaches the same
        capability from its own UI and from file.cancel, and declares
        no verb.

        Answers ok:false with code "nothing-to-cancel" when no transfer
        is in flight. That is a refusal, not a protocol error: asking a
        quiet machine to stop is a reasonable thing to have done, and
        the honest answer is that there was nothing to stop.
      args: {}
      output:
        type: object
        properties:
          cancel: { type: string }
    putstat:
      description: >
        Where the last file the guest RECEIVED spent its time: bytes,
        chunk and write counts, and the milliseconds inside FSWrite
        against the whole receive path. Measured on that machine, which
        is the only place the disk can be told apart from the wire —
        diagnosing a transfer from the far end of it is how several
        wrong theories got their evidence.
      args: {}
      output:
        type: object
        properties:
          putstat: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    tail:
      description: >
        The last lines of the guest's log for this launch. The log is a
        file per launch in a "now-logs" folder beside the application, so
        what happened survives a crash that takes the window, the status
        line and every in-memory buffer with it. The same command answers
        on that Mac's own console; this is the copy read from here, which
        matters because that machine is the harder one to look at.
      args:
        lines:
          type: integer
          description: How many, newest last. Default 20, most 40.
      x-line: >
        The first integer on the line is the count; anything else is
        ignored. Empty means the default.
      output:
        type: object
        properties:
          tail: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    vprobe:
      description: >
        Measure the guest's VRAM read cost by access method: raw
        framebuffer reads at 8/16/32/64-bit widths against the CopyBits
        baseline, reread caching, partial-read linearity, and pixel
        fidelity. A measurement surface for streaming work; the ~3 s run
        wants a still screen.
      args: {}
      output:
        type: object
        properties:
          vprobe: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    screenshot:
      description: >
        Capture the guest's screen. Slice one: the guest captures, encodes a
        packed PICT, and (unless save=false) writes it to its own desktop —
        pixels do not cross the wire yet; the result is the measurement rows.
        The bulk-channel transfer variant is the next contract step.
      args:
        type: object
        properties:
          depth:
            type: string
            enum: ["1", "2", "4", "8", "16", "32"]
            description: Capture depth; defaults to the guest panel setting.
          save:
            type: string
            enum: ["true", "false"]
            description: false = measure only, write nothing.
      x-line: >
        --depth N sets the depth; --no-save measures without writing.
        Unrecognised flags are ignored, never refused — a console
        typo must not cost a capture.
      output:
        type: object
        properties:
          screenshot:
            $ref: "#/components/x-commands/gestalt/x-rowArray"
    shotdiag:
      description: >
        Stage a capture down the guest's real wire path and report where it
        read from: the framebuffer base as the guest resolved it,
        StripAddress of that base, whether the machine is in 32-bit
        addressing at the moment of the walk, and the first sixteen bytes
        of row 0 as the walk sees them beside the same row as CopyBits
        copies it. Identical samples mean the base is right and the fault
        is downstream; different ones name the byte. A diagnostic, not a
        capture — the scratch file is discarded and nothing crosses the
        bulk channel. Runs a full screen read and pack, so it wants a
        still screen and costs what a capture costs.
      args: {}
      output:
        type: object
        properties:
          shotdiag: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    ps:
      description: >
        The guest's running processes, one row per process: the name, and
        its kind / size / whether it is frontmost. The console's flat read
        of the same Process Manager the Processes module drives — as ls is
        to file.list, ps is to process.list. Read-only; a process list is
        no more than the Application menu already shows. One generous page;
        the row count is small on this hardware, so it does not paginate.
      args: {}
      output:
        type: object
        properties:
          ps: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    census:
      description: >
        Run one hardware-census probe and return its rows. The console's
        flat, single-page read of the census the Hardware module pages
        through censusExchange — the same probe registry (x-census below),
        collapsed to [name, meaning] for a text surface. No probe name runs
        "overview". An unknown name is ok=false, never a protocol error, so
        the command set stays additive across versions.
      args:
        type: object
        properties:
          probe:
            type: string
            description: A probe name from x-census; empty runs "overview".
      x-line: >
        The first word that is not a flag is the probe; empty runs
        "overview".
      output:
        type: object
        properties:
          census: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    catsearch:
      description: >
        Time a whole-volume catalog search for applications: PBCatSearch
        over the receiver's startup volume matching file type APPL, run
        in short time slices — cold, then warm to expose caching. The
        measurement probe behind the Software module's planned inventory
        sweep; it answers whether a full application index is affordable
        on the machine's real disk before anything is built on that
        assumption. Read-only — the sweep reads the catalog, never a
        file. Seconds normally; bounded at ~20 s per pass on a disk
        that cannot answer faster.
      args: {}
      output:
        type: object
        properties:
          catsearch: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    sw:
      description: >
        The receiver's installed software, one page a domain. No domain
        is the overview — per-domain counts, enabled and disabled. The
        folder domains (extensions, cdevs, startup, apple) enumerate the
        System Folder's special folders live, including the Extensions
        Manager's disabled siblings, tagged "(off)". "apps" sweeps the
        startup volume's catalog for type APPL (the catsearch-verified
        sweep) and stops at one page rather than paying for hits nobody
        asked to see. Read-only; versions need a resource fork open per
        file and are deliberately not here.
      args:
        type: object
        properties:
          domain:
            type: string
            enum: ["apps", "extensions", "cdevs", "startup", "apple"]
            description: Empty or absent runs the overview.
      x-line: >
        The first word that is not a flag is the domain; empty shows the
        per-domain counts.
      output:
        type: object
        properties:
          sw: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    launch:
      description: >
        Open an application on the receiver: the software family's one
        mutation. A bare name is resolved by an exact-name catalog
        search of the startup volume; a full HFS path (contains a
        colon) is used directly, and non-APPL targets are refused. The
        name is the whole target after an optional flag — spaces need
        no quoting (surrounding quotes are stripped if used). When a
        bare name matches SEVERAL applications the responder launches
        the first found and the reply names its version (one fork open,
        not a walk). To force a copy: the leading flag "-v VERSION"
        matches a short version string ("-v 1.1.1 SimpleText"), a full
        path is exact, or "#n" picks from the last search's stored
        matches (which "vers <name>" prints). The launched app comes to that machine's
        front (LaunchApplication without launchDontSwitch), which the
        next process.listing or process.shot will show. Both outcomes
        are logged under the sw area with the wire id.
      args:
        type: object
        properties:
          target:
            type: string
            description: >
              "[-v VERSION] NAME", where NAME is the whole remainder
              (spaces need no quotes); or a full HFS path; or "#n" from
              the stored match list. "target" and not "name" — see the
              arg-key rule in the preamble above.
      x-line: >
        The whole line is the target, flags and all — the -v grammar is
        parsed here, by the machine that does the launching, so there is
        one parser and not two dialects.
      output:
        type: object
        properties:
          launch: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    quit:
      description: >
        Ask a RUNNING process on the receiver to quit, named the way a
        person names it — by the name `ps` and process.listing show.
        launch's opposite number, and the missing half of a
        deploy/probe/relaunch loop that otherwise needs a human at that
        machine's keyboard.

        This verb is a COMPOSITION over the process family, not a new
        capability: process.quit takes a PSN, and a PSN is meaningful
        only while the process it names lives, so the receiver lists,
        matches the name, re-validates, sends the 'quit' Apple Event,
        and then LISTS AGAIN. Each step of that has its own honest
        failure, and each is reported distinctly in the `Outcome` row
        rather than folded into a sentence:

          gone              asked, and a re-list confirms it is not there
          not-running       nothing of that name was running to ask
                            (the asked-for state already held)
          sent-unconfirmed  --no-wait: delivered, deliberately unverified
          still-running     asked, and STILL THERE at the deadline
          ambiguous         several processes share the name, no --all
          refused-self      the only match was the receiver's own NOW
          undeliverable     the Apple Event Manager would not send it
          bad-args          the argument line did not parse

        `ok` is true ONLY for gone, not-running and sent-unconfirmed. A
        still-running answer is ok:false, code "quit-declined" — because
        a 'quit' Apple Event is a REQUEST the target is free to decline
        (see kAEQuitApplication in the process.quit prose), an
        application holding an unsaved document stops to ask about it
        and stays running, and a caller whose next step assumes a freed
        port must not read that as success. Reporting a declined quit as
        ok would poison every measurement loop built on this verb.

        A NAME IS A HUMAN'S IDENTIFIER, and this verb is where it
        belongs — a person at a console types what `ps` shows them. A
        caller holding a process.listing should send process.quit with
        that row's PSN instead: the name it would pass here is capped at
        31 characters, is not unique, and is not derivable from the
        version a guest reports in `hello`. The two routes share one
        implementation below the seam; they differ only in how the
        target is named.

        Matching is by exact process name, case-insensitive (EqualString,
        diacritic-sensitive), against live processes only. Several
        matches refuse rather than pick one: quitting an arbitrary copy
        is worse than doing nothing. --all quits every match. The
        receiver never asks ITSELF to quit through this verb (that would
        sever the reply mid-send); a second, separate copy of NOW is a
        legitimate target. Quitting the receiver's Finder is NOT
        special-cased — the verb is honest, not paternal, and reports
        what happened.

        The confirmation wait is bounded (6 s by default, --wait N to
        20 s) and is a real stall on the receiver: a cooperative quit is
        only seen when the receiver yields the processor, so the receiver
        yields without dispatching its own events for that window. It
        keeps servicing this connection while it waits.
      args:
        type: object
        properties:
          target:
            type: string
            description: >
              "[--all] [--wait N | --no-wait] NAME", where NAME is the
              whole remainder of the line — process names contain
              spaces, so flags are LEADING and quotes are unnecessary
              (a fully quoted name is accepted). "target" and not
              "name" — see the arg-key rule in the preamble above.
      x-line: >
        The whole line, flags first: the name is the rest of it and may
        contain spaces, so --all / --wait N / --no-wait must precede it.
        Parsed here for the same reason as launch.
      output:
        type: object
        properties:
          quit: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    front:
      description: >
        Bring a RUNNING process on the receiver to the front, named the
        way a person names it — by the name `ps` and process.listing
        show. `quit`'s gentler sibling: the same list → match →
        re-validate → act composition over the same process family, and
        the same refusal to guess when several processes share a name.

        It exists because a capability that is only a message family is
        one a person cannot type. The host console is a dumb shell — it
        relays a line and knows nothing of process.front — so without
        this verb, fronting an application is reachable only from the
        Processes module, and not at all from the machine's own keyboard
        when that is the face that still works (docs/command-parity.md).

        THE OUTCOMES DIFFER FROM `quit`'s IN ONE WAY THAT MATTERS.
        `quit`'s not-running is ok:true, because the asked-for state
        (not running) already holds. Here it is ok:false: you cannot
        front what is not there, and a caller whose next step assumes a
        window is in front must not read "nothing by that name" as done.

          fronted       asked, and a re-check confirms it is frontmost
          unconfirmed   SetFrontProcess accepted it and it is not
                        frontmost at the deadline
          not-running   nothing of that name was running to front
          ambiguous     several processes share the name
          refused       the Toolbox would not bring it forward
          bad-args      the argument line did not parse

        `ok` is true ONLY for fronted. The switch is cooperative like a
        quit — the Process Manager makes it when the receiver next yields
        — so the receiver yields (without dispatching its own events) for
        a bounded couple of seconds and then reports which happened.

        Unlike `quit`, the receiver's OWN process is a legitimate target:
        bringing NOW forward severs nothing, where quitting it would cut
        the reply mid-send.
      args:
        type: object
        properties:
          target:
            type: string
            description: >
              NAME, the whole remainder of the line — process names
              contain spaces, so no quoting is needed (a fully quoted
              name is accepted). There are no flags. "target" and not
              "name" — see the arg-key rule in the preamble above.
      x-line: >
        The whole line is the name, spaces and all. No flags, so nothing
        has to lead.
      output:
        type: object
        properties:
          front: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    reveal:
      description: >
        Show an installed item in the RECEIVER's own Finder, selected in
        its enclosing window — the read-only companion to launch. It
        opens nothing and runs nothing: it sends the receiver's Finder a
        single "make objects visible" Apple Event (kAEMiscStandards /
        kAEMakeObjectsVisible) for the item's alias, then brings the
        Finder forward so the selection is not revealed behind another
        window. The item is resolved exactly as launch and vers resolve
        it — a bare name by exact-name catalog search (the first match
        when several share it), a full HFS path used directly, or "#n"
        from the stored match list — but ANY item is revealable, not only
        applications, since nothing is executed. Symmetric: whoever
        receives reveal reveals it in its OWN Finder, on its OWN screen.
      args:
        type: object
        properties:
          target:
            type: string
            description: >
              An item name, a full HFS path (the software.listing's
              path — the launch key doubles as the reveal key), or "#n"
              from the stored match list. "target" and not "name" — see
              the arg-key rule in the preamble above.
      x-line: The whole line is the target. Same reason as launch.
      output:
        type: object
        properties:
          reveal: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    vers:
      description: >
        One file's 'vers' resources — the short version, the numeric
        version and stage, the Get Info string, and the product (id 2)
        when present — read from that one file's resource fork alone
        (Get1Resource, never the chain: the System's 'vers' answering
        for a file that has none is the most convincing wrong answer).
        Bounded by design: a fork open per file is the measured
        expensive path, so this never loops an inventory — but a bare
        name that matches SEVERAL applications shows them all as a
        NUMBERED list, full paths wrapped across continuation rows
        (truncated paths were a metal complaint), up to five. The
        numbers are live: they are stored on the responder, and a
        following launch or vers may say just "#n". Resolution is
        launch's — bare name searches applications, a full path reads
        any file. Absence of a 'vers' is an answer.
      args:
        type: object
        properties:
          target:
            type: string
            description: >
              An application name, a full HFS path, or "#n" picking
              from the responder's stored match list. "target" and not
              "name" — see the arg-key rule in the preamble above.
      x-line: The whole line is the target. Same reason as launch.
      output:
        type: object
        properties:
          vers: { $ref: "#/components/x-commands/gestalt/x-rowArray" }

    # The act plane: winact / textget / textset. Declared 2026-07-31,
    # AHEAD OF ANY GUEST, which is legal by this file's own rule — adding a
    # command is additive and a peer that does not serve one answers
    # unknown-command cleanly. Declaring them is what lets the host publish
    # the three capabilities that project them and have each report itself
    # unavailable BY DERIVATION from the machine's own help table, rather
    # than from a requirement nothing can resolve. The 68K guest is
    # expected never to serve them; Mirror's act plane is PowerPC-only, and
    # nothing on the host side asks which guest answered.
    #
    # WHAT MAKES THESE ONE PLANE rather than three unrelated verbs: all
    # three address ONE element by an opaque reference the RESPONDER
    # minted, all three revalidate that reference against a live element
    # before acting, and none of them can express "whatever is frontmost".
    # That refusal is a measurement, not taste — upstream's request that
    # merely disarmed after one use rode the user's own press 18 times in
    # 20; the variant that had to name its exact target rode 0 in 20.
    #
    # AND WHAT THEY DO NOT CLAIM: an ok reply means the event was handed to
    # the addressed element's own application, never that the window moved
    # or the text changed. Whoever wants to know that reads the element
    # back. There is deliberately no "performed" field for a responder to
    # set true.
    winact:
      description: >
        Move, resize, zoom or close ONE window, by answering the owning
        application's own FindWindow. No mouse is simulated and no
        emulator is involved: the application is handed the answer it
        would have got had a person dragged the window, so it does what
        it would have done, and applications that police their own
        geometry keep policing it.

        The window is named by an opaque reference this responder minted
        for an element it observed, and revalidated here against a live
        WindowPtr before anything is dispatched. A reference for a window
        that has closed is refused; it is never resolved to a
        neighbouring one.

        move and resize carry their own geometry and the other two carry
        none. zoom takes none because the standard state is the
        application's to compute — a caller that supplied one would be
        deciding what the window is for. close takes none and is
        destructive: an application may lose unsaved work, or may put up
        a save dialog nothing on this wire can answer.
      args:
        type: object
        required: [window, action]
        properties:
          window:
            type: string
            description: >
              The opaque reference, "now-window-" and a UUID. Not a
              WindowPtr: a pointer into another process's heap is
              forgeable and means nothing once the window dies.
          action:
            type: string
            enum: [move, resize, zoom, close]
          left:
            type: integer
            description: Content origin, for move. QuickDraw Rect range.
          top:
            type: integer
          width:
            type: integer
            description: Content size, for resize. At least 1 point.
          height:
            type: integer
      x-line: >
        NOT TYPEABLE, and that is the point. A console line cannot carry
        an opaque reference a human never saw, and a grammar that let one
        name a window by title would be the target-free form this plane
        refuses. Typed callers only.
      output:
        type: object
        properties:
          winact: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    textget:
      description: >
        Read the text of ONE addressed text element. The read half of the
        act plane and the only third of it that changes nothing, which is
        why it is its own command: a machine whose owner consented to
        being read can serve this while refusing the two that drive it.

        Nothing is clicked or selected to read a field. The answer is a
        READING and is dated as one, and it says whether the element held
        more than the reply could carry — a caller that cannot tell a
        short field from a clipped one has been told nothing useful.
      args:
        type: object
        required: [element]
        properties:
          element:
            type: string
            description: >
              The opaque reference, "now-element-" and a UUID, minted by
              the observation that saw the element and revalidated here.
      x-line: >
        NOT TYPEABLE. Same reason as winact: the argument is a reference
        no human has.
      output:
        type: object
        properties:
          textget: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    textset:
      description: >
        Replace the whole contents of ONE addressed text element. A
        replacement and not an edit: there is no offset and no append
        form, because an offset into text the caller has not read is a
        write it cannot predict.

        An ok reply means the change was dispatched into the
        application's own text path. It is not a claim that the element
        now holds the new text — the application may refuse it, reformat
        it, or be modal elsewhere. Read it back with textget to learn
        that.
      args:
        type: object
        required: [element, text]
        properties:
          element:
            type: string
            description: The opaque reference, as textget takes it.
          text:
            type: string
            description: >
              The element's whole new contents. The host caps what it
              will send far inside the 16 KiB control frame; a responder
              that holds less says so in its own refusal rather than
              writing a truncated half.
      x-line: >
        NOT TYPEABLE. Same reason as winact and textget.
      output:
        type: object
        properties:
          textset: { $ref: "#/components/x-commands/gestalt/x-rowArray" }

    # The other half of the act plane, declared 2026-07-31 WITH a guest
    # that serves them. These three complete the mechanism the three
    # above depend on and cannot do without:
    #
    #   elements is the observation that MINTS the references the other
    #   five take. Without it the plane has no legal argument to send,
    #   and the only remaining way to address anything would be "the
    #   frontmost one" - the target-free form this plane refuses on the
    #   strength of a measurement.
    #
    #   ctlact and menuact are the same mechanism aimed at the other two
    #   things a person clicks. They are here rather than deferred
    #   because both are complete on the guest; the host rows that
    #   project them are owed, and a command a host does not yet project
    #   is an ordinary state for this file - the reverse of the three
    #   above, which were declared ahead of any guest.
    elements:
      description: >
        Name this Mac's on-screen elements, so that they can be acted
        on. Answers with an opaque, short-lived reference for each
        window, control and text field the walk can read, plus enough
        of the element's own title to tell them apart.

        Nothing else can produce these references, and that is the
        point rather than an inconvenience: an act addresses an element
        this Mac observed and revalidated, never a pointer a caller
        supplied and never "whatever is frontmost".

        THE SAME WALK AS `observe`, aimed by a process instead of by a
        scope, and answering in the same shape — one minter, one walk,
        one emitter, three doors. Two verbs that both produced
        references would be two systems making one token shape, and a
        caller holding one could not tell which it held.

        Defaults to the frontmost application. A reference ages out of
        a bounded table; one that has been recycled reads the same as
        one whose window closed, and both are true.
      args:
        type: object
        properties:
          serialHi:
            type: integer
            description: The process to observe. Omit for the frontmost.
          serialLo:
            type: integer
      x-line: >
        NOT TYPEABLE usefully. It takes no arguments a person has and
        answers with references no person can read.
      output:
        type: object
        properties:
          elements: { $ref: "#/components/x-commands/observe/x-axTree" }
    ctlact:
      description: >
        Act on ONE control, by answering the owning application's own
        TrackControl with the part code named. The application then
        runs its real mouse-down handler, and a control that policed
        its own behaviour keeps policing it.

        The request must name the control, and that requirement is a
        measurement rather than a preference: upstream's variant that
        merely disarmed after one use rode a real user's press 18 times
        in 20, and the variant that had to name its exact target rode
        it 0 in 20.

        An ok reply means the event was dispatched. A control with a
        live range also carries its re-read position, because for those
        the machine itself can be quoted; a push button has no such
        range and gets no such row.
      args:
        type: object
        required: [element, part]
        properties:
          element:
            type: string
            description: >
              The opaque reference, "now-element-" and a UUID, minted
              by elements and revalidated by the responder.
          part:
            type: integer
            description: >
              A Control Manager part code. The button parts are 10 and
              11; a scroll bar's are 20 up, 21 down, 22 page-up, 23
              page-down; 129 is the indicator.
      x-line: >
        NOT TYPEABLE. Same reason as winact: the argument is a
        reference no human has.
      output:
        type: object
        properties:
          ctlact: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    menuact:
      description: >
        Perform ONE menu command, by answering the owning
        application's own MenuSelect. No menu is drawn, no tracking
        loop runs, and nothing depends on mouse motion or timing - so
        an item with no keyboard shortcut becomes reachable.

        AND SO DOES AN ITEM THAT HAS ONE. This sentence used to say the
        opposite — that a shortcut should go through `key`, which is
        simpler and needs no patch — and that was upstream's advice on
        upstream's guest. It does not hold here: a menu shortcut is a
        Command keystroke, `key` on this Mac cannot carry a modifier at
        all (CarbonLib has no PPostEvent, so the queue element's
        modifiers are unreachable), and the Menu Manager matches on the
        virtual key code rather than the character even when it can. This
        verb is the route for BOTH kinds of menu item.

        titleLeft is where the press will land, and it is this act's
        identity check. A menu press carries no handle to name, so the
        identity checked is the press itself: a press anywhere else
        belongs to the person at the machine and is passed through
        untouched.

        An ok reply means the application's MenuSelect returned this
        item. What its command handler then did is the caller's to
        verify against this Mac's own state.
      args:
        type: object
        required: [menu, item, titleLeft]
        properties:
          menu:
            type: integer
            description: The menu's id, as the scene reports it.
          item:
            type: integer
            description: Its 1-based position in that menu.
          titleLeft:
            type: integer
            description: >
              The x of that menu's title in the menu bar. Required,
              not derived: without it there is no way to tell this
              act's press from the user's.
          serialHi:
            type: integer
            description: The application. Omit for the frontmost.
          serialLo:
            type: integer
      x-line: >
        NOT TYPEABLE. The identity check is a coordinate the scene
        supplies, not one a person types.
      output:
        type: object
        properties:
          menuact: { $ref: "#/components/x-commands/gestalt/x-rowArray" }

    # THE MACHINE'S OWN STATE. Two verbs folded in from the parked
    # timbottu/mirror project (docs/mirror-wave3-verdicts.md), declared
    # 2026-07-31 with the dispatch that answers them. They sit beside the
    # act plane because that is what they are about, but neither takes an
    # element: one names a PROCESS, the other names nothing at all.
    activate:
      description: >
        Bring ONE process forward, named by its process serial number.

        Not a second `front`. `front` takes a NAME and refuses when
        several match; this takes the identity an observation minted,
        which is what a driver holds and what the host's own action
        dispatcher already sends. Underneath both reach the single
        SetFrontProcess in the guest — this verb does not add a second.

        The reply reports whether the switch is OBSERVABLE, never merely
        that it was accepted. A cooperative switch lands when the
        answering application yields, so "asked" and "is now frontmost"
        are two readings and keep two words.
      args:
        type: object
        required: [serialHi, serialLo]
        properties:
          serialHi:
            type: integer
            description: >
              The high half of the process serial. Required WITH
              serialLo: half a serial names no process, and the two are
              refused apart rather than defaulted together.
          serialLo:
            type: integer
      x-line: The two serial numbers, high then low, separated by a space.
      output:
        type: object
        properties:
          activate: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    actselftest:
      description: >
        Prove the act plane's trap calling convention, in one process,
        from inside the machine.

        It matters more than its size. A patch whose result lands in the
        wrong slot does not crash — it LIES: it reports firing, every
        counter the plane owns says success, and the application reads a
        value that was never the one we wrote and takes the other
        branch. Every other instrument on this plane reads OUR side of
        the call; this one reads the caller's, by making a real
        MenuSelect at a point outside the menu bar, answering its own
        call, and comparing.

        Side-effect free by construction. Point (0,0) is outside the
        menu bar, so an unanswered call returns 0 immediately without
        drawing or tracking anything, and the arm point is negative —
        the one op on this plane that rides no user click at all.

        NOT `portalselftest`. Upstream's name is after a component this
        product does not have; what is tested here is NOW's act plane.
      args:
        type: object
        properties:
          serialHi:
            type: integer
            description: >
              OPTIONAL, and optional as a PAIR: both absent means the
              front process, which is what a caller who just wants the
              ABI answered means.
          serialLo:
            type: integer
      x-line: >
        Empty for the front process, or the two serial numbers, high
        then low.
      output:
        type: object
        properties:
          actselftest: { $ref: "#/components/x-commands/gestalt/x-rowArray" }

    # THE INPUT PLANE, declared 2026-07-31 with the dispatch that answers
    # it. Four verbs that are four different kinds of thing: a READ the
    # act plane is measured with, one keystroke, one AppleScript, and one
    # of four core Apple Events. See now-guest-ppc/src/input/input_cmds.h.
    mouseloc:
      description: >
        Where this Mac's pointer IS — which is not where anything asked
        it to go.

        The instrument the act plane is measured WITH rather than a part
        of it. An emulator's relative mouse is acceleration-distorted, so
        QMP can say where it asked the pointer to go and that is not
        where it went; every hop calibration in scripts/probes closes its
        loop against this verb. Getting it wrong quietly poisons every
        hijack number.

        It is a read and it stays a read. There is deliberately no
        move-the-mouse verb and no positional click verb beside it: the
        drag plane belongs to the emulator's own input path, where it can
        be watched. A guest-side click is the one mechanism that would
        let a no-hijack probe forge the evidence it exists to gather, and
        the thing that asked for one — folder items — wants an identity
        rather than a coordinate. Ruled on 2026-07-31; the argument is in
        docs/input-plane-decisions.md.
      args: {}
      x-line: Nothing. It takes no arguments.
      output:
        type: object
        properties:
          mouseloc: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    key:
      description: >
        Post ONE keystroke into this Mac's event queue — the mechanism
        `textset` is not, rather than a better one.

        `textset` writes an addressed element's text directly, through
        the Dialog Manager's or TextEdit's own setter. That reaches
        further in one direction (no focus, no frontmost application) and
        not at all in the other: a dialog that answers only keystrokes
        never sees it, and there is no text to set for Return, Escape or
        Tab. This verb is for the second case.

        NO MODIFIERS, AND `mods` IS REFUSED RATHER THAN DROPPED. An
        event's modifiers live on the Event Manager's queue element; the
        only call that hands that element back is `PPostEvent`, and
        CarbonLib does not have it — the PowerPC guest is a Carbon
        application. Posting the keystroke without the modifier would type
        a bare character and answer ok, which is precisely the defect this
        contract's act plane was written to avoid, so the request is
        refused with code `unsupported`. For a menu command use `menuact`:
        it is addressed by identity, needs no modifier, and draws no menu.

        The reply says `posted`, never `typed`. The keystroke entered the
        queue; which application dequeues it and what it does with it is
        the caller's to read back — the same rule as `aesend`'s `sent`.

        Both halves of the message are reported, with whether each came
        from the caller or from the guest's own key table. The virtual
        code half matters even unmodified: the Menu Manager matches
        shortcuts on the code and not the character.
      args:
        type: object
        properties:
          name:
            type: string
            enum: [return, enter, tab, space, delete, escape, help, home,
                   fwddelete, end, pageup, pagedown, left, right, down, up]
            description: >
              A key with no character to type, which is the half a
              text-writing verb cannot express at all. `enter` is the
              keypad's key and is not `return`. Exact match; anything
              else is a character, so send char or code.
          char:
            type: integer
            description: >
              The character code, 0..255 — the message's low byte. Sent
              alone, the virtual code is derived from it where the US key
              table has a row; an upper-case character keeps its case and
              takes the unshifted key's code, because the shift is a
              modifier this verb cannot post.
          code:
            type: integer
            description: >
              The virtual key code, 0..127 — the message's second byte.
              Sent alone, the character is derived where the table has a
              row.
          mods:
            type: integer
            description: >
              Accepted only as 0. Any other value is refused; see the
              description. It exists as an argument so that a caller
              asking for a modifier gets the true reason rather than
              `unknown argument`.
      x-line: >
        A key name, or `char N`, or `code N`. A person at this machine
        has all three.
      output:
        type: object
        properties:
          key: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    script:
      description: >
        Run ONE AppleScript on this Mac, through its own OSA component.

        The bounds are facts rather than preferences. Source is capped
        at 2048 bytes (upstream's measured figure) and the RESULT at
        1024 pre-escape, because the guest assembles a command.result in
        a 3072-byte buffer — a larger answer would be cut at whatever
        byte the buffer ran out and reported as a whole one.

        A whole-disk Finder search (`entire contents`) is REFUSED, not
        warned about. Such a script wedged a real machine for about
        twelve minutes, and the wedge is not recoverable from this side,
        so there is no error path that could report it after the fact.

        The source's line endings are converted to CR. Classic
        AppleScript's terminator is CR, so a source arriving from a
        modern host with LF endings parses as one very long line.
      args:
        type: object
        required: [source]
        properties:
          source:
            type: string
            description: >
              The script, at most 2048 bytes. TEXT, not a protocol
              token: it crosses as the caller wrote it.
          timeoutMs:
            type: integer
            description: >
              Clamped to 500..60000, default 15000. A caller that sends
              nothing and one that sends the default are the same
              request; one that sends 0 asked for something and gets the
              floor. The ceiling is hard because this Mac answers
              serially — a script's timeout is every other caller's
              wait.
      x-line: The script source, which is the whole rest of the line.
      output:
        type: object
        properties:
          script: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    aesend:
      description: >
        Send ONE core Apple Event to a process named by its serial.

        A CLOSED VOCABULARY OF FOUR — quit, oapp, odoc, pdoc — and not
        a class/id pipe. The wire names an op; it does not name an event
        class and an event id. That is the whole difference between a
        row whose arguments bound what it does and one whose arguments
        do not, and each of the four has an effect statable in one line,
        which is the test a fifth would have to pass.

        The four names are upstream's four-character mnemonics rather
        than longer words, because the ported probe's whitelist and its
        off-whitelist refusal check are written against them.

        Addressing the guest's OWN serial is refused rather than sent.
        A quit event to ourselves takes the guest down mid-reply, so the
        caller would see a dropped connection where the truthful answer
        is "you asked me to quit myself".
      args:
        type: object
        required: [event, serialHi, serialLo]
        properties:
          event:
            type: string
            enum: [quit, oapp, odoc, pdoc]
            description: >
              Exact match only. A truncated or padded name is not a near
              miss to be forgiven; it is a name this plane does not
              serve.
          serialHi:
            type: integer
            description: >
              Required WITH serialLo. (0, 0) is kNoProcess by
              definition and is refused here rather than sent and left
              to come back as procNotFound.
          serialLo:
            type: integer
          path:
            type: string
            description: >
              REQUIRED for odoc and pdoc, meaningless for the other two.
              A classic HFS path, at most 256 bytes — a Str255. TEXT,
              not a protocol token.
      x-line: >
        The event name, then the two serial numbers, then the path for
        odoc and pdoc.
      output:
        type: object
        properties:
          aesend: { $ref: "#/components/x-commands/gestalt/x-rowArray" }

    # THE CONTENT PLANE'S READER (P3), declared 2026-07-31 with the
    # dispatch that answers it. One verb, four subcommands behind `op`.
    qdtrace:
      description: >
        What is DRAWING on this Mac — read from a ring the NOW
        Extension's resident half fills at draw time inside an armed
        application.

        `status` (the default) counts without moving one record: it is
        the cheap question — "is anything drawing at all, and at whom?"
        — and a reader that could not answer it without a drain would
        have made the cheap question expensive. `start` arms ONE A5
        world for a bounded time in one of two modes; `stop` disarms;
        `drain` reads records from a cursor.

        `start` answers `requested: true, armed: false`, and that is not
        pessimism. Nothing is hooked until the extension's own pass runs
        INSIDE the target process and agrees, so this reply claims a
        request was written and never that it was honoured. `status`
        reports the extension's own word for what happened, beside the
        request, so a misaddressed arm is VISIBLE as a mismatch rather
        than as an absence.

        A DRAIN IS A BOUNDED CONTROL ANSWER, NOT A TRANSFER — the
        opposite of the ruling in docs/streaming-a-scene.md, for a
        stated reason. A scene is a TREE whose parts mean something only
        reassembled; a ring is a LOG whose every record is
        self-contained and ordered, whose writer already maintains the
        resume point, and whose unread records are still in the ring
        rather than lost. A prefix of a log is a complete answer about a
        shorter interval. The price is that a SHORT answer must say why
        it is short, and four different reasons end a drain — `more`,
        `resync`, `torn`, `busy` — because "fewer records than you
        expected" quietly covering an overrun is exactly the quiet
        machine.

        DEFAULTING TO `status` IS DELIBERATE. It is the only subcommand
        that neither writes nor moves a record; a default that armed
        something would be a plane armed by a typo.
      args:
        type: object
        properties:
          op:
            type: string
            enum: [status, start, stop, drain]
            description: Absent means status.
          a5:
            type: string
            description: >
              start only, and REQUIRED there. The A5 world of the ONE
              process to instrument. A STRING (decimal or 0x-prefixed),
              not an integer: an A5 routinely has its top bit set and
              the guest's `long` is 32 bits, so 0x80000000 would arrive
              as a negative number. Zero is refused at the near end —
              the plane reads it as "hook nothing", and a caller who
              believed it meant "everything" is told no by name.
          mode:
            type: string
            enum: [count, record]
            description: >
              start only. Absent means count — the cheap mode, chosen as
              the default because the expensive one should be asked for
              by name.
          ttlTicks:
            type: integer
            description: >
              start only. 60..36000, default 3600 (60 ticks = 1 second).
              A deadline exists so an agent that dies mid-request does
              not leave hooks installed forever. These bounds are a
              JUDGEMENT, not a measurement, and should move once someone
              has watched a real drain.
          cursor:
            type: string
            description: >
              status and drain. A monotonic byte count, so it exceeds
              2^31 after two gigabytes of records — a string for the
              same reason `a5` is one.
          maxBytes:
            type: integer
            description: drain only. 0 or absent means the whole ring.
          maxRecords:
            type: integer
            description: drain only. 0 or absent means no record bound.
      x-line: >
        The op, then its arguments. Empty is status from cursor 0.
      output:
        type: object
        description: >
          NOT A ROW ARRAY, and the exception is declared rather than
          discovered. Every value here is a NUMBER a caller does
          arithmetic on — a cursor it passes back, a byte count it
          compares, a counter it differences — and the row array is a
          string pair for a human to read. Flattening these to
          `["ring.writeCursor", "4096"]` would make every consumer parse
          its way back to the number it started from, and the one place
          a reply about loss must not be lossy is the reply about loss.

          The reference layer (`observe`, `axtree`, `elements`,
          `handle`, `axsnap`) already answers with objects for the same
          reason; this is the second family to do so, not the first.
        properties:
          qdtrace:
            type: object
            required: [cmd]
            description: >
              Discriminated by `cmd`, which is the op that answered.
              `status` carries plane / request / active / ring / ops /
              loss / lifecycle / refused; `drain` carries the cursor
              accounting and an `ops` array of records; `start` and
              `stop` carry what was requested. A subcommand that cannot
              answer at all — no extension, a block this build does not
              read — refuses with `ok: false` and a code, and never with
              an empty object.
            properties:
              cmd:
                type: string
                enum: [status, start, stop, drain]

    # THE REFERENCE LAYER, declared 2026-07-31 with the guest that serves
    # it. These four are not a second act plane; they are the half that
    # MINTS what the act plane takes, and the reason `elements` above is
    # spelled as a scoped observation rather than as its own walk: there
    # is exactly ONE thing in this product that creates a reference, and
    # `observe`, `axtree` and `elements` are three doors onto it.
    #
    # A token carries no identity. It is a lookup key into a guest-side
    # registry whose only writer is a walk that actually saw the element,
    # and whose 128 bits are hashed over a per-session secret the caller
    # never sees. Knowing an element's title, bounds, WindowPtr and PSN
    # does not let anyone compute its token — which is why there is
    # deliberately no "give me the reference for the window called X".
    observe:
      description: >
        Walk this Mac's on-screen elements and MINT an opaque reference
        for each one seen. The only thing in the product that creates a
        reference, which is what makes "observation-minted" a fact about
        the mechanism rather than an aspiration.

        Answers with the tree: processes, their windows, the controls in
        each, and the reference minted for every one. A reference is
        short-lived and lives in a bounded table; one that has aged out
        reads exactly like one whose window closed, and both are true.

        SELF IS NOT OBSERVABLE. NOW is a Carbon application and its own
        window records are not where a classic walk reads. Asking for
        NOW's own process binds and walks to nothing; that is a limit
        stated, not hidden.
      args:
        type: object
        properties:
          scope:
            type: string
            enum: [front, all]
            description: >
              front (the default) observes the frontmost application
              only; all walks every process the Process Manager lists.
      x-line: >
        NOT TYPEABLE usefully. It answers with references no person can
        read or retype.
      output:
        type: object
        properties:
          observe: { $ref: "#/components/x-commands/observe/x-axTree" }
      x-bounds:
        type: object
        required: [left, top, right, bottom]
        properties:
          left: { type: integer }
          top: { type: integer }
          right: { type: integer }
          bottom: { type: integer }
      x-axTree:
        type: object
        required: [scope, processes, count, truncated, live]
        description: >
          `truncated` is a fact about the REPLY, not about the machine: a
          reader that cannot tell a short tree from a clipped one has been
          told nothing useful. `live` is how many references are currently
          resolvable, which is the real bound on how much of a walk stays
          addressable.
        properties:
          scope: { type: string }
          count: { type: integer }
          truncated: { type: boolean }
          live: { type: integer }
          processes:
            type: array
            items:
              type: object
              properties:
                name: { type: string }
                signature: { type: string }
                serialHi: { type: integer }
                serialLo: { type: integer }
                front: { type: boolean }
                bind:
                  type: string
                  description: >
                    Why a process contributed no tree, in one word — so an
                    empty array is never mistaken for a machine with no
                    windows. ok, no-process, no-plane, no-anchor,
                    ambiguous, mismatch, unreadable.
                stampTicks: { type: integer }
                windows:
                  type: array
                  items:
                    type: object
                    properties:
                      ref:
                        type: string
                        description: >
                          The opaque reference, "now-window-" and a UUID.
                      title: { type: string }
                      occurrence: { type: integer }
                      z: { type: integer }
                      visible: { type: boolean }
                      kind: { type: integer }
                      bounds:
                        $ref: "#/components/x-commands/observe/x-bounds"
                      text:
                        type: object
                        description: >
                          Present only for a window whose own TextEdit
                          record this walk could read — a dialog's. A
                          document window's TEHandle is not discoverable
                          from a foreign walk, and that gap is stated
                          rather than papered over: such a window carries
                          no text reference and gets no row here.
                        properties:
                          ref:
                            type: string
                            description: >
                              An element reference, "now-element-" and a
                              UUID. It names a text element, so textget
                              and textset take it and ctlact refuses it.
                          length: { type: integer }
                      controls:
                        type: array
                        items:
                          type: object
                          properties:
                            ref:
                              type: string
                              description: >
                                The opaque reference, "now-element-" and
                                a UUID.
                            title: { type: string }
                            occurrence: { type: integer }
                            visible: { type: boolean }
                            enabled: { type: boolean }
                            bounds:
                              $ref: "#/components/x-commands/observe/x-bounds"
                            value: { type: integer }
                            min: { type: integer }
                            max: { type: integer }
    handle:
      description: >
        Take ONE reference back to a live element, or refuse — precisely.

        THE REFUSAL IS THE PRODUCT. `ok` stays true for every verdict
        including the four that resolve to nothing, because "your
        reference is stale" is an ANSWER: it tells the caller to observe
        again. An error would read as "the call failed" and invite a
        retry of the same reference. What is never true is `resolved`.

        Staleness is refused, never repaired. A window that closed and
        reopened is a DIFFERENT window even wearing the same title in the
        same place, and a resolver that quietly re-aimed at the new one
        would be the "whatever is frontmost" surface a reference exists
        to prevent, hidden behind a reference-shaped argument.
      args:
        type: object
        required: [ref]
        properties:
          ref:
            type: string
            description: >
              One reference, "now-window-" or "now-element-" and a UUID,
              minted by an observation on THIS machine in THIS session.
      x-line: >
        NOT TYPEABLE. The argument is a reference no human has.
      output:
        type: object
        properties:
          handle:
            type: object
            required: [ref, verdict, reason, resolved]
            properties:
              ref: { type: string }
              verdict:
                type: string
                enum: [ok, not-found, ambiguous, mismatch, stale]
                description: >
                  Five words, taken from the anchor oracle's vocabulary
                  rather than invented: this plane already has one set of
                  words for "the honest answer is not a pointer".
              reason:
                type: string
                description: >
                  Which check stopped it, as a sentence a person can act
                  on. A resolve that could not say WHICH check failed
                  would leave "it didn't work" indistinguishable from
                  "you named the wrong thing", and only one of those is
                  the caller's bug.
              resolved: { type: boolean }
              serialHi: { type: integer }
              serialLo: { type: integer }
              window:
                type: object
                properties:
                  title: { type: string }
                  z: { type: integer }
                  visibleZ: { type: integer }
                  visible: { type: boolean }
                  bounds:
                    $ref: "#/components/x-commands/observe/x-bounds"
              element:
                type: object
                description: Absent for a window reference, by construction.
                properties:
                  title: { type: string }
                  visible: { type: boolean }
                  enabled: { type: boolean }
                  bounds:
                    $ref: "#/components/x-commands/observe/x-bounds"
                  value: { type: integer }
                  min: { type: integer }
                  max: { type: integer }
    axtree:
      description: >
        The read surface over the same walk `observe` performs. It
        differs in what it is FOR rather than in what it does: observe is
        the call an agent makes to OBTAIN references, axtree the one it
        makes to LOOK. They share one emitter on the guest, so the two
        can never describe the same machine differently — which two
        copies eventually would.

        Because it is the same walk, it mints too. There is no read-only
        spelling of this tree, and pretending otherwise would be a
        second, quieter minter.
      args:
        type: object
        properties:
          scope:
            type: string
            enum: [front, all]
      x-line: >
        NOT TYPEABLE usefully. Same reason as observe.
      output:
        type: object
        properties:
          axtree: { $ref: "#/components/x-commands/observe/x-axTree" }
    axsnap:
      description: >
        The cheap one: who is front, whether the reference layer can see
        it, and how many references are live. No walk, so no minting —
        the one call on this surface that is safe to poll.
      args: {}
      x-line: >
        Takes nothing. The answer is about the machine's front process
        and the reference table, both of which a person can read.
      output:
        type: object
        properties:
          axsnap:
            type: object
            properties:
              front:
                type: object
                properties:
                  name: { type: string }
                  signature: { type: string }
                  serialHi: { type: integer }
                  serialLo: { type: integer }
                  front: { type: boolean }
                  bind: { type: string }
                  stampTicks: { type: integer }
                  hasWindows: { type: boolean }
                  hasMenus: { type: boolean }
              references:
                type: object
                properties:
                  live: { type: integer }
                  minted: { type: integer }
                  evicted: { type: integer }
                  capacity: { type: integer }

  # The census probe registry: the CLOSED, DECLARED set of probes a side may
  # be asked about, and the outcome vocabulary every report speaks. Adding a
  # probe is additive (an older peer answers outcome "refused",
  # note "unknown probe"); changing a probe's row columns is breaking and
  # bumps the revision. Probes are passive by rule — read-only walks of
  # tables the OS maintains. The one exception is declared on the probe.
  x-census:
    x-outcomes:
      present: The probe ran and returned data.
      absent: >
        The probe ran cleanly and the MACHINE said no — no expansion
        slots, no SCSI bus. Absence is a finding about the machine,
        rendered as content, never as an error.
      partial: >
        The probe ran but reached a smaller surface than its full form
        (the PowerPC path reads the 20-byte SysParm copy where 68K
        reads 256 bytes of XPRAM). The note says what was out of reach.
      refused: >
        The RESPONDER declined to look: probe not served yet, safety
        gate, unknown probe name. "We did not look" and "it is not
        there" are never conflated.
      failed: >
        The probe started and could not finish. Possibly transient;
        re-asking is reasonable.
      not-attempted: The cursor never reached it, or it was skipped.
    x-probes:
      overview:
        columns: [Fact, Raw, Meaning]
        description: >
          The synthesis, in plain words: model, processor, memory,
          system, display and storage as a person would say them.
          Overview holds no truth of its own — it arranges what the
          other probes read, and each fact keeps its trail (the probes
          it came from), so the semantic layer is never an opaque guess.
          Rows with an empty value are section captions.
      identity:
        columns: [Fact, Raw, Meaning]
        description: >
          The machine in a curated dozen: model, CPU and clock, RAM,
          ROM, OS, CarbonLib, QuickDraw, keyboard, networking — the
          ring-0 "what is this machine", decoded to words.
      selectors:
        columns: [Selector, Raw, Meaning]
        description: >
          The full documented Gestalt walk (renamed from gestalt). Raw
          is the untouched value; the Meaning is a one-line summary and
          the detail carries every set attr bit, named or numbered as a
          candidate — the unresolved bin is the corpus-growth path.
          Gestalt cannot enumerate undocumented selectors, so the walk
          is exactly the snapshotted table and says so.
      video:
        columns: [Field, Raw, Meaning]
        description: GDevice walk; one record of fields per display.
      volumes:
        columns: [Volume, Raw, Meaning]
        description: Mounted volumes via indexed PBHGetVInfo.
      drives:
        columns: [Drive, Raw, Meaning]
        description: The drive queue — zero bus I/O.
      drivers:
        columns: [Driver, Raw, Meaning]
        description: The Device Manager unit table, with an in-ROM check.
      adb:
        columns: [Device, Raw, Meaning]
        description: The ADB device table (CountADBs / GetIndADB).
      ata:
        columns: [Device, Raw, Meaning]
        description: >
          IDENTIFY DEVICE through the ATA Manager - the internal IDE boot
          disk the SCSI scan cannot see. The 1400c's ATA Manager is
          68K-trap-only ($AAF1), reached through a metal-proven Mixed Mode
          dispatch (see x-trap). IDENTIFY is a non-destructive read. On the
          1400c the manager answers noErr with an empty IDENTIFY buffer, so
          the row reports the device present without a model; a drive that
          fills the buffer decodes into model, capacity and firmware.
      pccard:
        columns: [Field, Raw, Meaning]
        description: >
          Card Services' own view via CSGetCardServicesInfo ($AAF0,
          selector 7) over the same Mixed Mode dispatch: CS version and
          socket count, plus the CS vendor string. Touches no socket and
          no card - a card's own identity lives in its CIS, which stays out
          of the census (the 1400c's CIS-freeze history) until a gated
          design exists. Metal-proven: CS 2.01, 4 sockets.
      power:
        columns: [Battery, Raw, Meaning]
        description: >
          The Power Manager's battery view - charge, source, state -
          gated on gestaltPowerMgrAttr. Carbon-clean; a desktop answers
          absent. The probe most worth watching over time once the
          extension's counter tier lands.
      pci:
        columns: [Device, Raw, Meaning]
        description: >
          The Name Registry (Open Firmware device tree). Resolved from
          NameRegistryLib and gated on gestaltNameRegistryVersion, so a
          pre-PCI Mac (the 1400c) answers `absent` without touching the
          library; a PCI Mac enumerates its device-tree nodes. Read-only.
      pram:
        columns: [Offset, Raw, Meaning]
        description: >
          Parameter RAM. Decoded spans first, raw hex rows after; on
          PowerPC the 20-byte SysParm copy is all there is, reported as
          outcome "partial".
      scsi:
        columns: [Target, Raw, Meaning]
        description: >
          THE DECLARED EXCEPTION to passive-by-rule - an INQUIRY bus
          scan, active bus I/O. Gated on gestaltHardwareAttr saying a
          bus exists (answering "absent" otherwise), and paced at ONE
          target per page so a wedged target stalls at most one frame
          turnaround. A responder may refuse it outright; attended
          first runs on real hardware are the expected discipline.
