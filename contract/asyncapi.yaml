# New Old World wire contract.
#
# One TCP connection, one contract, multiplexed by an 8-byte binary frame
# header. Control payloads are JSON (this document's schemas); bulk payloads
# are raw bytes correlated by transfer id. AsyncAPI describes the messages;
# the frame layer below is normative prose because no schema standard
# expresses binary framing.
#
# The semantics deliberately mirror RFC 6455 (WebSocket): control/bulk maps
# to text/binary, ping/pong and bye map to the WS control frames, and the
# contract revision plays the subprotocol role. The guest wire is NOT literal
# WebSocket (no HTTP upgrade, no client masking, fixed 8-byte header — the
# classic side stays minimal); the mirroring exists so a host-side ws://
# bridge for modern clients is a projection, not a translation.
#
# Frame header (8 bytes, big-endian):
#
#   offset  size  field     meaning
#   0       u8    channel   0 = control, 1 = bulk
#   1       u8    flags     bit0 END: last frame of this transfer
#   2       u16   transfer  bulk correlation id; 0 on control frames
#   4       u32   length    payload bytes that follow (max 32768)
#
# Transport:
# - Frames run over any reliable ordered byte stream. Today that is plain
#   TCP; a future secure transport (pinned-key TLS) wraps the stream below
#   the frame layer and changes nothing in this document.
# - Secure transport, when it exists, is selected per-port like ws://wss://.
#   There is NO in-band upgrade (no STARTTLS-style negotiation), ever.
# - Each frame is written as ONE contiguous send (header + payload together).
#   Back-to-back small writes are dropped by real classic-Mac NICs (the
#   PB1400c Farallon driver drops the second frame of a TX burst).
#
# Connection rules:
# - The guest dials the host and sends `hello` first; the host answers
#   `hello` (accept) or `refuse` and closes. Nothing else may precede hello.
#   The handshake is per-connection: a reconnect re-hellos.
# - `contract` is a single integer revision. Unequal revisions => refuse.
#   Breaking changes bump it; additive optional fields do not.
# - The host serves ONE guest at a time (v1): a second dial is refused with
#   reason "busy: <connected guest name>". Host internals stay
#   session-shaped so multi-guest later is a UI decision, not a rework.
# - Control messages that expect an answer carry `id`; answers echo it.
# - Bulk transfers are announced on control (`capture.begin`), stream on the
#   bulk channel in chunks (default 8192 bytes, negotiable in hello), and
#   finish with the END flag plus a closing control message.
# - Keepalive is GUEST-driven: the guest sends `ping` after 30s of wire
#   silence; the host answers `pong` and initiates no pings of its own
#   (pinging a wedged classic endpoint just piles bytes into a dead hole).
#   Death declaration: guest after 2 unanswered pings (~65s); host passively
#   after ~75s without any traffic. Both sides surface it honestly.
# - Graceful exit sends `bye {code, reason?}` before closing (guest then
#   drains and uses OTSndOrderlyDisconnect — unannounced closes leak
#   T_DISCONNECT indications on OS 9). bye is best-effort; crashes and lid
#   closes never send it, so it complements the keepalive, never replaces
#   it. Codes (WS-close-code discipline, small and stable): "normal",
#   "shutting-down", "protocol-error".
# - The guest auto-reconnects with capped backoff (2s doubling to 30s)
#   while its app is running.
# - Commands: the host console is a shell into the guest — every command a
#   human types there becomes one command.request and exactly one
#   command.result. The command set is CLOSED and DECLARED: every command's
#   name, args, and output schema live in this file (x-commands). Adding a
#   command is additive (no revision bump — an older peer answers
#   unknown-command cleanly); changing a command's shape is breaking and
#   bumps the revision. The wire is never a TTY: no raw keystrokes, no
#   byte-streams — shell face, typed spine.

asyncapi: 3.0.0

info:
  title: New Old World wire contract
  version: 0.1.0
  x-contract-revision: 1

defaultContentType: application/json

channels:
  control:
    address: "0"
    description: JSON control messages, framed on channel 0.
    messages:
      hello: { $ref: "#/components/messages/hello" }
      refuse: { $ref: "#/components/messages/refuse" }
      ping: { $ref: "#/components/messages/ping" }
      pong: { $ref: "#/components/messages/pong" }
      bye: { $ref: "#/components/messages/bye" }
      error: { $ref: "#/components/messages/error" }
      commandRequest: { $ref: "#/components/messages/commandRequest" }
      commandResult: { $ref: "#/components/messages/commandResult" }
      captureRequest: { $ref: "#/components/messages/captureRequest" }
      captureCancel: { $ref: "#/components/messages/captureCancel" }
      streamRequest: { $ref: "#/components/messages/streamRequest" }
      streamStart: { $ref: "#/components/messages/streamStart" }
      streamStop: { $ref: "#/components/messages/streamStop" }
      streamRefresh: { $ref: "#/components/messages/streamRefresh" }
      streamStopped: { $ref: "#/components/messages/streamStopped" }
      fileList: { $ref: "#/components/messages/fileList" }
      fileListing: { $ref: "#/components/messages/fileListing" }
      fileGet: { $ref: "#/components/messages/fileGet" }
      fileOffer: { $ref: "#/components/messages/fileOffer" }
      fileAccept: { $ref: "#/components/messages/fileAccept" }
      fileRefuse: { $ref: "#/components/messages/fileRefuse" }
      fileDone: { $ref: "#/components/messages/fileDone" }
      fileBegin: { $ref: "#/components/messages/fileBegin" }
      fileEnd: { $ref: "#/components/messages/fileEnd" }
      fileCancel: { $ref: "#/components/messages/fileCancel" }
      fileMove: { $ref: "#/components/messages/fileMove" }
      fileTrash: { $ref: "#/components/messages/fileTrash" }
      fileRestore: { $ref: "#/components/messages/fileRestore" }
      fileMkdir: { $ref: "#/components/messages/fileMkdir" }
      fileResult: { $ref: "#/components/messages/fileResult" }
      captureOffer: { $ref: "#/components/messages/captureOffer" }
      captureAccept: { $ref: "#/components/messages/captureAccept" }
      captureRefuse: { $ref: "#/components/messages/captureRefuse" }
      captureBegin: { $ref: "#/components/messages/captureBegin" }
      captureEnd: { $ref: "#/components/messages/captureEnd" }
  bulk:
    address: "1"
    description: >
      Raw payload bytes on channel 1, correlated by the frame header's
      transfer id. Two payload kinds ride it: capture pixel data (rows
      top-to-bottom, rowBytes apart; depth 8 uses the guest's palette;
      16 is RGB555 big-endian; 32 is xRGB8888 big-endian) and file
      content (file.begin describes the container). The control message
      that began the transfer says which.

operations:
  guestOffersCapture:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/captureOffer"
      - $ref: "#/channels/control/messages/captureBegin"
      - $ref: "#/channels/control/messages/captureEnd"
    description: >
      Guest announces and completes a capture transfer. A transfer starts
      one of two ways: answering the host's capture.request (capture.begin
      follows directly, correlated by the request id), or guest-initiated
      push — the guest captures first, announces with capture.offer
      (carrying true byte counts, so a refusal costs nothing but the
      capture), and sends capture.begin only after the host answers
      capture.accept. Either way the frames and capture.end are identical;
      one transfer at a time still holds across both origins.
  hostControlsStream:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/streamStart"
      - $ref: "#/channels/control/messages/streamStop"
      - $ref: "#/channels/control/messages/streamRefresh"
    description: >
      Host brackets a live stream. Between stream.start and the guest's
      stream.stopped, the guest sends frames as ordinary capture
      transfers whose capture.begin id is the stream id — that id is the
      routing: no disk, no announcement, straight to the live view. The
      guest self-paces (finish a frame, capture fresh — never queue). The
      wire paces frames that carry pixels; frames that do not (an
      unchanged screen sends a ~150-byte control pair and no bulk data)
      are paced by the guest's own floor, which minIntervalMs raises.
      The stream owns the transfer lane: capture.request and
      capture.offer are refused while it runs.
  guestRequestsStream:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/streamRequest"
    description: >
      Guest asks the host to open a stream bracket. The bracket stays
      host-owned — both origins share one path — so the host answers
      with a normal stream.start, or an error (code "stream-busy") if
      the lane is taken. A guest whose ask goes unanswered gives up
      after a timeout and tells its human.
  guestEndsStream:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/streamStopped"
    description: >
      stream.stopped is always the stream's last word — it acks the
      host's stream.stop (any in-flight frame is aborted first, ending
      ok:false) and equally lets the guest end the stream on its own,
      with the reason saying why.
  hostBrowsesFiles:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/fileList"
      - $ref: "#/channels/control/messages/fileGet"
      - $ref: "#/channels/control/messages/fileCancel"
    description: >
      THE FILE FAMILY IS SYMMETRIC. Every message here means the same
      thing whichever side sends it, and whoever RECEIVES a request
      serves its OWN share: the host browsing the guest and the guest
      browsing the host are the same exchange with the roles swapped.
      Each machine shares exactly one folder, and a share bounds what
      the other machine may reach on its own initiative — never what a
      human deliberately sends, so the source of a push is any file the
      sender picks and only the destination must lie inside a share.

      These verbs are requester-centric like HTTP's — file.get is the
      sender obtaining a file. Note that the CONSOLE surface is
      deliberately the other frame: it is a shell into the guest, so a
      console `put` means the guest puts a file to the host (see
      docs/files.md). Host UI affordances speak host-native
      ("Download"). Paths are RELATIVE
      to the guest's configured share root ("" is the root; segments
      joined with ":"): a path outside the share is inexpressible, and
      any empty segment ("::" traversal) refuses bad-path. file.get
      needs no accept - the requester is the receiver; failures answer
      with file.refuse. One transfer at a time still holds across
      captures, streams, and files.
  hostPutsFiles:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/fileOffer"
    description: >
      Host offers a file for the guest's share. A share bounds what the
      other machine may reach on its own initiative — list, pull, write
      into — and never what a human deliberately sends, so the SOURCE of
      a push is any file the sender picks; only the DESTINATION must lie
      inside the share. The guest answers file.accept or file.refuse
      without prompting anyone (it is not necessarily attended), then
      the host sends file.begin, the bulk stream, and file.end. The
      guest confirms with file.done only once the bytes are written and
      the file is stamped: a put is not finished until the File Manager
      says so. While the bytes stream the guest reports what it has
      actually taken, with file.progress — the sender's own "handed to
      the socket" count is not evidence the far side received anything,
      and on a slow link it runs minutes ahead of the truth.
  hostChangesFiles:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/fileMove"
      - $ref: "#/channels/control/messages/fileTrash"
      - $ref: "#/channels/control/messages/fileRestore"
      - $ref: "#/channels/control/messages/fileMkdir"
    description: >
      Changing what is in the share, rather than what flows across it.
      Every one of these is reversible, which is the point: deleting
      moves an item to the Trash rather than erasing it, so the inverse
      is a move back, and the answer carries what the inverse needs.
      Every inverse is a move, expressed in names on both ends. A
      trashed item is named by where it landed — file.trash answers with
      the name it now has inside the Trash, which is not always the name
      it had, since the Trash may already hold one. That name plus the
      path it came from is everything file.restore needs, so nothing is
      remembered on either side and an undo survives a restart of either.
      The Trash is a real folder; a name in it is as durable a way to say
      "that item" as a path anywhere else.
  guestServesFiles:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/fileListing"
      - $ref: "#/channels/control/messages/fileRefuse"
      - $ref: "#/channels/control/messages/fileBegin"
      - $ref: "#/channels/control/messages/fileEnd"
      - $ref: "#/channels/control/messages/fileProgress"
    description: >
      Listings paginate (control frames cap at 4 KB); a transfer is the
      standard begin -> bulk -> end shape. The container rule: data-only
      files travel as the raw data fork; resource-only files as
      MacBinary; both-forks defaults to the data fork with MacBinary on
      request. Text conversion is the HOST's job - the guest ships raw
      bytes and metadata.
  hostAnswersOffer:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/captureAccept"
      - $ref: "#/channels/control/messages/captureRefuse"
    description: >
      Host grants or declines a guest-initiated capture offer. Accepting is
      policy, not ceremony — a host normally accepts unless a transfer is
      already in flight. A guest whose offer goes unanswered abandons it
      after a timeout and reports that to its human.
  hostRequestsCapture:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/captureRequest"
      - $ref: "#/channels/control/messages/captureCancel"
    description: >
      Host asks the guest to capture, and may abandon a transfer already in
      flight. Cancel is advisory: the guest stops sending bulk frames and
      closes the transfer with capture.end ok:false, so the host learns the
      outcome the same way it would from any other failure.

components:
  messages:
    hello:
      name: hello
      payload: { $ref: "#/components/schemas/Hello" }
    refuse:
      name: refuse
      payload: { $ref: "#/components/schemas/Refuse" }
    ping:
      name: ping
      payload: { $ref: "#/components/schemas/Ping" }
    pong:
      name: pong
      payload: { $ref: "#/components/schemas/Pong" }
    bye:
      name: bye
      payload: { $ref: "#/components/schemas/Bye" }
    error:
      name: error
      payload: { $ref: "#/components/schemas/Error" }
    commandRequest:
      name: command.request
      payload: { $ref: "#/components/schemas/CommandRequest" }
    commandResult:
      name: command.result
      payload: { $ref: "#/components/schemas/CommandResult" }
    captureRequest:
      name: capture.request
      payload: { $ref: "#/components/schemas/CaptureRequest" }
    streamRequest:
      name: stream.request
      payload: { $ref: "#/components/schemas/StreamRequest" }
    streamStart:
      name: stream.start
      payload: { $ref: "#/components/schemas/StreamStart" }
    streamStop:
      name: stream.stop
      payload: { $ref: "#/components/schemas/StreamStop" }
    streamRefresh:
      name: stream.refresh
      payload: { $ref: "#/components/schemas/StreamRefresh" }
    streamStopped:
      name: stream.stopped
      payload: { $ref: "#/components/schemas/StreamStopped" }
    fileList:
      name: file.list
      payload: { $ref: "#/components/schemas/FileList" }
    fileListing:
      name: file.listing
      payload: { $ref: "#/components/schemas/FileListing" }
    fileGet:
      name: file.get
      payload: { $ref: "#/components/schemas/FileGet" }
    fileOffer:
      name: file.offer
      payload: { $ref: "#/components/schemas/FileOffer" }
    fileAccept:
      name: file.accept
      payload: { $ref: "#/components/schemas/FileAccept" }
    fileDone:
      name: file.done
      payload: { $ref: "#/components/schemas/FileDone" }
    fileProgress:
      name: file.progress
      payload: { $ref: "#/components/schemas/FileProgress" }
    fileRefuse:
      name: file.refuse
      payload: { $ref: "#/components/schemas/FileRefuse" }
    fileBegin:
      name: file.begin
      payload: { $ref: "#/components/schemas/FileBegin" }
    fileEnd:
      name: file.end
      payload: { $ref: "#/components/schemas/FileEnd" }
    fileMove:
      name: file.move
      payload: { $ref: "#/components/schemas/FileMove" }
    fileTrash:
      name: file.trash
      payload: { $ref: "#/components/schemas/FileTrash" }
    fileRestore:
      name: file.restore
      payload: { $ref: "#/components/schemas/FileRestore" }
    fileMkdir:
      name: file.mkdir
      payload: { $ref: "#/components/schemas/FileMkdir" }
    fileResult:
      name: file.result
      payload: { $ref: "#/components/schemas/FileResult" }
    fileCancel:
      name: file.cancel
      payload: { $ref: "#/components/schemas/FileCancel" }
    captureOffer:
      name: capture.offer
      payload: { $ref: "#/components/schemas/CaptureOffer" }
    captureAccept:
      name: capture.accept
      payload: { $ref: "#/components/schemas/CaptureAccept" }
    captureRefuse:
      name: capture.refuse
      payload: { $ref: "#/components/schemas/CaptureRefuse" }
    captureCancel:
      name: capture.cancel
      payload: { $ref: "#/components/schemas/CaptureCancel" }
    captureBegin:
      name: capture.begin
      payload: { $ref: "#/components/schemas/CaptureBegin" }
    captureEnd:
      name: capture.end
      payload: { $ref: "#/components/schemas/CaptureEnd" }

  schemas:
    Hello:
      type: object
      required: [type, contract, side, version]
      additionalProperties: false
      properties:
        type: { const: hello }
        contract:
          type: integer
          description: Contract revision; unequal revisions are refused.
        side: { enum: [guest, host] }
        version:
          type: string
          description: Sending app's own version, for display only.
        name:
          type: string
          description: Human-facing machine name, e.g. "Power Mac G3".
        os:
          type: string
          description: Guest OS version string, e.g. "9.1".
        chunk:
          type: integer
          minimum: 512
          maximum: 32768
          description: >
            Sender's preferred bulk chunk size in bytes; the connection uses
            the smaller of the two sides' preferences. Default 8192.
    Refuse:
      type: object
      required: [type, contract, reason]
      additionalProperties: false
      properties:
        type: { const: refuse }
        contract: { type: integer }
        reason:
          type: string
          description: Human-readable; shown in the UI, never swallowed.
    Ping:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: ping }
        id: { type: integer }
    Pong:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: pong }
        id: { type: integer }
    Bye:
      type: object
      required: [type, code]
      additionalProperties: false
      properties:
        type: { const: bye }
        code:
          enum: [normal, shutting-down, protocol-error]
          description: >
            Why the sender is closing, WS-close-code style. Distinguishes a
            calm "guest quit" from a failure in the peer's UI and lets the
            peer free state without waiting out the keepalive window.
        reason:
          type: string
          description: Optional human-readable detail; shown, never parsed.
    Error:
      type: object
      required: [type, code, message]
      additionalProperties: false
      properties:
        type: { const: error }
        id:
          type: integer
          description: Echoes the failed request's id when there is one.
        code:
          type: string
          description: Stable machine-readable slug, e.g. "capture-no-memory".
        message: { type: string }
    CommandRequest:
      type: object
      required: [type, id, name]
      additionalProperties: false
      properties:
        type: { const: command.request }
        id: { type: integer }
        name:
          type: string
          description: >
            A command from the x-commands registry below. An unknown name is
            answered with ok=false, error code "unknown-command" — never a
            protocol error; that is what keeps commands additive.
        args:
          type: object
          description: Per-command arguments; schema in x-commands.
    CommandResult:
      type: object
      required: [type, id, ok]
      additionalProperties: false
      properties:
        type: { const: command.result }
        id: { type: integer, description: Echoes the request id. }
        ok: { type: boolean }
        output:
          type: object
          description: Present when ok; schema per command in x-commands.
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable slug, e.g. "unknown-command".
            message: { type: string }
    CaptureRequest:
      type: object
      required: [type, id, depth]
      additionalProperties: false
      properties:
        type: { const: capture.request }
        id: { type: integer }
        depth: { enum: [1, 2, 4, 8, 16, 32] }
        chunkKb: { type: integer, minimum: 1, maximum: 32 }
        paceMs: { type: integer, minimum: 0, maximum: 100 }
        pack: { type: boolean }
    StreamRequest:
      type: object
      required: [type, depth]
      additionalProperties: false
      properties:
        type: { const: stream.request }
        depth: { enum: [1, 2, 4, 8, 16, 32] }
    StreamStart:
      type: object
      required: [type, id, depth]
      additionalProperties: false
      properties:
        type: { const: stream.start }
        id:
          type: integer
          description: Stream id; every frame's capture.begin carries it.
        depth: { enum: [1, 2, 4, 8, 16, 32] }
        minIntervalMs:
          type: integer
          description: >
            Minimum ms between frame starts — the host's ceiling on frame
            rate. 0 or absent leaves the pace to the guest, which applies
            its own floor (~15 fps, backing off to ~4 while frames stay
            empty). Absent is not unbounded: an empty frame carries no
            pixels, so the wire alone does not pace one.
        chunkKb: { type: integer, minimum: 1, maximum: 32 }
        paceMs: { type: integer, minimum: 0, maximum: 100 }
        pack: { type: boolean }
        predictive:
          type: boolean
          description: Read only predicted-dirty rows plus a sweep.
        interlace:
          type: boolean
          description: Capture and send alternate decimated fields.
      description: >
        Tuning fields are the initiator's knobs: absent ones fall back
        to the guest's own panel settings, so a bare stream.start
        behaves exactly as before.
    StreamStop:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: stream.stop }
        id: { type: integer }
    StreamRefresh:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: stream.refresh }
        id: { type: integer }
      description: >
        Host asks for a keyframe: the guest's next frame is sent whole.
        Belt-and-suspenders against compositing drift; deltas reference
        the previous frame implicitly and TCP ordering makes that safe,
        so this should never be load-bearing.
    StreamStopped:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: stream.stopped }
        id: { type: integer }
        reason:
          type: string
          description: >
            Why the guest ended it, when the guest ended it ("busy: a
            transfer is in flight", "capture failed"); absent when
            acking the host's stream.stop.
    FileList:
      type: object
      required: [type, id, path]
      additionalProperties: false
      properties:
        type: { const: file.list }
        id: { type: integer }
        path:
          type: string
          description: Relative to the share root; "" is the root.
        cursor:
          type: integer
          description: Continue a paginated listing from this index.
    FileListing:
      type: object
      required: [type, id, path, entries, more]
      additionalProperties: false
      properties:
        type: { const: file.listing }
        id: { type: integer }
        path: { type: string }
        entries:
          type: array
          maxItems: 16
          items:
            type: object
            required: [name, kind]
            additionalProperties: false
            properties:
              name: { type: string }
              kind: { enum: [folder, file] }
              fileType: { type: string }
              creator: { type: string }
              dataBytes: { type: integer }
              rsrcBytes: { type: integer }
              modified:
                type: integer
                description: Classic Mac seconds since 1904.
        more: { type: boolean }
        cursor: { type: integer }
        root:
          type: string
          description: >
            What the responder is sharing, as that machine would write
            it ("Macintosh HD:Lab:", "/Users/me/Downloads"). Display
            only — never a path to send back, since everything on the
            wire is relative to this. Sent with the root listing so the
            asker can name the place it is looking at instead of
            calling it "the share".
    FileGet:
      type: object
      required: [type, id, path]
      additionalProperties: false
      properties:
        type: { const: file.get }
        id: { type: integer }
        path: { type: string }
        container:
          enum: [auto, data, macbinary]
          description: >
            auto (default) applies the container rule; macbinary forces
            the whole artifact.
    FileOffer:
      type: object
      required: [type, id, name, path, container, bytes]
      additionalProperties: false
      properties:
        type: { const: file.offer }
        id: { type: integer }
        name:
          type: string
          description: >
            Leaf name as it should land, already sanitized for HFS by
            the sender (<= 31 characters, no colons, MacRoman-encodable).
        path:
          type: string
          description: >
            Destination FOLDER, relative to the share root; "" is the
            root itself. Missing parents are created inside the share.
        container: { enum: [data, macbinary] }
        bytes:
          type: integer
          description: Exact size of the bulk stream to follow.
        fileType: { type: string }
        creator: { type: string }
        modified: { type: integer }
        overwrite:
          type: boolean
          description: >
            Absent or false means an existing file refuses `exists`;
            the sender may retry with true once a human has agreed.
    FileAccept:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: file.accept }
        id: { type: integer }
    FileDone:
      type: object
      required: [type, id, ok]
      additionalProperties: false
      properties:
        type: { const: file.done }
        id: { type: integer }
        ok: { type: boolean }
        code:
          enum: [exists, bad-path, io-error, too-big, cancelled]
        reason: { type: string }
    FileProgress:
      type: object
      required: [type, id, received]
      additionalProperties: false
      description: >
        Sent by the guest while it receives a put, carrying the byte
        count it has actually taken off the wire. Advisory: it is
        dropped rather than queued when the control queue is busy, so a
        receiver must treat it as a floor that may skip, never as a
        sequence. Absence means an older guest, not a stalled one.
      properties:
        type: { const: file.progress }
        id:
          type: integer
          description: The file.offer id this progress belongs to.
        received:
          type: integer
          description: >
            Bytes received so far, counted where they are written, not
            where they were sent.
    FileRefuse:
      type: object
      required: [type, id, code]
      additionalProperties: false
      properties:
        type: { const: file.refuse }
        id: { type: integer }
        code:
          enum: [busy, exists, bad-path, not-found, io-error, too-big]
        reason: { type: string }
    FileBegin:
      type: object
      required: [type, id, transfer, name, container, bytes]
      additionalProperties: false
      properties:
        type: { const: file.begin }
        id: { type: integer }
        transfer: { type: integer }
        name: { type: string }
        container: { enum: [data, macbinary] }
        bytes: { type: integer }
        dataBytes: { type: integer }
        rsrcBytes: { type: integer }
        fileType: { type: string }
        creator: { type: string }
        modified: { type: integer }
    FileEnd:
      type: object
      required: [type, id, transfer, ok]
      additionalProperties: false
      properties:
        type: { const: file.end }
        id: { type: integer }
        transfer: { type: integer }
        ok: { type: boolean }
        sendMs: { type: integer }
    FileMove:
      type: object
      required: [type, id, path, toPath]
      additionalProperties: false
      properties:
        type: { const: file.move }
        id: { type: integer }
        path:
          type: string
          description: The item now, relative to the share root.
        toPath:
          type: string
          description: >
            Where it should be, relative to the share root, including
            its name — so a rename and a move are the same operation.
            Missing parent folders are NOT created: moving into a
            folder that is not there is a mistake, not an instruction.
        overwrite: { type: boolean }
    FileTrash:
      type: object
      required: [type, id, path]
      additionalProperties: false
      properties:
        type: { const: file.trash }
        id: { type: integer }
        path: { type: string }
    FileRestore:
      type: object
      required: [type, id, trashedAs, toPath]
      additionalProperties: false
      properties:
        type: { const: file.restore }
        id: { type: integer }
        trashedAs:
          type: string
          description: >
            The item's name inside the Trash, as file.trash reported it.
        toPath:
          type: string
          description: >
            Where to put it back, relative to the share root and
            including its name. The enclosing folder must still exist:
            restoring into a folder we invented would put the item
            somewhere it never was.
    FileMkdir:
      type: object
      required: [type, id, path]
      additionalProperties: false
      properties:
        type: { const: file.mkdir }
        id: { type: integer }
        path:
          type: string
          description: The folder to create, relative to the share root.
    FileResult:
      type: object
      required: [type, id, ok]
      additionalProperties: false
      properties:
        type: { const: file.result }
        id: { type: integer }
        ok: { type: boolean }
        path:
          type: string
          description: Where the item ended up, when that is expressible.
        trashedAs:
          type: string
          description: >
            Answering file.trash: the name the item landed under inside
            the Trash. Pass it back to file.restore.
        code:
          enum: [exists, bad-path, not-found, io-error, busy]
        reason: { type: string }
    FileCancel:
      type: object
      required: [type, transfer]
      additionalProperties: false
      properties:
        type: { const: file.cancel }
        transfer: { type: integer }
    CaptureOffer:
      type: object
      required: [type, id, width, height, depth, rowBytes, bytes]
      additionalProperties: false
      properties:
        type: { const: capture.offer }
        id:
          type: integer
          description: >
            Guest-chosen id; the capture.accept / capture.refuse answer and
            the eventual capture.begin all carry it. A separate id space
            from capture.request — origins never share correlation.
        width: { type: integer }
        height: { type: integer }
        depth: { enum: [1, 2, 4, 8, 16, 32] }
        rowBytes: { type: integer }
        bytes:
          type: integer
          description: Exact bulk-stream size — the capture is already
            encoded when the offer is sent.
        paletteBytes: { type: integer }
        encoding: { enum: [raw, packbits] }
        captureMs: { type: integer }
        encodeMs: { type: integer }
    CaptureAccept:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: capture.accept }
        id: { type: integer }
    CaptureRefuse:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: capture.refuse }
        id: { type: integer }
        reason:
          type: string
          description: Human-readable; it lands in the guest's panel.
    CaptureCancel:
      type: object
      required: [type, transfer]
      additionalProperties: false
      properties:
        type: { const: capture.cancel }
        transfer:
          type: integer
          description: >
            The transfer to abandon, from capture.begin. A guest that is no
            longer sending that transfer ignores the message.
    CaptureBegin:
      type: object
      required: [type, id, transfer, width, height, depth, rowBytes, bytes]
      additionalProperties: false
      properties:
        type: { const: capture.begin }
        paletteBytes:
          type: integer
          description: >
            Leading bytes of the bulk stream holding the palette as RGB
            triples (indexed depths <= 8); 0 for direct colour. Sending the
            guest's own CLUT means the host needs no hardcoded table.
        encoding:
          enum: [raw, packbits]
          description: >
            raw = rows verbatim. packbits = each row PackBits-compressed and
            prefixed with a big-endian u16 packed length. NOT PICT: modern
            macOS cannot decode QuickDraw pictures, so the wire uses a format
            both sides own (PICT remains the guest's on-disk format).
        captureMs:
          type: integer
          description: Guest-side screen blit time, for tuning.
        encodeMs:
          type: integer
          description: Guest-side encode time, for tuning.
        id:
          type: integer
          description: The capture.request id, or a guest-chosen id for
            captures initiated on the guest.
        transfer: { type: integer, minimum: 1, maximum: 65535 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        depth: { enum: [1, 8, 16, 32] }
        rowBytes: { type: integer, minimum: 1 }
        bytes:
          type: integer
          minimum: 1
          description: Total bulk bytes to expect (rowBytes * height).
        frame:
          enum: [key, delta, empty]
          description: >
            Stream frames only (absent on one-shot captures). "key" is a
            whole screen; "delta" carries only the rects, referencing the
            previous frame implicitly (TCP ordering makes that safe);
            "empty" means nothing changed - bytes is 0 and no bulk
            follows, so a static screen still ticks at full rate for
            ~150 bytes a frame.
        rects:
          type: array
          maxItems: 16
          items:
            type: array
            minItems: 4
            maxItems: 5
            description: >
              [row, nRows, colByteOffset, colBytes, rowStep?] - dirty
              rows trimmed to their changed column span, in BYTES into
              the row so the wire stays depth-agnostic. The bulk payload
              is the rects' rows in order, each row's slice encoded
              exactly like a full row (u16-prefixed PackBits, or raw).
              rowStep (default 1) strides the destination rows: an
              interlaced field sends rowStep 2, patching rows row,
              row + 2, ... while the other parity waits for the next
              field.
            items: { type: integer }
    CaptureEnd:
      type: object
      required: [type, id, transfer, ok]
      additionalProperties: false
      properties:
        type: { const: capture.end }
        id: { type: integer }
        transfer: { type: integer }
        ok: { type: boolean }
        sendMs:
          type: integer
          description: Guest-side time spent streaming the bulk chunks.

  # The console command registry: the CLOSED set of commands a guest serves.
  # Every entry declares its args and output; the consoles on both sides and
  # the guest's dispatch table are all views of this list.
  x-commands:
    gestalt:
      description: >
        The guest's own account of itself, via the Gestalt Manager. Always
        returns every group; the console shows a slice (default = snapshot,
        or one of the domain groups, or --full for all). --save and --help
        are console affordances and never reach the wire.
      args: {}
      output:
        type: object
        description: >
          Grouped, ordered rows. Each group maps to an array of [label, value]
          string pairs, preserving order (unlike a plain object).
        properties:
          snapshot: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
          cpu: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
          memory: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
          os: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
          network: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
          hw: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
      x-rowArray:
        type: array
        items:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: string }
    ls:
      description: >
        List a folder in the guest's share. No path = the share root.
        Output rows: one per entry (name, then kind/type and sizes),
        capped for the console; the Files module uses file.list.
      args:
        path: { type: string }
      output:
        type: object
        properties:
          ls: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    vprobe:
      description: >
        Measure the guest's VRAM read cost by access method: raw
        framebuffer reads at 8/16/32/64-bit widths against the CopyBits
        baseline, reread caching, partial-read linearity, and pixel
        fidelity. A measurement surface for streaming work; the ~3 s run
        wants a still screen.
      args: {}
      output:
        type: object
        properties:
          vprobe: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    screenshot:
      description: >
        Capture the guest's screen. Slice one: the guest captures, encodes a
        packed PICT, and (unless save=false) writes it to its own desktop —
        pixels do not cross the wire yet; the result is the measurement rows.
        The bulk-channel transfer variant is the next contract step.
      args:
        type: object
        properties:
          depth:
            type: string
            enum: ["1", "2", "4", "8", "16", "32"]
            description: Capture depth; defaults to the guest panel setting.
          save:
            type: string
            enum: ["true", "false"]
            description: false = measure only, write nothing.
      output:
        type: object
        properties:
          screenshot:
            $ref: "#/components/x-commands/gestalt/x-rowArray"
