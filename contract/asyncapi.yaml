      payload: { $ref: "#/components/schemas/SoftwareListing" }

  schemas:
    Hello:
      type: object
      required: [type, contract, side, version]
      additionalProperties: false
      properties:
        type: { const: hello }
        contract:
          type: integer
          description: Contract revision; unequal revisions are refused.
        side: { enum: [guest, host] }
        version:
          type: string
          description: Sending app's own version, for display only.
        name:
          type: string
          description: Human-facing machine name, e.g. "Power Mac G3".
        os:
          type: string
          description: Guest OS version string, e.g. "9.1".
        chunk:
          type: integer
          minimum: 512
          maximum: 32768
          description: >
            Sender's preferred bulk chunk size in bytes; the connection uses
            the smaller of the two sides' preferences. Default 8192.
    Refuse:
      type: object
      required: [type, contract, reason]
      additionalProperties: false
      properties:
        type: { const: refuse }
        contract: { type: integer }
        reason:
          type: string
          description: Human-readable; shown in the UI, never swallowed.
    Ping:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: ping }
        id: { type: integer }
    Pong:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: pong }
        id: { type: integer }
    Bye:
      type: object
      required: [type, code]
      additionalProperties: false
      properties:
        type: { const: bye }
        code:
          enum: [normal, shutting-down, protocol-error]
          description: >
            Why the sender is closing, WS-close-code style. Distinguishes a
            calm "guest quit" from a failure in the peer's UI and lets the
            peer free state without waiting out the keepalive window.
        reason:
          type: string
          description: Optional human-readable detail; shown, never parsed.
    Error:
      type: object
      required: [type, code, message]
      additionalProperties: false
      properties:
        type: { const: error }
        id:
          type: integer
          description: Echoes the failed request's id when there is one.
        code:
          type: string
          description: Stable machine-readable slug, e.g. "capture-no-memory".
        message: { type: string }
    CommandRequest:
      type: object
      required: [type, id, name]
      additionalProperties: false
      properties:
        type: { const: command.request }
        id: { type: integer }
        name:
          type: string
          description: >
            A command from the x-commands registry below. An unknown name is
            answered with ok=false, error code "unknown-command" — never a
            protocol error; that is what keeps commands additive.
        args:
          type: object
          description: Per-command arguments; schema in x-commands.
    CommandResult:
      type: object
      required: [type, id, ok]
      additionalProperties: false
      properties:
        type: { const: command.result }
        id: { type: integer, description: Echoes the request id. }
        ok: { type: boolean }
        output:
          type: object
          description: Present when ok; schema per command in x-commands.
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable slug, e.g. "unknown-command".
            message: { type: string }
    CensusRequest:
      type: object
      required: [type, id, probe]
      additionalProperties: false
      properties:
        type: { const: census.request }
        id: { type: integer }
        probe:
          type: string
          description: >
            A probe from the x-census registry. An unknown probe is
            answered with outcome "refused" and a note — never a
            protocol error; that is what keeps the registry additive.
        cursor:
          type: integer
          description: Continue a paginated report from this index; 0 or
            absent starts the probe over.
    CensusReport:
      type: object
      required: [type, id, probe, outcome, rows, more]
      additionalProperties: false
      properties:
        type: { const: census.report }
        id: { type: integer, description: Echoes the request id. }
        probe: { type: string }
        outcome:
          enum: [present, absent, partial, refused, failed, not-attempted]
          description: >
            Semantics in x-census. The distinction is load-bearing;
            "absent" (the machine said no) is never conflated with
            "refused" (the responder declined to look).
        rows:
          type: array
          maxItems: 16
          description: >
            One page of [name, raw, meaning] string triples. The raw
            value always survives beside the decoded meaning; a value
            the responder cannot decode keeps its raw form and says so
            in the meaning column rather than being dropped.
          items:
            type: array
            minItems: 3
            maxItems: 3
            items: { type: string }
        more: { type: boolean }
        cursor:
          type: integer
          description: Pass back to continue; meaningful only when more.
        total:
          type: integer
          description: Total rows the probe will yield, when known.
        note:
          type: string
          description: >
            One human sentence about the outcome — why partial, why
            refused, what "absent" means on this machine.
    CaptureRequest:
      type: object
      required: [type, id, depth]
      additionalProperties: false
      properties:
        type: { const: capture.request }
        id: { type: integer }
        depth: { enum: [1, 2, 4, 8, 16, 32] }
        chunkKb: { type: integer, minimum: 1, maximum: 32 }
        paceMs: { type: integer, minimum: 0, maximum: 100 }
        pack: { type: boolean }
    StreamRequest:
      type: object
      required: [type, depth]
      additionalProperties: false
      properties:
        type: { const: stream.request }
        depth: { enum: [1, 2, 4, 8, 16, 32] }
    StreamStart:
      type: object
      required: [type, id, depth]
      additionalProperties: false
      properties:
        type: { const: stream.start }
        id:
          type: integer
          description: Stream id; every frame's capture.begin carries it.
        depth: { enum: [1, 2, 4, 8, 16, 32] }
        minIntervalMs:
          type: integer
          description: >
            Minimum ms between frame starts — the host's ceiling on frame
            rate. 0 or absent leaves the pace to the guest, which applies
            its own floor (~15 fps, backing off to ~4 while frames stay
            empty). Absent is not unbounded: an empty frame carries no
            pixels, so the wire alone does not pace one.
        chunkKb: { type: integer, minimum: 1, maximum: 32 }
        paceMs: { type: integer, minimum: 0, maximum: 100 }
        pack: { type: boolean }
        predictive:
          type: boolean
          description: Read only predicted-dirty rows plus a sweep.
        interlace:
          type: boolean
          description: Capture and send alternate decimated fields.
      description: >
        Tuning fields are the initiator's knobs: absent ones fall back
        to the guest's own panel settings, so a bare stream.start
        behaves exactly as before.
    StreamStop:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: stream.stop }
        id: { type: integer }
    StreamRefresh:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: stream.refresh }
        id: { type: integer }
      description: >
        Host asks for a keyframe: the guest's next frame is sent whole.
        Belt-and-suspenders against compositing drift; deltas reference
        the previous frame implicitly and TCP ordering makes that safe,
        so this should never be load-bearing.
    StreamStopped:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: stream.stopped }
        id: { type: integer }
        reason:
          type: string
          description: >
            Why the guest ended it, when the guest ended it ("busy: a
            transfer is in flight", "capture failed"); absent when
            acking the host's stream.stop.
    FileList:
      type: object
      required: [type, id, path]
      additionalProperties: false
      properties:
        type: { const: file.list }
        id: { type: integer }
        path:
          type: string
          description: Relative to the share root; "" is the root.
        cursor:
          type: integer
          description: Continue a paginated listing from this index.
    FileListing:
      type: object
      required: [type, id, path, entries, more]
      additionalProperties: false
      properties:
        type: { const: file.listing }
        id: { type: integer }
        path: { type: string }
        entries:
          type: array
          maxItems: 16
          items:
            type: object
            required: [name, kind]
            additionalProperties: false
            properties:
              name: { type: string }
              kind: { enum: [folder, file] }
              fileType: { type: string }
              creator: { type: string }
              dataBytes: { type: integer }
              rsrcBytes: { type: integer }
              modified:
                type: integer
                description: Classic Mac seconds since 1904.
        more: { type: boolean }
        cursor: { type: integer }
        root:
          type: string
          description: >
            What the responder is sharing, as that machine would write
            it ("Macintosh HD:Lab:", "/Users/me/Downloads"). Display
            only — never a path to send back, since everything on the
            wire is relative to this. Sent with the root listing so the
            asker can name the place it is looking at instead of
            calling it "the share".
    ProcessList:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: process.list }
        id: { type: integer }
        cursor:
          type: integer
          description: Continue a paginated listing from this index.
    ProcessListing:
      type: object
      required: [type, id, processes, more]
      additionalProperties: false
      properties:
        type: { const: process.listing }
        id: { type: integer }
        processes:
          type: array
          maxItems: 24
          items:
            type: object
            required: [name, kind]
            additionalProperties: false
            properties:
              name: { type: string }
              kind:
                enum: [application, background, finder]
                description: >
                  The responder's classification. background is a faceless
                  process (no user windows or menu bar); finder is that
                  machine's Finder/desktop.
              code:
                type: string
                description: >
                  The process "type" four-character code (e.g. "APPL"), as
                  the responding OS reports it; absent when it has none.
              creator:
                type: string
                description: The process creator four-character code.
              sizeKB:
                type: integer
                description: The process's memory partition, in KB.
              front:
                type: boolean
                description: The one frontmost process on that machine.
              psnHigh:
                type: integer
                description: >
                  High half of the process serial number. The PSN names a
                  running process to the drive verbs (process.front /
                  process.quit): it is valid only while the process lives,
                  so a stale one is refused rather than acted on.
              psnLow:
                type: integer
                description: Low half of the process serial number.
        more: { type: boolean }
        cursor: { type: integer }
    ProcessFront:
      type: object
      required: [type, id, psnHigh, psnLow]
      additionalProperties: false
      properties:
        type: { const: process.front }
        id: { type: integer }
        psnHigh:
          type: integer
          description: >
            High half of the target's PSN, echoed from a process.listing
            entry. The responder re-validates it against a live process
            and refuses if it has gone.
        psnLow: { type: integer }
    ProcessQuit:
      type: object
      required: [type, id, psnHigh, psnLow]
      additionalProperties: false
      properties:
        type: { const: process.quit }
        id: { type: integer }
        psnHigh:
          type: integer
          description: High half of the target's PSN, as process.front.
        psnLow: { type: integer }
    ProcessShot:
      type: object
      required: [type, id, psnHigh, psnLow]
      additionalProperties: false
      properties:
        type: { const: process.shot }
        id: { type: integer }
        psnHigh:
          type: integer
          description: >
            High half of the target's PSN. The guest brings that process
            forward, waits for it to repaint, then captures ONLY its front
            window and delivers the crop over the capture transport
            (capture.begin/bulk/end), correlated by this id exactly as a
            plain capture.request. On any failure it answers capture.end
            ok:false with this id, so the requester never waits forever.
        psnLow: { type: integer }
        depth:
          enum: [1, 2, 4, 8, 16, 32]
          description: Capture bit depth; the guest's preference if omitted.
    ProcessResult:
      type: object
      required: [type, id, ok]
      additionalProperties: false
      properties:
        type: { const: process.result }
        id: { type: integer }
        ok: { type: boolean }
        reason:
          type: string
          description: Present when ok is false; why the verb did not apply.
    SoftwareList:
      type: object
      required: [type, id, domain]
      additionalProperties: false
      properties:
        type: { const: software.list }
        id: { type: integer }
        domain:
          enum: [apps, extensions, cdevs, startup, apple]
          description: >
            apps sweeps the startup volume's catalog for applications;
            the rest enumerate the System Folder's special folders,
            disabled siblings included.
        cursor:
          type: integer
          description: >
            1-based over the responder's cached inventory. 1 (or absent)
            rebuilds the cache — for apps, the whole sweep.
    SoftwareListing:
      type: object
      required: [type, id, domain, entries, more]
      additionalProperties: false
      properties:
        type: { const: software.listing }
        id: { type: integer }
        domain: { type: string }
        entries:
          type: array
          maxItems: 10
          items:
            type: object
            required: [name, path]
            additionalProperties: false
            properties:
              name: { type: string }
              path:
                type: string
                description: >
                  Full HFS path — the launch key. Empty when the parent
                  chain could not be named honestly (too deep, or the
                  walk failed); such an entry is listed but not
                  launchable from afar.
              type: { type: string, description: Finder type 4CC. }
              creator: { type: string, description: Finder creator 4CC. }
              sizeK:
                type: integer
                description: Data + resource forks; -1 when unreadable.
              off:
                type: boolean
                description: In an Extensions Manager disabled folder.
              running:
                type: boolean
                description: Joined against the responder's processes.
              version:
                type: string
                description: >
                  The 'vers' short version string, read per SERVED
                  entry — a page's worth of fork opens per request, an
                  explicitly bounded cost, never a whole-inventory
                  walk. Absent when the file has no readable 'vers'.
        more: { type: boolean }
        cursor: { type: integer, description: Where the next page starts. }
        note:
          type: string
          description: >
            The honest edges: "no such domain", or the inventory
            truncated at the responder's cache.
    FileGet:
      type: object
      required: [type, id, path]
      additionalProperties: false
      properties:
        type: { const: file.get }
        id: { type: integer }
        path: { type: string }
        container:
          enum: [auto, data, macbinary]
          description: >
            auto (default) applies the container rule; macbinary forces
            the whole artifact.
        offset:
          type: integer
          description: >
            Resume: start the bulk stream at this byte instead of zero.
            Absent or 0 is a fresh pull. The requester is the receiver,
            so the offset is simply how much it already holds.
        resumeToken:
          type: string
          description: >
            The token the guest gave in the file.begin of the interrupted
            attempt. Required whenever offset > 0: the guest recomputes
            its token for the file as it stands NOW and refuses `changed`
            if it differs, because appending the tail of a file onto the
            head of a different one is worse than starting over. Absent
            with offset > 0 is refused `changed` as well — resuming
            blind is not offered.
    FileOffer:
      type: object
      required: [type, id, name, path, container, bytes]
      additionalProperties: false
      properties:
        type: { const: file.offer }
        id: { type: integer }
        name:
          type: string
          description: >
            Leaf name as it should land, already sanitized for HFS by
            the sender (<= 31 characters, no colons, MacRoman-encodable).
        path:
          type: string
          description: >
            Destination FOLDER, relative to the share root; "" is the
            root itself. Missing parents are created inside the share.
        container: { enum: [data, macbinary] }
        bytes:
          type: integer
          description: Exact size of the bulk stream to follow.
        fileType: { type: string }
        creator: { type: string }
        modified: { type: integer }
        overwrite:
          type: boolean
          description: >
            Absent or false means an existing file refuses `exists`;
            the sender may retry with true once a human has agreed.
        resumeToken:
          type: string
          description: >
            Stable identity of the SOURCE file, computed by the sender
            and never interpreted by the receiver — it only stores the
            token beside the partial and compares it later. It must
            change whenever the bytes would differ. The receiver answers
            file.accept with `have` > 0 only when it holds a partial
            recorded under this exact token, so an offer with no token,
            or with a token it has not seen, always starts at zero.
    FileAccept:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: file.accept }
        id: { type: integer }
        have:
          type: integer
          description: >
            Bytes of THIS file the receiver already holds from an
            interrupted attempt, and therefore the offset the sender
            should begin at. Absent or 0 means start from the beginning.
            Only ever non-zero when the offer carried a resumeToken
            matching a partial the receiver still has.
    FileDone:
      type: object
      required: [type, id, ok]
      additionalProperties: false
      properties:
        type: { const: file.done }
        id: { type: integer }
        ok: { type: boolean }
        code:
          enum: [exists, bad-path, io-error, too-big, cancelled, corrupt]
        reason: { type: string }
    FileProgress:
      type: object
      required: [type, id, received]
      additionalProperties: false
      description: >
        Sent by the guest while it receives a put, carrying the byte
        count it has actually taken off the wire. Advisory: it is
        dropped rather than queued when the control queue is busy, so a
        receiver must treat it as a floor that may skip, never as a
        sequence. Absence means an older guest, not a stalled one.
      properties:
        type: { const: file.progress }
        id:
          type: integer
          description: The file.offer id this progress belongs to.
        received:
          type: integer
          description: >
            Bytes received so far, counted where they are written, not
            where they were sent.
    FileRefuse:
      type: object
      required: [type, id, code]
      additionalProperties: false
      properties:
        type: { const: file.refuse }
        id: { type: integer }
        code:
          enum: [busy, exists, bad-path, not-found, io-error, too-big,
                 changed]
        reason: { type: string }
    FileBegin:
      type: object
      required: [type, id, transfer, name, container, bytes]
      additionalProperties: false
      properties:
        type: { const: file.begin }
        id: { type: integer }
        transfer: { type: integer }
        name: { type: string }
        container: { enum: [data, macbinary] }
        bytes: { type: integer }
        dataBytes: { type: integer }
        rsrcBytes: { type: integer }
        fileType: { type: string }
        creator: { type: string }
        modified: { type: integer }
        offset:
          type: integer
          description: >
            First byte of the file this stream carries. Absent or 0 is a
            whole file. `bytes` remains the size of the WHOLE file, not
            of the stream, so a receiver's progress and a human's
            progress bar mean the same thing on a resumed transfer as on
            a fresh one.
        resumeToken:
          type: string
          description: >
            Identity of the file being sent, for the receiver to store
            beside a partial so a later attempt can prove it is the same
            file. On a pull this is the guest's token for its own file;
            on a push it echoes the offer's.
    FileEnd:
      type: object
      required: [type, id, transfer, ok]
      additionalProperties: false
      properties:
        type: { const: file.end }
        id: { type: integer }
        transfer: { type: integer }
        ok: { type: boolean }
        sendMs: { type: integer }
    FileMove:
      type: object
      required: [type, id, path, toPath]
      additionalProperties: false
      properties:
        type: { const: file.move }
        id: { type: integer }
        path:
          type: string
          description: The item now, relative to the share root.
        toPath:
          type: string
          description: >
            Where it should be, relative to the share root, including
            its name — so a rename and a move are the same operation.
            Missing parent folders are NOT created: moving into a
            folder that is not there is a mistake, not an instruction.
        overwrite: { type: boolean }
    FileTrash:
      type: object
      required: [type, id, path]
      additionalProperties: false
      properties:
        type: { const: file.trash }
        id: { type: integer }
        path: { type: string }
    FileRestore:
      type: object
      required: [type, id, trashedAs, toPath]
      additionalProperties: false
      properties:
        type: { const: file.restore }
        id: { type: integer }
        trashedAs:
          type: string
          description: >
            The item's name inside the Trash, as file.trash reported it.
        toPath:
          type: string
          description: >
            Where to put it back, relative to the share root and
            including its name. The enclosing folder must still exist:
            restoring into a folder we invented would put the item
            somewhere it never was.
    FileMkdir:
      type: object
      required: [type, id, path]
      additionalProperties: false
      properties:
        type: { const: file.mkdir }
        id: { type: integer }
        path:
          type: string
          description: The folder to create, relative to the share root.
    FileResult:
      type: object
      required: [type, id, ok]
      additionalProperties: false
      properties:
        type: { const: file.result }
        id: { type: integer }
        ok: { type: boolean }
        path:
          type: string
          description: Where the item ended up, when that is expressible.
        trashedAs:
          type: string
          description: >
            Answering file.trash: the name the item landed under inside
            the Trash. Pass it back to file.restore.
        code:
          enum: [exists, bad-path, not-found, io-error, busy]
        reason: { type: string }
        crc32:
          type: integer
          description: >
            CRC-32 (IEEE, the zlib polynomial) of the WHOLE file's bytes,
            not of this stream — so a file stitched from two attempts is
            checked as the thing it is meant to be. Optional: absent
            means the sender did not compute one, which a receiver must
            treat as "unchecked", never as "correct". A receiver that
            computes a mismatch answers file.done ok:false code:corrupt
            and keeps nothing.

    FileCancel:
      type: object
      required: [type, transfer]
      additionalProperties: false
      properties:
        type: { const: file.cancel }
        transfer: { type: integer }
    CaptureOffer:
      type: object
      required: [type, id, width, height, depth, rowBytes, bytes]
      additionalProperties: false
      properties:
        type: { const: capture.offer }
        id:
          type: integer
          description: >
            Guest-chosen id; the capture.accept / capture.refuse answer and
            the eventual capture.begin all carry it. A separate id space
            from capture.request — origins never share correlation.
        width: { type: integer }
        height: { type: integer }
        depth: { enum: [1, 2, 4, 8, 16, 32] }
        rowBytes: { type: integer }
        bytes:
          type: integer
          description: Exact bulk-stream size — the capture is already
            encoded when the offer is sent.
        paletteBytes: { type: integer }
        encoding: { enum: [raw, packbits] }
        captureMs: { type: integer }
        encodeMs: { type: integer }
    CaptureAccept:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: capture.accept }
        id: { type: integer }
    CaptureRefuse:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: capture.refuse }
        id: { type: integer }
        reason:
          type: string
          description: Human-readable; it lands in the guest's panel.
    CaptureCancel:
      type: object
      required: [type, transfer]
      additionalProperties: false
      properties:
        type: { const: capture.cancel }
        transfer:
          type: integer
          description: >
            The transfer to abandon, from capture.begin. A guest that is no
            longer sending that transfer ignores the message.
    CaptureBegin:
      type: object
      required: [type, id, transfer, width, height, depth, rowBytes, bytes]
      additionalProperties: false
      properties:
        type: { const: capture.begin }
        paletteBytes:
          type: integer
          description: >
            Leading bytes of the bulk stream holding the palette as RGB
            triples (indexed depths <= 8); 0 for direct colour. Sending the
            guest's own CLUT means the host needs no hardcoded table.
        encoding:
          enum: [raw, packbits]
          description: >
            raw = rows verbatim. packbits = each row PackBits-compressed and
            prefixed with a big-endian u16 packed length. NOT PICT: modern
            macOS cannot decode QuickDraw pictures, so the wire uses a format
            both sides own (PICT remains the guest's on-disk format).
        captureMs:
          type: integer
          description: Guest-side screen blit time, for tuning.
        encodeMs:
          type: integer
          description: Guest-side encode time, for tuning.
        id:
          type: integer
          description: The capture.request id, or a guest-chosen id for
            captures initiated on the guest.
        transfer: { type: integer, minimum: 1, maximum: 65535 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        depth: { enum: [1, 8, 16, 32] }
        rowBytes: { type: integer, minimum: 1 }
        bytes:
          type: integer
          minimum: 1
          description: Total bulk bytes to expect (rowBytes * height).
        frame:
          enum: [key, delta, empty]
          description: >
            Stream frames only (absent on one-shot captures). "key" is a
            whole screen; "delta" carries only the rects, referencing the
            previous frame implicitly (TCP ordering makes that safe);
            "empty" means nothing changed - bytes is 0 and no bulk
            follows, so a static screen still ticks at full rate for
            ~150 bytes a frame.
        rects:
          type: array
          maxItems: 16
          items:
            type: array
            minItems: 4
            maxItems: 5
            description: >
              [row, nRows, colByteOffset, colBytes, rowStep?] - dirty
              rows trimmed to their changed column span, in BYTES into
              the row so the wire stays depth-agnostic. The bulk payload
              is the rects' rows in order, each row's slice encoded
              exactly like a full row (u16-prefixed PackBits, or raw).
              rowStep (default 1) strides the destination rows: an
              interlaced field sends rowStep 2, patching rows row,
              row + 2, ... while the other parity waits for the next
              field.
            items: { type: integer }
    CaptureEnd:
      type: object
      required: [type, id, transfer, ok]
      additionalProperties: false
      properties:
        type: { const: capture.end }
        id: { type: integer }
        transfer: { type: integer }
        ok: { type: boolean }
        sendMs:
          type: integer
          description: Guest-side time spent streaming the bulk chunks.

  # The console command registry: the CLOSED set of commands a guest serves.
  # Every entry declares its args and output; the consoles on both sides and
  # the guest's dispatch table are all views of this list.
  x-commands:
    gestalt:
      description: >
        The guest's own account of itself, via the Gestalt Manager. Always
        returns every group; the console shows a slice (default = snapshot,
        or one of the domain groups, or --full for all). --save and --help
        are console affordances and never reach the wire.
      args: {}
      output:
        type: object
        description: >
          Grouped, ordered rows. Each group maps to an array of [label, value]
          string pairs, preserving order (unlike a plain object).
        properties:
          snapshot: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
          cpu: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
          memory: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
          os: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
          network: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
          hw: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
      x-rowArray:
        type: array
        items:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: string }
    ls:
      description: >
        List a folder in the guest's share. No path = the share root.
        Output rows: one per entry (name, then kind/type and sizes),
        capped for the console; the Files module uses file.list.
      args:
        path: { type: string }
      output:
        type: object
        properties:
          ls: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    putstat:
      description: >
        Where the last file the guest RECEIVED spent its time: bytes,
        chunk and write counts, and the milliseconds inside FSWrite
        against the whole receive path. Measured on that machine, which
        is the only place the disk can be told apart from the wire —
        diagnosing a transfer from the far end of it is how several
        wrong theories got their evidence.
      args: {}
      output:
        type: object
        properties:
          putstat: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    tail:
      description: >
        The last lines of the guest's log for this launch. The log is a
        file per launch in a "now-logs" folder beside the application, so
        what happened survives a crash that takes the window, the status
        line and every in-memory buffer with it. The same command answers
        on that Mac's own console; this is the copy read from here, which
        matters because that machine is the harder one to look at.
      args:
        lines:
          type: integer
          description: How many, newest last. Default 20, most 40.
      output:
        type: object
        properties:
          tail: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    vprobe:
      description: >
        Measure the guest's VRAM read cost by access method: raw
        framebuffer reads at 8/16/32/64-bit widths against the CopyBits
        baseline, reread caching, partial-read linearity, and pixel
        fidelity. A measurement surface for streaming work; the ~3 s run
        wants a still screen.
      args: {}
      output:
        type: object
        properties:
          vprobe: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    screenshot:
      description: >
        Capture the guest's screen. Slice one: the guest captures, encodes a
        packed PICT, and (unless save=false) writes it to its own desktop —
        pixels do not cross the wire yet; the result is the measurement rows.
        The bulk-channel transfer variant is the next contract step.
      args:
        type: object
        properties:
          depth:
            type: string
            enum: ["1", "2", "4", "8", "16", "32"]
            description: Capture depth; defaults to the guest panel setting.
          save:
            type: string
            enum: ["true", "false"]
            description: false = measure only, write nothing.
      output:
        type: object
        properties:
          screenshot:
            $ref: "#/components/x-commands/gestalt/x-rowArray"
    ps:
      description: >
        The guest's running processes, one row per process: the name, and
        its kind / size / whether it is frontmost. The console's flat read
        of the same Process Manager the Processes module drives — as ls is
        to file.list, ps is to process.list. Read-only; a process list is
        no more than the Application menu already shows. One generous page;
        the row count is small on this hardware, so it does not paginate.
      args: {}
      output:
        type: object
        properties:
          ps: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    census:
      description: >
        Run one hardware-census probe and return its rows. The console's
        flat, single-page read of the census the Hardware module pages
        through censusExchange — the same probe registry (x-census below),
        collapsed to [name, meaning] for a text surface. No probe name runs
        "overview". An unknown name is ok=false, never a protocol error, so
        the command set stays additive across versions.
      args:
        type: object
        properties:
          probe:
            type: string
            description: A probe name from x-census; empty runs "overview".
      output:
        type: object
        properties:
          census: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    catsearch:
      description: >
        Time a whole-volume catalog search for applications: PBCatSearch
        over the receiver's startup volume matching file type APPL, run
        in short time slices — cold, then warm to expose caching. The
        measurement probe behind the Software module's planned inventory
        sweep; it answers whether a full application index is affordable
        on the machine's real disk before anything is built on that
        assumption. Read-only — the sweep reads the catalog, never a
        file. Seconds normally; bounded at ~20 s per pass on a disk
        that cannot answer faster.
      args: {}
      output:
        type: object
        properties:
          catsearch: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    sw:
      description: >
        The receiver's installed software, one page a domain. No domain
        is the overview — per-domain counts, enabled and disabled. The
        folder domains (extensions, cdevs, startup, apple) enumerate the
        System Folder's special folders live, including the Extensions
        Manager's disabled siblings, tagged "(off)". "apps" sweeps the
        startup volume's catalog for type APPL (the catsearch-verified
        sweep) and stops at one page rather than paying for hits nobody
        asked to see. Read-only; versions need a resource fork open per
        file and are deliberately not here.
      args:
        type: object
        properties:
          domain:
            type: string
            enum: ["apps", "extensions", "cdevs", "startup", "apple"]
            description: Empty or absent runs the overview.
      output:
        type: object
        properties:
          sw: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    launch:
      description: >
        Open an application on the receiver: the software family's one
        mutation. A bare name is resolved by an exact-name catalog
        search of the startup volume; a full HFS path (contains a
        colon) is used directly, and non-APPL targets are refused. The
        name is the whole target after an optional flag — spaces need
        no quoting (surrounding quotes are stripped if used). When a
        bare name matches SEVERAL applications the responder launches
        the first found and the reply names its version (one fork open,
        not a walk). To force a copy: the leading flag "-v VERSION"
        matches a short version string ("-v 1.1.1 SimpleText"), a full
        path is exact, or "#n" picks from the last search's stored
        matches (which "vers <name>" prints). The launched app comes to that machine's
        front (LaunchApplication without launchDontSwitch), which the
        next process.listing or process.shot will show. Both outcomes
        are logged under the sw area with the wire id.
      args:
        type: object
        properties:
          target:
            type: string
            description: >
              "[-v VERSION] NAME", where NAME is the whole remainder
              (spaces need no quotes); or a full HFS path; or "#n" from
              the stored match list. "target" and not "name" — see the
              arg-key rule in the preamble above.
      output:
        type: object
        properties:
          launch: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    reveal:
      description: >
        Show an installed item in the RECEIVER's own Finder, selected in
        its enclosing window — the read-only companion to launch. It
        opens nothing and runs nothing: it sends the receiver's Finder a
        single "make objects visible" Apple Event (kAEMiscStandards /
        kAEMakeObjectsVisible) for the item's alias, then brings the
        Finder forward so the selection is not revealed behind another
        window. The item is resolved exactly as launch and vers resolve
        it — a bare name by exact-name catalog search (the first match
        when several share it), a full HFS path used directly, or "#n"
        from the stored match list — but ANY item is revealable, not only
        applications, since nothing is executed. Symmetric: whoever
        receives reveal reveals it in its OWN Finder, on its OWN screen.
      args:
        type: object
        properties:
          target:
            type: string
            description: >
              An item name, a full HFS path (the software.listing's
              path — the launch key doubles as the reveal key), or "#n"
              from the stored match list. "target" and not "name" — see
              the arg-key rule in the preamble above.
      output:
        type: object
        properties:
          reveal: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
    vers:
      description: >
        One file's 'vers' resources — the short version, the numeric
        version and stage, the Get Info string, and the product (id 2)
        when present — read from that one file's resource fork alone
        (Get1Resource, never the chain: the System's 'vers' answering
        for a file that has none is the most convincing wrong answer).
        Bounded by design: a fork open per file is the measured
        expensive path, so this never loops an inventory — but a bare
        name that matches SEVERAL applications shows them all as a
        NUMBERED list, full paths wrapped across continuation rows
        (truncated paths were a metal complaint), up to five. The
        numbers are live: they are stored on the responder, and a
        following launch or vers may say just "#n". Resolution is
        launch's — bare name searches applications, a full path reads
        any file. Absence of a 'vers' is an answer.
      args:
        type: object
        properties:
          target:
            type: string
            description: >
              An application name, a full HFS path, or "#n" picking
              from the responder's stored match list. "target" and not
              "name" — see the arg-key rule in the preamble above.
      output:
        type: object
        properties:
          vers: { $ref: "#/components/x-commands/gestalt/x-rowArray" }

  # The census probe registry: the CLOSED, DECLARED set of probes a side may
  # be asked about, and the outcome vocabulary every report speaks. Adding a
  # probe is additive (an older peer answers outcome "refused",
  # note "unknown probe"); changing a probe's row columns is breaking and
  # bumps the revision. Probes are passive by rule — read-only walks of
  # tables the OS maintains. The one exception is declared on the probe.
  x-census:
    x-outcomes:
      present: The probe ran and returned data.
      absent: >
        The probe ran cleanly and the MACHINE said no — no expansion
        slots, no SCSI bus. Absence is a finding about the machine,
        rendered as content, never as an error.
      partial: >
        The probe ran but reached a smaller surface than its full form
        (the PowerPC path reads the 20-byte SysParm copy where 68K
        reads 256 bytes of XPRAM). The note says what was out of reach.
      refused: >
        The RESPONDER declined to look: probe not served yet, safety
        gate, unknown probe name. "We did not look" and "it is not
        there" are never conflated.
      failed: >
        The probe started and could not finish. Possibly transient;
        re-asking is reasonable.
      not-attempted: The cursor never reached it, or it was skipped.
    x-probes:
      overview:
        columns: [Fact, Raw, Meaning]
        description: >
          The synthesis, in plain words: model, processor, memory,
          system, display and storage as a person would say them.
          Overview holds no truth of its own — it arranges what the
          other probes read, and each fact keeps its trail (the probes
          it came from), so the semantic layer is never an opaque guess.
          Rows with an empty value are section captions.
      identity:
        columns: [Fact, Raw, Meaning]
        description: >
          The machine in a curated dozen: model, CPU and clock, RAM,
          ROM, OS, CarbonLib, QuickDraw, keyboard, networking — the
          ring-0 "what is this machine", decoded to words.
      selectors:
        columns: [Selector, Raw, Meaning]
        description: >
          The full documented Gestalt walk (renamed from gestalt). Raw
          is the untouched value; the Meaning is a one-line summary and
          the detail carries every set attr bit, named or numbered as a
          candidate — the unresolved bin is the corpus-growth path.
          Gestalt cannot enumerate undocumented selectors, so the walk
          is exactly the snapshotted table and says so.
      video:
        columns: [Field, Raw, Meaning]
        description: GDevice walk; one record of fields per display.
      volumes:
        columns: [Volume, Raw, Meaning]
        description: Mounted volumes via indexed PBHGetVInfo.
      drives:
        columns: [Drive, Raw, Meaning]
        description: The drive queue — zero bus I/O.
      drivers:
        columns: [Driver, Raw, Meaning]
        description: The Device Manager unit table, with an in-ROM check.
      adb:
        columns: [Device, Raw, Meaning]
        description: The ADB device table (CountADBs / GetIndADB).
      ata:
        columns: [Device, Raw, Meaning]
        description: >
          IDENTIFY DEVICE through the ATA Manager - the internal IDE boot
          disk the SCSI scan cannot see. The 1400c's ATA Manager is
          68K-trap-only ($AAF1), reached through a metal-proven Mixed Mode
          dispatch (see x-trap). IDENTIFY is a non-destructive read. On the
          1400c the manager answers noErr with an empty IDENTIFY buffer, so
          the row reports the device present without a model; a drive that
          fills the buffer decodes into model, capacity and firmware.
      pccard:
        columns: [Field, Raw, Meaning]
        description: >
          Card Services' own view via CSGetCardServicesInfo ($AAF0,
          selector 7) over the same Mixed Mode dispatch: CS version and
          socket count, plus the CS vendor string. Touches no socket and
          no card - a card's own identity lives in its CIS, which stays out
          of the census (the 1400c's CIS-freeze history) until a gated
          design exists. Metal-proven: CS 2.01, 4 sockets.
      power:
        columns: [Battery, Raw, Meaning]
        description: >
          The Power Manager's battery view - charge, source, state -
          gated on gestaltPowerMgrAttr. Carbon-clean; a desktop answers
          absent. The probe most worth watching over time once the
          extension's counter tier lands.
      pci:
        columns: [Device, Raw, Meaning]
        description: >
          The Name Registry (Open Firmware device tree). Resolved from
          NameRegistryLib and gated on gestaltNameRegistryVersion, so a
          pre-PCI Mac (the 1400c) answers `absent` without touching the
          library; a PCI Mac enumerates its device-tree nodes. Read-only.
      pram:
        columns: [Offset, Raw, Meaning]
        description: >
          Parameter RAM. Decoded spans first, raw hex rows after; on
          PowerPC the 20-byte SysParm copy is all there is, reported as
          outcome "partial".
      scsi:
        columns: [Target, Raw, Meaning]
        description: >
          THE DECLARED EXCEPTION to passive-by-rule - an INQUIRY bus
          scan, active bus I/O. Gated on gestaltHardwareAttr saying a
          bus exists (answering "absent" otherwise), and paced at ONE
          target per page so a wedged target stalls at most one frame
          turnaround. A responder may refuse it outright; attended
          first runs on real hardware are the expected discipline.
