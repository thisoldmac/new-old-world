# New Old World wire contract.
#
# One TCP connection, one contract, multiplexed by an 8-byte binary frame
# header. Control payloads are JSON (this document's schemas); bulk payloads
# are raw bytes correlated by transfer id. AsyncAPI describes the messages;
# the frame layer below is normative prose because no schema standard
# expresses binary framing.
#
# The semantics deliberately mirror RFC 6455 (WebSocket): control/bulk maps
# to text/binary, ping/pong and bye map to the WS control frames, and the
# contract revision plays the subprotocol role. The guest wire is NOT literal
# WebSocket (no HTTP upgrade, no client masking, fixed 8-byte header — the
# classic side stays minimal); the mirroring exists so a host-side ws://
# bridge for modern clients is a projection, not a translation.
#
# Frame header (8 bytes, big-endian):
#
#   offset  size  field     meaning
#   0       u8    channel   0 = control, 1 = bulk
#   1       u8    flags     bit0 END: last frame of this transfer
#   2       u16   transfer  bulk correlation id; 0 on control frames
#   4       u32   length    payload bytes that follow (max 32768)
#
# Transport:
# - Frames run over any reliable ordered byte stream. Today that is plain
#   TCP; a future secure transport (pinned-key TLS) wraps the stream below
#   the frame layer and changes nothing in this document.
# - Secure transport, when it exists, is selected per-port like ws://wss://.
#   There is NO in-band upgrade (no STARTTLS-style negotiation), ever.
# - Each frame is written as ONE contiguous send (header + payload together).
#   Back-to-back small writes are dropped by real classic-Mac NICs (the
#   PB1400c Farallon driver drops the second frame of a TX burst).
#
# Connection rules:
# - The guest dials the host and sends `hello` first; the host answers
#   `hello` (accept) or `refuse` and closes. Nothing else may precede hello.
#   The handshake is per-connection: a reconnect re-hellos.
# - `contract` is a single integer revision. Unequal revisions => refuse.
#   Breaking changes bump it; additive optional fields do not.
# - The host serves ONE guest at a time (v1): a second dial is refused with
#   reason "busy: <connected guest name>". Host internals stay
#   session-shaped so multi-guest later is a UI decision, not a rework.
# - Control messages that expect an answer carry `id`; answers echo it.
# - Bulk transfers are announced on control (`capture.begin`), stream on the
#   bulk channel in chunks (default 8192 bytes, negotiable in hello), and
#   finish with the END flag plus a closing control message.
# - Keepalive is GUEST-driven: the guest sends `ping` after 30s of wire
#   silence; the host answers `pong` and initiates no pings of its own
#   (pinging a wedged classic endpoint just piles bytes into a dead hole).
#   Death declaration: guest after 2 unanswered pings (~65s); host passively
#   after ~75s without any traffic. Both sides surface it honestly.
# - Graceful exit sends `bye {code, reason?}` before closing (guest then
#   drains and uses OTSndOrderlyDisconnect — unannounced closes leak
#   T_DISCONNECT indications on OS 9). bye is best-effort; crashes and lid
#   closes never send it, so it complements the keepalive, never replaces
#   it. Codes (WS-close-code discipline, small and stable): "normal",
#   "shutting-down", "protocol-error".
# - The guest auto-reconnects with capped backoff (2s doubling to 30s)
#   while its app is running.
# - Commands: the host console is a shell into the guest — every command a
#   human types there becomes one command.request and exactly one
#   command.result. The command set is CLOSED and DECLARED: every command's
#   name, args, and output schema live in this file (x-commands). Adding a
#   command is additive (no revision bump — an older peer answers
#   unknown-command cleanly); changing a command's shape is breaking and
#   bumps the revision. The wire is never a TTY: no raw keystrokes, no
#   byte-streams — shell face, typed spine.
#   RULE: an arg key must not shadow an envelope key (type, id, name,
#   args). The classic guest scans a frame FLAT — first occurrence wins —
#   so a shadowed key is read as the command name. launch shipped that
#   bug to metal with an arg named "name"; the family uses "target".

asyncapi: 3.0.0

info:
  title: New Old World wire contract
  version: 0.1.0
  x-contract-revision: 1

defaultContentType: application/json

channels:
  control:
    address: "0"
    description: JSON control messages, framed on channel 0.
    messages:
      hello: { $ref: "#/components/messages/hello" }
      refuse: { $ref: "#/components/messages/refuse" }
      ping: { $ref: "#/components/messages/ping" }
      pong: { $ref: "#/components/messages/pong" }
      bye: { $ref: "#/components/messages/bye" }
      error: { $ref: "#/components/messages/error" }
      commandRequest: { $ref: "#/components/messages/commandRequest" }
      commandResult: { $ref: "#/components/messages/commandResult" }
      censusRequest: { $ref: "#/components/messages/censusRequest" }
      censusReport: { $ref: "#/components/messages/censusReport" }
      captureRequest: { $ref: "#/components/messages/captureRequest" }
      captureCancel: { $ref: "#/components/messages/captureCancel" }
      streamRequest: { $ref: "#/components/messages/streamRequest" }
      streamStart: { $ref: "#/components/messages/streamStart" }
      streamStop: { $ref: "#/components/messages/streamStop" }
      streamRefresh: { $ref: "#/components/messages/streamRefresh" }
      streamStopped: { $ref: "#/components/messages/streamStopped" }
      fileList: { $ref: "#/components/messages/fileList" }
      fileListing: { $ref: "#/components/messages/fileListing" }
      fileGet: { $ref: "#/components/messages/fileGet" }
      fileOffer: { $ref: "#/components/messages/fileOffer" }
      fileAccept: { $ref: "#/components/messages/fileAccept" }
      fileRefuse: { $ref: "#/components/messages/fileRefuse" }
      fileDone: { $ref: "#/components/messages/fileDone" }
      fileBegin: { $ref: "#/components/messages/fileBegin" }
      fileEnd: { $ref: "#/components/messages/fileEnd" }
      fileCancel: { $ref: "#/components/messages/fileCancel" }
      fileMove: { $ref: "#/components/messages/fileMove" }
      fileTrash: { $ref: "#/components/messages/fileTrash" }
      fileRestore: { $ref: "#/components/messages/fileRestore" }
      fileMkdir: { $ref: "#/components/messages/fileMkdir" }
      fileResult: { $ref: "#/components/messages/fileResult" }
      captureOffer: { $ref: "#/components/messages/captureOffer" }
      captureAccept: { $ref: "#/components/messages/captureAccept" }
      captureRefuse: { $ref: "#/components/messages/captureRefuse" }
      captureBegin: { $ref: "#/components/messages/captureBegin" }
      captureEnd: { $ref: "#/components/messages/captureEnd" }
      processList: { $ref: "#/components/messages/processList" }
      processListing: { $ref: "#/components/messages/processListing" }
      processFront: { $ref: "#/components/messages/processFront" }
      processQuit: { $ref: "#/components/messages/processQuit" }
      processShot: { $ref: "#/components/messages/processShot" }
      processResult: { $ref: "#/components/messages/processResult" }
      softwareList: { $ref: "#/components/messages/softwareList" }
      softwareListing: { $ref: "#/components/messages/softwareListing" }
  bulk:
    address: "1"
    description: >
      Raw payload bytes on channel 1, correlated by the frame header's
      transfer id. Two payload kinds ride it: capture pixel data (rows
      top-to-bottom, rowBytes apart; depth 8 uses the guest's palette;
      16 is RGB555 big-endian; 32 is xRGB8888 big-endian) and file
      content (file.begin describes the container). The control message
      that began the transfer says which.

operations:
  guestOffersCapture:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/captureOffer"
      - $ref: "#/channels/control/messages/captureBegin"
      - $ref: "#/channels/control/messages/captureEnd"
    description: >
      Guest announces and completes a capture transfer. A transfer starts
      one of two ways: answering the host's capture.request (capture.begin
      follows directly, correlated by the request id), or guest-initiated
      push — the guest captures first, announces with capture.offer
      (carrying true byte counts, so a refusal costs nothing but the
      capture), and sends capture.begin only after the host answers
      capture.accept. Either way the frames and capture.end are identical;
      one transfer at a time still holds across both origins.
  hostControlsStream:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/streamStart"
      - $ref: "#/channels/control/messages/streamStop"
      - $ref: "#/channels/control/messages/streamRefresh"
    description: >
      Host brackets a live stream. Between stream.start and the guest's
      stream.stopped, the guest sends frames as ordinary capture
      transfers whose capture.begin id is the stream id — that id is the
      routing: no disk, no announcement, straight to the live view. The
      guest self-paces (finish a frame, capture fresh — never queue). The
      wire paces frames that carry pixels; frames that do not (an
      unchanged screen sends a ~150-byte control pair and no bulk data)
      are paced by the guest's own floor, which minIntervalMs raises.
      The stream owns the transfer lane: capture.request and
      capture.offer are refused while it runs.
  guestRequestsStream:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/streamRequest"
    description: >
      Guest asks the host to open a stream bracket. The bracket stays
      host-owned — both origins share one path — so the host answers
      with a normal stream.start, or an error (code "stream-busy") if
      the lane is taken. A guest whose ask goes unanswered gives up
      after a timeout and tells its human.
  guestEndsStream:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/streamStopped"
    description: >
      stream.stopped is always the stream's last word — it acks the
      host's stream.stop (any in-flight frame is aborted first, ending
      ok:false) and equally lets the guest end the stream on its own,
      with the reason saying why.
  hostBrowsesFiles:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/fileList"
      - $ref: "#/channels/control/messages/fileGet"
      - $ref: "#/channels/control/messages/fileCancel"
    description: >
      THE FILE FAMILY IS SYMMETRIC. Every message here means the same
      thing whichever side sends it, and whoever RECEIVES a request
      serves its OWN share: the host browsing the guest and the guest
      browsing the host are the same exchange with the roles swapped.
      Each machine shares exactly one folder, and a share bounds what
      the other machine may reach on its own initiative — never what a
      human deliberately sends, so the source of a push is any file the
      sender picks and only the destination must lie inside a share.

      These verbs are requester-centric like HTTP's — file.get is the
      sender obtaining a file. Note that the CONSOLE surface is
      deliberately the other frame: it is a shell into the guest, so a
      console `put` means the guest puts a file to the host (see
      docs/files.md). Host UI affordances speak host-native
      ("Download"). Paths are RELATIVE
      to the guest's configured share root ("" is the root; segments
      joined with ":"): a path outside the share is inexpressible, and
      any empty segment ("::" traversal) refuses bad-path. file.get
      needs no accept - the requester is the receiver; failures answer
      with file.refuse. One transfer at a time still holds across
      captures, streams, and files.
  hostPutsFiles:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/fileOffer"
    description: >
      Host offers a file for the guest's share. A share bounds what the
      other machine may reach on its own initiative — list, pull, write
      into — and never what a human deliberately sends, so the SOURCE of
      a push is any file the sender picks; only the DESTINATION must lie
      inside the share. The guest answers file.accept or file.refuse
      without prompting anyone (it is not necessarily attended), then
      the host sends file.begin, the bulk stream, and file.end. The
      guest confirms with file.done only once the bytes are written and
      the file is stamped: a put is not finished until the File Manager
      says so. While the bytes stream the guest reports what it has
      actually taken, with file.progress — the sender's own "handed to
      the socket" count is not evidence the far side received anything,
      and on a slow link it runs minutes ahead of the truth.
  hostChangesFiles:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/fileMove"
      - $ref: "#/channels/control/messages/fileTrash"
      - $ref: "#/channels/control/messages/fileRestore"
      - $ref: "#/channels/control/messages/fileMkdir"
    description: >
      Changing what is in the share, rather than what flows across it.
      Every one of these is reversible, which is the point: deleting
      moves an item to the Trash rather than erasing it, so the inverse
      is a move back, and the answer carries what the inverse needs.
      Every inverse is a move, expressed in names on both ends. A
      trashed item is named by where it landed — file.trash answers with
      the name it now has inside the Trash, which is not always the name
      it had, since the Trash may already hold one. That name plus the
      path it came from is everything file.restore needs, so nothing is
      remembered on either side and an undo survives a restart of either.
      The Trash is a real folder; a name in it is as durable a way to say
      "that item" as a path anywhere else.

      file.progress is also the sender's CLOCK. A sender may run no more
      than a bounded number of bytes ahead of the count the receiver has
      confirmed, because a bulk stream offered faster than the link
      carries it accumulates in the sending kernel's buffer, and from the
      moment that buffer is non-empty the careful gaps between writes
      stop existing on the wire (see the pacing rule in
      docs/architecture.md). That is not a tuning preference: on this
      link it is the difference between 340 KB/s and 5 KB/s, and the
      collapse does not recover on its own.

      Transfers RESUME rather than restart. An offer may carry a
      resumeToken naming the source file; a receiver holding a partial
      recorded under that same token answers file.accept with `have`,
      and the sender begins at that offset with file.begin carrying it.
      A receiver never resumes onto a file it cannot prove is the same
      one — no token, or a token it does not recognise, means start at
      zero, which is merely slow where the alternative is silently
      wrong. file.end may carry a crc32 over the whole file, which
      matters most exactly here: a resumed file is stitched from two
      sessions and nothing else checks the seam.

  guestServesFiles:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/fileListing"
      - $ref: "#/channels/control/messages/fileRefuse"
      - $ref: "#/channels/control/messages/fileBegin"
      - $ref: "#/channels/control/messages/fileEnd"
      - $ref: "#/channels/control/messages/fileProgress"
    description: >
      Listings paginate (control frames cap at 4 KB); a transfer is the
      standard begin -> bulk -> end shape. The container rule: data-only
      files travel as the raw data fork; resource-only files as
      MacBinary; both-forks defaults to the data fork with MacBinary on
      request. Text conversion is the HOST's job - the guest ships raw
      bytes and metadata.
  hostAnswersOffer:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/captureAccept"
      - $ref: "#/channels/control/messages/captureRefuse"
    description: >
      Host grants or declines a guest-initiated capture offer. Accepting is
      policy, not ceremony — a host normally accepts unless a transfer is
      already in flight. A guest whose offer goes unanswered abandons it
      after a timeout and reports that to its human.
  hostRequestsCapture:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/captureRequest"
      - $ref: "#/channels/control/messages/captureCancel"
    description: >
      Host asks the guest to capture, and may abandon a transfer already in
      flight. Cancel is advisory: the guest stops sending bulk frames and
      closes the transfer with capture.end ok:false, so the host learns the
      outcome the same way it would from any other failure.
  censusExchange:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/censusRequest"
      - $ref: "#/channels/control/messages/censusReport"
    description: >
      The hardware census: either side asks, and whoever RECEIVES a
      census.request answers for its own machine — the family is
      symmetric by definition. Reports paginate exactly like file
      listings (control frames cap at 4 KB): each request carries a
      cursor, each report answers one bounded page and says whether
      more follow. Pagination is also the pacing mechanism — a probe
      does at most one page of work per request (the SCSI scan touches
      one target per page), so a census never stalls the wire. The
      outcome vocabulary and probe registry live in x-census below.
      In practice the host asks and the guest — the machine with hardware
      worth asking about — serves; a side that does not serve a probe
      answers outcome "refused" with a note (a well-formed refusal, never
      a protocol error), which is how the host answers a census.request
      aimed at it. The asymmetry is declared here, not accidental.
  hostBrowsesProcesses:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/processList"
    description: >
      process.list means the same thing whichever side sends it, and
      whoever RECEIVES it serves its OWN running processes - so the family
      is symmetric in MEANING. But NOW is a cockpit for driving old Macs
      from new ones, so it implements one direction only: the host asks,
      the guest (Process Manager) answers. The reverse (guest asking the
      host) is a non-goal and deliberately unimplemented - the host will
      ignore a process.list rather than serve one. Read-only and needs no
      share: a process list reveals nothing a person could not see in the
      Application menu. The listing paginates (frames cap at 4 KB) with
      cursor/more, and is also the mirror's degraded plane - process list
      and front app are legible without the resident anchor plane at all.
  guestServesProcesses:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/processListing"
    description: >
      The answer to process.list: one entry per running process, the
      guest's own. kind classifies each (application / background /
      finder); front marks the frontmost; psnHigh/psnLow name the process
      to the drive verbs. Paginates when the list outgrows a 4 KB frame.
  hostBrowsesSoftware:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/softwareList"
    description: >
      software.list means the same thing whichever side sends it, and
      whoever RECEIVES it serves its OWN installed software — symmetric
      in MEANING, one direction in implementation, the process.list
      precedent exactly: the host asks, the guest answers, and the host
      will ignore a software.list rather than serve one. Cursor 1 (or
      absent) rebuilds the responder's inventory — for the "apps"
      domain that is a whole-volume catalog sweep, measured ~4 s on
      real hardware, so the asker's watchdog must outlive it. Later
      cursors page the same inventory without re-paying the sweep.
      Read-only.
  guestServesSoftware:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/softwareListing"
    description: >
      The answer to software.list: one entry per installed item. path is
      the launch key — the asker launches by sending the launch command
      with entry.path, so the name-ambiguity refusal can never fire from
      a listing; an empty path means the chain could not be named
      honestly and the entry is not launchable from afar. off marks the
      Extensions Manager's disabled siblings; running is the join
      against the responder's process list. version rides each served
      page — a bounded handful of fork opens per request, the price a
      page explicitly asks for — and is absent when a file has no
      readable 'vers'. Paginates by cursor/more inside 4 KB frames;
      note carries the honest edges (unknown domain, inventory
      truncated at the cache).
  hostDrivesProcess:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/processFront"
      - $ref: "#/channels/control/messages/processQuit"
      - $ref: "#/channels/control/messages/processShot"
    description: >
      The drive verbs, same host->guest arrow as the listing: process.front
      brings a process forward (SetFrontProcess), process.quit asks it to
      quit (a 'quit' Apple Event it may decline), and process.shot fronts a
      process then captures just its front window. Each names its target by
      the PSN echoed from a process.listing entry; the guest re-validates
      that PSN against a live process before acting. process.front and
      process.quit answer with process.result; process.shot answers with a
      capture transfer (capture.begin/bulk/end), or capture.end ok:false on
      failure - it reuses the capture transport rather than inventing one.
      Like the listing, the reverse direction is a non-goal - the guest
      issues no drive verbs at the host.
  guestAnswersDrive:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/processResult"
    description: >
      The one reply shape for both drive verbs: ok true when the verb was
      applied (for quit, that the event was sent - not that the app has
      gone, which it may decline), or ok false with a reason when the PSN
      no longer names a live process or the Toolbox refused.

