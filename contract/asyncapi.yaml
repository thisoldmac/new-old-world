# New Old World wire contract.
#
# One TCP connection, one contract, multiplexed by an 8-byte binary frame
# header. Control payloads are JSON (this document's schemas); bulk payloads
# are raw bytes correlated by transfer id. AsyncAPI describes the messages;
# the frame layer below is normative prose because no schema standard
# expresses binary framing.
#
# The semantics deliberately mirror RFC 6455 (WebSocket): control/bulk maps
# to text/binary, ping/pong and bye map to the WS control frames, and the
# contract revision plays the subprotocol role. The guest wire is NOT literal
# WebSocket (no HTTP upgrade, no client masking, fixed 8-byte header — the
# classic side stays minimal); the mirroring exists so a host-side ws://
# bridge for modern clients is a projection, not a translation.
#
# Frame header (8 bytes, big-endian):
#
#   offset  size  field     meaning
#   0       u8    channel   0 = control, 1 = bulk
#   1       u8    flags     bit0 END: last frame of this transfer
#   2       u16   transfer  bulk correlation id; 0 on control frames
#   4       u32   length    payload bytes that follow (max 32768)
#
# Transport:
# - Frames run over any reliable ordered byte stream. Today that is plain
#   TCP; a future secure transport (pinned-key TLS) wraps the stream below
#   the frame layer and changes nothing in this document.
# - Secure transport, when it exists, is selected per-port like ws://wss://.
#   There is NO in-band upgrade (no STARTTLS-style negotiation), ever.
# - Each frame is written as ONE contiguous send (header + payload together).
#   Back-to-back small writes are dropped by real classic-Mac NICs (the
#   PB1400c Farallon driver drops the second frame of a TX burst).
#
# Connection rules:
# - The guest dials the host and sends `hello` first; the host answers
#   `hello` (accept) or `refuse` and closes. Nothing else may precede hello.
#   The handshake is per-connection: a reconnect re-hellos.
# - `contract` is a single integer revision. Unequal revisions => refuse.
#   Breaking changes bump it; additive optional fields do not.
# - The host serves ONE guest at a time (v1): a second dial is refused with
#   reason "busy: <connected guest name>". Host internals stay
#   session-shaped so multi-guest later is a UI decision, not a rework.
# - Control messages that expect an answer carry `id`; answers echo it.
# - Bulk transfers are announced on control (`capture.begin`), stream on the
#   bulk channel in chunks (default 8192 bytes, negotiable in hello), and
#   finish with the END flag plus a closing control message.
# - Keepalive is GUEST-driven: the guest sends `ping` after 30s of wire
#   silence; the host answers `pong` and initiates no pings of its own
#   (pinging a wedged classic endpoint just piles bytes into a dead hole).
#   Death declaration: guest after 2 unanswered pings (~65s); host passively
#   after ~75s without any traffic. Both sides surface it honestly.
# - Graceful exit sends `bye {code, reason?}` before closing (guest then
#   drains and uses OTSndOrderlyDisconnect — unannounced closes leak
#   T_DISCONNECT indications on OS 9). bye is best-effort; crashes and lid
#   closes never send it, so it complements the keepalive, never replaces
#   it. Codes (WS-close-code discipline, small and stable): "normal",
#   "shutting-down", "protocol-error".
# - The guest auto-reconnects with capped backoff (2s doubling to 30s)
#   while its app is running.
# - Commands: the host console is a shell into the guest — every command a
#   human types there becomes one command.request and exactly one
#   command.result. The command set is CLOSED and DECLARED: every command's
#   name, args, and output schema live in this file (x-commands). Adding a
#   command is additive (no revision bump — an older peer answers
#   unknown-command cleanly); changing a command's shape is breaking and
#   bumps the revision. The wire is never a TTY: no raw keystrokes, no
#   byte-streams — shell face, typed spine.

asyncapi: 3.0.0

info:
  title: New Old World wire contract
  version: 0.1.0
  x-contract-revision: 1

defaultContentType: application/json

channels:
  control:
    address: "0"
    description: JSON control messages, framed on channel 0.
    messages:
      hello: { $ref: "#/components/messages/hello" }
      refuse: { $ref: "#/components/messages/refuse" }
      ping: { $ref: "#/components/messages/ping" }
      pong: { $ref: "#/components/messages/pong" }
      bye: { $ref: "#/components/messages/bye" }
      error: { $ref: "#/components/messages/error" }
      commandRequest: { $ref: "#/components/messages/commandRequest" }
      commandResult: { $ref: "#/components/messages/commandResult" }
      captureRequest: { $ref: "#/components/messages/captureRequest" }
      captureCancel: { $ref: "#/components/messages/captureCancel" }
      streamRequest: { $ref: "#/components/messages/streamRequest" }
      streamStart: { $ref: "#/components/messages/streamStart" }
      streamStop: { $ref: "#/components/messages/streamStop" }
      streamRefresh: { $ref: "#/components/messages/streamRefresh" }
      streamStopped: { $ref: "#/components/messages/streamStopped" }
      captureOffer: { $ref: "#/components/messages/captureOffer" }
      captureAccept: { $ref: "#/components/messages/captureAccept" }
      captureRefuse: { $ref: "#/components/messages/captureRefuse" }
      captureBegin: { $ref: "#/components/messages/captureBegin" }
      captureEnd: { $ref: "#/components/messages/captureEnd" }
  bulk:
    address: "1"
    description: >
      Raw payload bytes on channel 1, correlated by the frame header's
      transfer id. v1 carries capture pixel data only: rows top-to-bottom,
      rowBytes apart. Depth 8 uses the standard system palette; depth 16 is
      RGB555 big-endian; depth 32 is xRGB8888 big-endian.

operations:
  guestOffersCapture:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/captureOffer"
      - $ref: "#/channels/control/messages/captureBegin"
      - $ref: "#/channels/control/messages/captureEnd"
    description: >
      Guest announces and completes a capture transfer. A transfer starts
      one of two ways: answering the host's capture.request (capture.begin
      follows directly, correlated by the request id), or guest-initiated
      push — the guest captures first, announces with capture.offer
      (carrying true byte counts, so a refusal costs nothing but the
      capture), and sends capture.begin only after the host answers
      capture.accept. Either way the frames and capture.end are identical;
      one transfer at a time still holds across both origins.
  hostControlsStream:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/streamStart"
      - $ref: "#/channels/control/messages/streamStop"
      - $ref: "#/channels/control/messages/streamRefresh"
    description: >
      Host brackets a live stream. Between stream.start and the guest's
      stream.stopped, the guest sends frames as ordinary capture
      transfers whose capture.begin id is the stream id — that id is the
      routing: no disk, no announcement, straight to the live view. The
      guest self-paces (finish a frame, capture fresh — never queue), so
      the wire's pace is the frame rate; minIntervalMs only throttles
      below that. The stream owns the transfer lane: capture.request and
      capture.offer are refused while it runs.
  guestRequestsStream:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/streamRequest"
    description: >
      Guest asks the host to open a stream bracket. The bracket stays
      host-owned — both origins share one path — so the host answers
      with a normal stream.start, or an error (code "stream-busy") if
      the lane is taken. A guest whose ask goes unanswered gives up
      after a timeout and tells its human.
  guestEndsStream:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/streamStopped"
    description: >
      stream.stopped is always the stream's last word — it acks the
      host's stream.stop (any in-flight frame is aborted first, ending
      ok:false) and equally lets the guest end the stream on its own,
      with the reason saying why.
  hostAnswersOffer:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/captureAccept"
      - $ref: "#/channels/control/messages/captureRefuse"
    description: >
      Host grants or declines a guest-initiated capture offer. Accepting is
      policy, not ceremony — a host normally accepts unless a transfer is
      already in flight. A guest whose offer goes unanswered abandons it
      after a timeout and reports that to its human.
  hostRequestsCapture:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/captureRequest"
      - $ref: "#/channels/control/messages/captureCancel"
    description: >
      Host asks the guest to capture, and may abandon a transfer already in
      flight. Cancel is advisory: the guest stops sending bulk frames and
      closes the transfer with capture.end ok:false, so the host learns the
      outcome the same way it would from any other failure.

components:
  messages:
    hello:
      name: hello
      payload: { $ref: "#/components/schemas/Hello" }
    refuse:
      name: refuse
      payload: { $ref: "#/components/schemas/Refuse" }
    ping:
      name: ping
      payload: { $ref: "#/components/schemas/Ping" }
    pong:
      name: pong
      payload: { $ref: "#/components/schemas/Pong" }
    bye:
      name: bye
      payload: { $ref: "#/components/schemas/Bye" }
    error:
      name: error
      payload: { $ref: "#/components/schemas/Error" }
    commandRequest:
      name: command.request
      payload: { $ref: "#/components/schemas/CommandRequest" }
    commandResult:
      name: command.result
      payload: { $ref: "#/components/schemas/CommandResult" }
    captureRequest:
      name: capture.request
      payload: { $ref: "#/components/schemas/CaptureRequest" }
    streamRequest:
      name: stream.request
      payload: { $ref: "#/components/schemas/StreamRequest" }
    streamStart:
      name: stream.start
      payload: { $ref: "#/components/schemas/StreamStart" }
    streamStop:
      name: stream.stop
      payload: { $ref: "#/components/schemas/StreamStop" }
    streamRefresh:
      name: stream.refresh
      payload: { $ref: "#/components/schemas/StreamRefresh" }
    streamStopped:
      name: stream.stopped
      payload: { $ref: "#/components/schemas/StreamStopped" }
    captureOffer:
      name: capture.offer
      payload: { $ref: "#/components/schemas/CaptureOffer" }
    captureAccept:
      name: capture.accept
      payload: { $ref: "#/components/schemas/CaptureAccept" }
    captureRefuse:
      name: capture.refuse
      payload: { $ref: "#/components/schemas/CaptureRefuse" }
    captureCancel:
      name: capture.cancel
      payload: { $ref: "#/components/schemas/CaptureCancel" }
    captureBegin:
      name: capture.begin
      payload: { $ref: "#/components/schemas/CaptureBegin" }
    captureEnd:
      name: capture.end
      payload: { $ref: "#/components/schemas/CaptureEnd" }

  schemas:
    Hello:
      type: object
      required: [type, contract, side, version]
      additionalProperties: false
      properties:
        type: { const: hello }
        contract:
          type: integer
          description: Contract revision; unequal revisions are refused.
        side: { enum: [guest, host] }
        version:
          type: string
          description: Sending app's own version, for display only.
        name:
          type: string
          description: Human-facing machine name, e.g. "Power Mac G3".
        os:
          type: string
          description: Guest OS version string, e.g. "9.1".
        chunk:
          type: integer
          minimum: 512
          maximum: 32768
          description: >
            Sender's preferred bulk chunk size in bytes; the connection uses
            the smaller of the two sides' preferences. Default 8192.
    Refuse:
      type: object
      required: [type, contract, reason]
      additionalProperties: false
      properties:
        type: { const: refuse }
        contract: { type: integer }
        reason:
          type: string
          description: Human-readable; shown in the UI, never swallowed.
    Ping:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: ping }
        id: { type: integer }
    Pong:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: pong }
        id: { type: integer }
    Bye:
      type: object
      required: [type, code]
      additionalProperties: false
      properties:
        type: { const: bye }
        code:
          enum: [normal, shutting-down, protocol-error]
          description: >
            Why the sender is closing, WS-close-code style. Distinguishes a
            calm "guest quit" from a failure in the peer's UI and lets the
            peer free state without waiting out the keepalive window.
        reason:
          type: string
          description: Optional human-readable detail; shown, never parsed.
    Error:
      type: object
      required: [type, code, message]
      additionalProperties: false
      properties:
        type: { const: error }
        id:
          type: integer
          description: Echoes the failed request's id when there is one.
        code:
          type: string
          description: Stable machine-readable slug, e.g. "capture-no-memory".
        message: { type: string }
    CommandRequest:
      type: object
      required: [type, id, name]
      additionalProperties: false
      properties:
        type: { const: command.request }
        id: { type: integer }
        name:
          type: string
          description: >
            A command from the x-commands registry below. An unknown name is
            answered with ok=false, error code "unknown-command" — never a
            protocol error; that is what keeps commands additive.
        args:
          type: object
          description: Per-command arguments; schema in x-commands.
    CommandResult:
      type: object
      required: [type, id, ok]
      additionalProperties: false
      properties:
        type: { const: command.result }
        id: { type: integer, description: Echoes the request id. }
        ok: { type: boolean }
        output:
          type: object
          description: Present when ok; schema per command in x-commands.
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable slug, e.g. "unknown-command".
            message: { type: string }
    CaptureRequest:
      type: object
      required: [type, id, depth]
      additionalProperties: false
      properties:
        type: { const: capture.request }
        id: { type: integer }
        depth: { enum: [1, 2, 4, 8, 16, 32] }
    StreamRequest:
      type: object
      required: [type, depth]
      additionalProperties: false
      properties:
        type: { const: stream.request }
        depth: { enum: [1, 2, 4, 8, 16, 32] }
    StreamStart:
      type: object
      required: [type, id, depth]
      additionalProperties: false
      properties:
        type: { const: stream.start }
        id:
          type: integer
          description: Stream id; every frame's capture.begin carries it.
        depth: { enum: [1, 2, 4, 8, 16, 32] }
        minIntervalMs:
          type: integer
          description: >
            Minimum ms between frame starts; 0 or absent = wire-paced.
    StreamStop:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: stream.stop }
        id: { type: integer }
    StreamRefresh:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: stream.refresh }
        id: { type: integer }
      description: >
        Host asks for a keyframe: the guest's next frame is sent whole.
        Belt-and-suspenders against compositing drift; deltas reference
        the previous frame implicitly and TCP ordering makes that safe,
        so this should never be load-bearing.
    StreamStopped:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: stream.stopped }
        id: { type: integer }
        reason:
          type: string
          description: >
            Why the guest ended it, when the guest ended it ("busy: a
            transfer is in flight", "capture failed"); absent when
            acking the host's stream.stop.
    CaptureOffer:
      type: object
      required: [type, id, width, height, depth, rowBytes, bytes]
      additionalProperties: false
      properties:
        type: { const: capture.offer }
        id:
          type: integer
          description: >
            Guest-chosen id; the capture.accept / capture.refuse answer and
            the eventual capture.begin all carry it. A separate id space
            from capture.request — origins never share correlation.
        width: { type: integer }
        height: { type: integer }
        depth: { enum: [1, 2, 4, 8, 16, 32] }
        rowBytes: { type: integer }
        bytes:
          type: integer
          description: Exact bulk-stream size — the capture is already
            encoded when the offer is sent.
        paletteBytes: { type: integer }
        encoding: { enum: [raw, packbits] }
        captureMs: { type: integer }
        encodeMs: { type: integer }
    CaptureAccept:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: capture.accept }
        id: { type: integer }
    CaptureRefuse:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { const: capture.refuse }
        id: { type: integer }
        reason:
          type: string
          description: Human-readable; it lands in the guest's panel.
    CaptureCancel:
      type: object
      required: [type, transfer]
      additionalProperties: false
      properties:
        type: { const: capture.cancel }
        transfer:
          type: integer
          description: >
            The transfer to abandon, from capture.begin. A guest that is no
            longer sending that transfer ignores the message.
    CaptureBegin:
      type: object
      required: [type, id, transfer, width, height, depth, rowBytes, bytes]
      additionalProperties: false
      properties:
        type: { const: capture.begin }
        paletteBytes:
          type: integer
          description: >
            Leading bytes of the bulk stream holding the palette as RGB
            triples (indexed depths <= 8); 0 for direct colour. Sending the
            guest's own CLUT means the host needs no hardcoded table.
        encoding:
          enum: [raw, packbits]
          description: >
            raw = rows verbatim. packbits = each row PackBits-compressed and
            prefixed with a big-endian u16 packed length. NOT PICT: modern
            macOS cannot decode QuickDraw pictures, so the wire uses a format
            both sides own (PICT remains the guest's on-disk format).
        captureMs:
          type: integer
          description: Guest-side screen blit time, for tuning.
        encodeMs:
          type: integer
          description: Guest-side encode time, for tuning.
        id:
          type: integer
          description: The capture.request id, or a guest-chosen id for
            captures initiated on the guest.
        transfer: { type: integer, minimum: 1, maximum: 65535 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        depth: { enum: [1, 8, 16, 32] }
        rowBytes: { type: integer, minimum: 1 }
        bytes:
          type: integer
          minimum: 1
          description: Total bulk bytes to expect (rowBytes * height).
        frame:
          enum: [key, delta, empty]
          description: >
            Stream frames only (absent on one-shot captures). "key" is a
            whole screen; "delta" carries only the rects, referencing the
            previous frame implicitly (TCP ordering makes that safe);
            "empty" means nothing changed - bytes is 0 and no bulk
            follows, so a static screen still ticks at full rate for
            ~150 bytes a frame.
        rects:
          type: array
          maxItems: 16
          items:
            type: array
            minItems: 4
            maxItems: 4
            description: >
              [row, nRows, colByteOffset, colBytes] - dirty rows trimmed
              to their changed column span, in BYTES into the row so the
              wire stays depth-agnostic. The bulk payload is the rects'
              rows in order, each row's slice encoded exactly like a
              full row (u16-prefixed PackBits, or raw).
            items: { type: integer }
    CaptureEnd:
      type: object
      required: [type, id, transfer, ok]
      additionalProperties: false
      properties:
        type: { const: capture.end }
        id: { type: integer }
        transfer: { type: integer }
        ok: { type: boolean }
        sendMs:
          type: integer
          description: Guest-side time spent streaming the bulk chunks.

  # The console command registry: the CLOSED set of commands a guest serves.
  # Every entry declares its args and output; the consoles on both sides and
  # the guest's dispatch table are all views of this list.
  x-commands:
    gestalt:
      description: >
        The guest's own account of itself, via the Gestalt Manager. Always
        returns every group; the console shows a slice (default = snapshot,
        or one of the domain groups, or --full for all). --save and --help
        are console affordances and never reach the wire.
      args: {}
      output:
        type: object
        description: >
          Grouped, ordered rows. Each group maps to an array of [label, value]
          string pairs, preserving order (unlike a plain object).
        properties:
          snapshot: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
          cpu: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
          memory: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
          os: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
          network: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
          hw: { $ref: "#/components/x-commands/gestalt/x-rowArray" }
      x-rowArray:
        type: array
        items:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: string }
    screenshot:
      description: >
        Capture the guest's screen. Slice one: the guest captures, encodes a
        packed PICT, and (unless save=false) writes it to its own desktop —
        pixels do not cross the wire yet; the result is the measurement rows.
        The bulk-channel transfer variant is the next contract step.
      args:
        type: object
        properties:
          depth:
            type: string
            enum: ["1", "2", "4", "8", "16", "32"]
            description: Capture depth; defaults to the guest panel setting.
          save:
            type: string
            enum: ["true", "false"]
            description: false = measure only, write nothing.
      output:
        type: object
        properties:
          screenshot:
            $ref: "#/components/x-commands/gestalt/x-rowArray"
