# New Old World wire contract.
#
# One TCP connection, one contract, multiplexed by an 8-byte binary frame
# header. Control payloads are JSON (this document's schemas); bulk payloads
# are raw bytes correlated by transfer id. AsyncAPI describes the messages;
# the frame layer below is normative prose because no schema standard
# expresses binary framing.
#
# The semantics deliberately mirror RFC 6455 (WebSocket): control/bulk maps
# to text/binary, ping/pong and bye map to the WS control frames, and the
# contract revision plays the subprotocol role. The guest wire is NOT literal
# WebSocket (no HTTP upgrade, no client masking, fixed 8-byte header — the
# classic side stays minimal); the mirroring exists so a host-side ws://
# bridge for modern clients is a projection, not a translation.
#
# Frame header (8 bytes, big-endian):
#
#   offset  size  field     meaning
#   0       u8    channel   0 = control, 1 = bulk
#   1       u8    flags     bit0 END: last frame of this transfer
#   2       u16   transfer  bulk correlation id; 0 on control frames
#   4       u32   length    payload bytes that follow (max 32768)
#
# Transport:
# - Frames run over any reliable ordered byte stream. Today that is plain
#   TCP; a future secure transport (pinned-key TLS) wraps the stream below
#   the frame layer and changes nothing in this document.
# - Secure transport, when it exists, is selected per-port like ws://wss://.
#   There is NO in-band upgrade (no STARTTLS-style negotiation), ever.
# - Each frame is written as ONE contiguous send (header + payload together).
#   Back-to-back small writes are dropped by real classic-Mac NICs (the
#   PB1400c Farallon driver drops the second frame of a TX burst).
#
# Connection rules:
# - The guest dials the host and sends `hello` first; the host answers
#   `hello` (accept) or `refuse` and closes. Nothing else may precede hello.
#   The handshake is per-connection: a reconnect re-hellos.
# - `contract` is a single integer revision. Unequal revisions => refuse.
#   Breaking changes bump it; additive optional fields do not.
# - The host serves SEVERAL guests concurrently, told apart by the identity
#   in their `hello` — `name`, compared trimmed and case-folded. A dial from
#   a machine that is not already connected is accepted and served alongside
#   the others. A dial repeating the name of a LIVE session is refused with
#   reason "busy: <connected guest name>": the same refusal as before, now
#   meaning "that machine is already here" rather than "some machine is".
#   A host may also bound how many it serves and refuse beyond it, with a
#   reason saying so.
#   This is not a guest-visible change and needs no revision bump: the wire
#   is per-connection, nothing in it changed shape, and a guest cannot tell
#   — and must not try to infer — how many others are connected.
#   IDENTITY IS THE NAME, which is as strong as the names are distinct. Two
#   machines calling themselves the same thing are one guest to this rule,
#   and the second is refused busy. A stable per-machine id, if that ever
#   bites, is a new optional `hello` field and a change to both halves.
# - A connection may declare a ROLE in its hello. Absent or `session` is a
#   normal guest session and is everything above. `resident` is a LIVENESS
#   CHANNEL opened by an optional resident component on the same machine,
#   and it exists for one reason: on a cooperatively-scheduled Macintosh a
#   blocked callee starves EVERY application, so the guest app cannot send
#   its own keepalive precisely when the host most needs to know the
#   machine is alive. Measured 2026-08-05: a Finder modal starved every
#   process on the guest — including an unrelated background application on
#   its own port — for over 90s, past the host's ~75s silence window, so
#   the wire died against a healthy machine.
#   A resident connection therefore:
#     * is NOT a guest session. It never becomes the active guest, is never
#       offered a command, and does not count against a host's guest bound.
#     * SHARES the name of the machine's guest app deliberately — that name
#       is what associates the two — and is exempt from the busy refusal
#       for exactly that reason. It is the one dial that may repeat a live
#       session's name.
#     * may send only `hello`, `ping` and `bye`, and is answered `pong`. It
#       carries no state and reports nothing about the application: how
#       long the app has been silent is something the RECEIVER already
#       knows, and a second account of it on the wire would be a second
#       place to be wrong.
#   What it licenses is one inference and no more: traffic on a live
#   resident channel means THE MACHINE IS ALIVE, so a silent guest session
#   for that machine is STARVED rather than GONE. A host may hold such a
#   session open past its silence window and must say which state it is in.
#   With no resident channel the old rule stands unchanged, which is what
#   keeps a resident component optional.
#   ADDITIVE — no revision bump. A host that has never heard of the field
#   sees a hello it will refuse busy, which is the previous behaviour and
#   costs a machine nothing it had.
# - Control messages that expect an answer carry `id`; answers echo it.
# - Bulk transfers are announced on control (`capture.begin`), stream on the
#   bulk channel in chunks (default 8192 bytes, negotiable in hello), and
#   finish with the END flag plus a closing control message.
# - Keepalive is GUEST-driven: the guest sends `ping` after 30s of wire
#   silence; the host answers `pong` and initiates no pings of its own
#   (pinging a wedged classic endpoint just piles bytes into a dead hole).
#   Death declaration: guest after 2 unanswered pings (~65s); host passively
#   after ~75s without any traffic. Both sides surface it honestly.
# - Graceful exit sends `bye {code, reason?}` before closing (guest then
#   drains and uses OTSndOrderlyDisconnect — unannounced closes leak
#   T_DISCONNECT indications on OS 9). bye is best-effort; crashes and lid
#   closes never send it, so it complements the keepalive, never replaces
#   it. Codes (WS-close-code discipline, small and stable): "normal",
#   "shutting-down", "protocol-error".
# - The guest auto-reconnects while its app is running. The CADENCE is
#   guest policy, not a wire obligation, and the host must never infer
#   anything from it — not liveness, not health, not which guest it is.
#   The one rule the contract keeps is a FLOOR: at least 1s between dial
#   attempts, so a misconfigured or wedged guest cannot turn into a
#   connect flood against a host that is merely down.
#   Capped backoff (2s doubling to 30s) is the REFERENCE DEFAULT and what
#   a guest should do absent a reason. Both shipping guests also offer a
#   fixed interval, because predictable reconnects beat adaptive
#   politeness on a private LAN: the PowerPC guest through prefs
#   `retry_secs` (0 = the reference backoff, else every N seconds) since
#   its first release, and NOW-68K only that way, human-started and
#   human-stopped. The clause used to mandate backoff and was accurate to
#   neither guest — a contract stating a rule that no implementation
#   follows teaches everyone to skim it.
# - Commands: the host console is a shell into the guest — every command a
#   human types there becomes one command.request and exactly one
#   command.result. The command set is CLOSED and DECLARED: every command's
#   name, args, and output schema live in this file (x-commands). Adding a
#   command is additive (no revision bump — an older peer answers
#   unknown-command cleanly); changing a command's shape is breaking and
#   bumps the revision. The wire is never a TTY: no raw keystrokes, no
#   byte-streams — shell face, typed spine.
#
#   CORRECTED 2026-07-28: the sentence above ("never a TTY") described the
#   command plane, and was written as though it described the wire. It now
#   describes the command plane only. There is a second plane — exec —
#   whose whole purpose is to carry a line this file has never heard of;
#   see "Exec" below. Neither clause is retracted: the typed spine keeps
#   every property it was built for, and exec keeps none of them on
#   purpose.
#
#   TWO CALLERS, TWO SHAPES. A typed caller (a host module, an agent) knows
#   the command it is calling and sends `args`. A CONSOLE does not: it is a
#   dumb shell that relays the line a human typed and knows no command's
#   grammar, so it sends `line` — the raw text after the command name —
#   and the grammar is parsed by the side that SERVES the command. This is
#   deliberate: there are now two guests with different command tables, and
#   a console that carried a command list would be wrong for both. It also
#   means every argument grammar has exactly one implementation, on the
#   machine that owns the verb.
#   RULE: an arg key must not shadow an envelope key (type, id, name,
#   args, line). The classic guest scans a frame FLAT — first occurrence
#   wins — so a shadowed key is read as the command name. launch shipped
#   that bug to metal with an arg named "name"; the family uses "target".
# - Exec: the SECOND plane, and the opposite bargain (added 2026-07-28).
#   exec.request carries ONE field that matters — `line`, the whole line a
#   human typed, byte for byte, with no name split off it. This file does
#   not declare what lines mean. It cannot: that is the point. The guest
#   interprets the line and answers with the TEXT its own console would
#   have shown, in exec.output frames terminated by exactly one
#   exec.result.
#   WHY A SECOND PLANE INSTEAD OF LOOSENING THE FIRST. The typed spine
#   earns its closure — a module or an agent calling `process.quit` wants
#   a declared shape, and x-commands is what makes that checkable. What it
#   cost was iteration: a verb was not typeable from the host until this
#   file declared it AND the host was rebuilt, so the console was most
#   expensive exactly when it was most useful, and the two sides drifted
#   in the gap. Exec pays that cost to zero and buys nothing else. A verb
#   added to a guest is typeable from an UNCHANGED host binary against an
#   UNCHANGED contract. That sentence is the acceptance test for this
#   plane; if it stops being true, the plane has failed and no amount of
#   passing tests says otherwise.
#   ONE IMPLEMENTATION STILL. Exec is a FACE, not an implementation — it
#   dispatches into the same command table the guest's own console runs
#   and renders with the same text renderer, so it cannot answer a
#   question differently from the machine's own keyboard. It is legal
#   under the one-implementation rule for the same reason the guest's
#   console is (docs/command-parity.md). A guest that grows a second
#   dispatch behind exec has broken that rule, and the parity test says so.
#   TEXT, NOT ROWS. exec.output carries free text because a plane that
#   does not know the command cannot know its columns. The typed plane's
#   [label, value] rows stay exactly as they are for callers that DO know.
#   STILL NOT A TTY, AND THE DISTINCTION IS WORTH KEEPING. exec now
#   streams (many exec.output frames), can be stopped (exec.cancel) and can
#   be answered mid-command (exec.input) - but the unit is a LINE, never a
#   keystroke, and there is no terminal state on this wire: no cursor
#   addressing, no escape sequences this contract ascribes meaning to, no
#   resize, no raw mode. A guest may put anything in `text`, and a host that
#   wants to interpret VT sequences inside it may - but that is the host
#   choosing to render bytes it was handed, not this contract carrying a
#   terminal. The line, not the keystroke, is what keeps a cooperatively
#   scheduled Mac answerable.
#   CONTROL CHANNEL, NEVER BULK. Exec rides channel 0 as small JSON
#   frames. The bulk lane is one transfer wide across both directions, so
#   an exec session holding it would block capture and file transfer for
#   its lifetime. It also wants the control channel's queue-and-retry:
#   pixels are re-capturable, a command's output is not.

asyncapi: 3.0.0

info:
  title: New Old World wire contract
  version: 0.1.0
  x-contract-revision: 2

defaultContentType: application/json

channels:
  control:
    address: "0"
    description: JSON control messages, framed on channel 0.
    messages:
      hello: { $ref: "#/components/messages/hello" }
      refuse: { $ref: "#/components/messages/refuse" }
      ping: { $ref: "#/components/messages/ping" }
      pong: { $ref: "#/components/messages/pong" }
      bye: { $ref: "#/components/messages/bye" }
      error: { $ref: "#/components/messages/error" }
      commandRequest: { $ref: "#/components/messages/commandRequest" }
      commandResult: { $ref: "#/components/messages/commandResult" }
      execRequest: { $ref: "#/components/messages/execRequest" }
      execOutput: { $ref: "#/components/messages/execOutput" }
      execResult: { $ref: "#/components/messages/execResult" }
      execCancel: { $ref: "#/components/messages/execCancel" }
      execInput: { $ref: "#/components/messages/execInput" }
      censusRequest: { $ref: "#/components/messages/censusRequest" }
      censusReport: { $ref: "#/components/messages/censusReport" }
      captureRequest: { $ref: "#/components/messages/captureRequest" }
      captureCancel: { $ref: "#/components/messages/captureCancel" }
      streamRequest: { $ref: "#/components/messages/streamRequest" }
      streamStart: { $ref: "#/components/messages/streamStart" }
      streamStop: { $ref: "#/components/messages/streamStop" }
      streamRefresh: { $ref: "#/components/messages/streamRefresh" }
      streamStopped: { $ref: "#/components/messages/streamStopped" }
      fileList: { $ref: "#/components/messages/fileList" }
      fileListing: { $ref: "#/components/messages/fileListing" }
      fileGet: { $ref: "#/components/messages/fileGet" }
      fileOffer: { $ref: "#/components/messages/fileOffer" }
      fileAccept: { $ref: "#/components/messages/fileAccept" }
      fileRefuse: { $ref: "#/components/messages/fileRefuse" }
      fileDone: { $ref: "#/components/messages/fileDone" }
      fileBegin: { $ref: "#/components/messages/fileBegin" }
      fileEnd: { $ref: "#/components/messages/fileEnd" }
      fileCancel: { $ref: "#/components/messages/fileCancel" }
      fileMove: { $ref: "#/components/messages/fileMove" }
      fileTrash: { $ref: "#/components/messages/fileTrash" }
      fileRestore: { $ref: "#/components/messages/fileRestore" }
      fileMkdir: { $ref: "#/components/messages/fileMkdir" }
      fileResult: { $ref: "#/components/messages/fileResult" }
      captureOffer: { $ref: "#/components/messages/captureOffer" }
      captureAccept: { $ref: "#/components/messages/captureAccept" }
      captureRefuse: { $ref: "#/components/messages/captureRefuse" }
      captureBegin: { $ref: "#/components/messages/captureBegin" }
      captureEnd: { $ref: "#/components/messages/captureEnd" }
      sceneRequest: { $ref: "#/components/messages/sceneRequest" }
      sceneBegin: { $ref: "#/components/messages/sceneBegin" }
      sceneEnd: { $ref: "#/components/messages/sceneEnd" }
      processList: { $ref: "#/components/messages/processList" }
      processListing: { $ref: "#/components/messages/processListing" }
      processFront: { $ref: "#/components/messages/processFront" }
      processQuit: { $ref: "#/components/messages/processQuit" }
      processShot: { $ref: "#/components/messages/processShot" }
      processResult: { $ref: "#/components/messages/processResult" }
      softwareList: { $ref: "#/components/messages/softwareList" }
      softwareListing: { $ref: "#/components/messages/softwareListing" }
      agentAccess: { $ref: "#/components/messages/agentAccess" }
      cloudServices: { $ref: "#/components/messages/cloudServices" }
      cloudReport: { $ref: "#/components/messages/cloudReport" }
      cloudList: { $ref: "#/components/messages/cloudList" }
      cloudListing: { $ref: "#/components/messages/cloudListing" }
      cloudDetail: { $ref: "#/components/messages/cloudDetail" }
      cloudCard: { $ref: "#/components/messages/cloudCard" }
      cloudGet: { $ref: "#/components/messages/cloudGet" }
      cloudPreview: { $ref: "#/components/messages/cloudPreview" }
      cloudRefuse: { $ref: "#/components/messages/cloudRefuse" }
      chatModels: { $ref: "#/components/messages/chatModels" }
      chatCatalog: { $ref: "#/components/messages/chatCatalog" }
      chatSend: { $ref: "#/components/messages/chatSend" }
      chatDelta: { $ref: "#/components/messages/chatDelta" }
      chatStatus: { $ref: "#/components/messages/chatStatus" }
      chatResult: { $ref: "#/components/messages/chatResult" }
      chatCancel: { $ref: "#/components/messages/chatCancel" }
      chatReset: { $ref: "#/components/messages/chatReset" }
      previewBegin: { $ref: "#/components/messages/previewBegin" }
      previewEnd: { $ref: "#/components/messages/previewEnd" }
  bulk:
    address: "1"
    description: >
      Raw payload bytes on channel 1, correlated by the frame header's
      transfer id. Four payload kinds ride it: capture pixel data (rows
      top-to-bottom, rowBytes apart; depth 8 uses the guest's palette;
      16 is RGB555 big-endian; 32 is xRGB8888 big-endian), file content
      (file.begin describes the container), a scene document
      (scene.begin: UTF-8 JSON, the Mirror IR whose major is irVersion),
      and a cloud preview (preview.begin: raw indexed rows, top-to-bottom,
      rowBytes apart, already dithered by the HOST to the depth the guest
      asked — no palette block, because the target is the classic system
      table for that depth, which both sides already own). The control
      message that began the transfer says which.

operations:
  hostExecutesLine:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/execRequest"
      - $ref: "#/channels/control/messages/execCancel"
      - $ref: "#/channels/control/messages/execInput"
    description: >
      Host sends a line a human typed, verbatim. It performs no
      tokenization at all — not even splitting a command name off the
      front — because "where does the verb end" is a grammar, and every
      grammar belongs to the machine that serves it. A line the guest
      cannot interpret comes back as exec.result ok:false with the
      guest's own words, never a protocol error: that is what keeps a
      host binary correct against a guest it has never met.
      exec.cancel asks the guest to stop the exec with that id and is
      ALWAYS answered — an unknown id gets exec.result ok:false
      "not-running", the same way stream.stop is always answered.
  guestAnswersExec:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/execOutput"
      - $ref: "#/channels/control/messages/execResult"
    description: >
      Zero or more exec.output frames carrying text, then exactly one
      exec.result. The result is TERMINAL STATUS ONLY and never carries
      output — a guest that answers in a single shot sends one
      exec.output and one exec.result, and a guest that streams sends
      many exec.output and the same one exec.result. That is why the
      shapes are split: the host accumulates output until the result
      arrives, so gaining streaming later is a GUEST-ONLY change and
      breaks no host that already speaks this.
  guestOffersCapture:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/captureOffer"
      - $ref: "#/channels/control/messages/captureBegin"
      - $ref: "#/channels/control/messages/captureEnd"
    description: >
      Guest announces and completes a capture transfer. A transfer starts
      one of two ways: answering the host's capture.request (capture.begin
      follows directly, correlated by the request id), or guest-initiated
      push — the guest captures first, announces with capture.offer
      (carrying true byte counts, so a refusal costs nothing but the
      capture), and sends capture.begin only after the host answers
      capture.accept. Either way the frames and capture.end are identical;
      one transfer at a time still holds across both origins.
  hostRequestsScene:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/sceneRequest"
    description: >
      Host asks for one scene. Bounded and one-shot: the answer is a
      transfer (scene.begin, bulk frames, scene.end), never a control
      message, because a scene does not fit 4096 bytes. It takes the one
      transfer lane for the tens of milliseconds the document takes, and
      is refused with scene.end ok:false while a stream or another
      transfer holds it — the same one-at-a-time invariant capture obeys,
      with no second ownership rule invented for scenes.
      There is no scene bracket and no scene.cancel: a scene transfer is
      short enough that abandoning it costs more than finishing it.
  guestServesScene:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/sceneBegin"
      - $ref: "#/channels/control/messages/sceneEnd"
    description: >
      Guest announces and completes a scene transfer, correlated to the
      request by id exactly as a capture is. scene.begin carries the IR
      major so the host can refuse an unknown one before decoding; the
      bulk bytes are the IR document; scene.end says whether all of them
      arrived. A scene that will not fit its buffer, or a walk that
      failed, is scene.end ok:false with a reason and NO bulk — a partial
      walk is never delivered as a complete scene, and half a JSON
      document is the worst form of that lie because it does not parse.
      What the document omits is a claim in itself: an absent
      windows[].controls says "this producer does not report controls",
      not "this window has none", and a consumer must not read absence as
      emptiness.
      THE REFERENCE PLANE, added 2026-08-01 and the reason a rendered
      scene can be acted on at all. windows[].controls[].ref is a
      declared IR v1 field this producer had been leaving out;
      windows[].ref is an ADDITION to IR v1's window field set, taken
      under the accretive rule — additive fields do not move irVersion,
      and a window is the other thing an act can name, so a scene that
      named only controls would leave half the act plane unaddressable.
      Both carry a token minted by the guest's observation registry, and
      both are refused by the act plane the moment the element behind
      them moves or the process behind them is replaced (see actWindow /
      actElement): a reference is re-proved on use, never repaired.
      A ref is ABSENT for an element the guest could not name — past the
      resolver's reach, or the registry had no slot left for this scene.
      Absent means NOT MINTED. The empty string is never sent and must
      not be treated as one: it is the consumer's own vocabulary for "the
      producer has no reference layer", which is a different claim.
      IR V2 COLLECTION AUTHORITY. meta.coverage[] carries a typed scope,
      optional process-incarnation owner, status, and optional reason.
      Status is complete, partial, retracted, failed, stale, or unavailable.
      Only a fresh complete claim for the exact parent scope and owner may
      prove deletion; every other status preserves compatible prior members
      as expected-stale and non-actionable. Human-readable meta.errors must
      not drive this decision. apps[].incarnation and
      processes[].incarnation identify a Process Manager lifetime;
      windows[].incarnation combines it with the exact WindowRecord address
      when known. These durable reducer identities are distinct from opaque
      short-lived act refs.
  hostControlsStream:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/streamStart"
      - $ref: "#/channels/control/messages/streamStop"
      - $ref: "#/channels/control/messages/streamRefresh"
    description: >
      Host brackets a live stream. Between stream.start and the guest's
      stream.stopped, the guest sends frames as ordinary capture
      transfers whose capture.begin id is the stream id — that id is the
      routing: no disk, no announcement, straight to the live view. The
      guest self-paces (finish a frame, capture fresh — never queue). The
      wire paces frames that carry pixels; frames that do not (an
      unchanged screen sends a ~150-byte control pair and no bulk data)
      are paced by the guest's own floor, which minIntervalMs raises.
      The stream owns the transfer lane: capture.request and
      capture.offer are refused while it runs.
  guestRequestsStream:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/streamRequest"
    description: >
      Guest asks the host to open a stream bracket. The bracket stays
      host-owned — both origins share one path — so the host answers
      with a normal stream.start, or an error (code "stream-busy") if
      the lane is taken. A guest whose ask goes unanswered gives up
      after a timeout and tells its human.
  guestEndsStream:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/streamStopped"
    description: >
      stream.stopped is always the stream's last word — it acks the
      host's stream.stop (any in-flight frame is aborted first, ending
      ok:false) and equally lets the guest end the stream on its own,
      with the reason saying why.
  hostBrowsesFiles:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/fileList"
      - $ref: "#/channels/control/messages/fileGet"
      - $ref: "#/channels/control/messages/fileCancel"
    description: >
      THE FILE FAMILY IS SYMMETRIC. Every message here means the same
      thing whichever side sends it, and whoever RECEIVES a request
      serves its OWN share: the host browsing the guest and the guest
      browsing the host are the same exchange with the roles swapped.
      Each machine shares exactly one folder, and a share bounds what
      the other machine may reach on its own initiative — never what a
      human deliberately sends, so the source of a push is any file the
      sender picks and only the destination must lie inside a share.

      These verbs are requester-centric like HTTP's — file.get is the
      sender obtaining a file. Note that the CONSOLE surface is
      deliberately the other frame: it is a shell into the guest, so a
      console `put` means the guest puts a file to the host (see
      docs/files.md). Host UI affordances speak host-native
      ("Download"). Paths are RELATIVE
      to the RESPONDER's configured share root ("" is the root; segments
      joined with ":"): a path outside the share is inexpressible, and
      any empty segment ("::" traversal) refuses bad-path. file.get
      needs no accept - the requester is the receiver; failures answer
      with file.refuse. One transfer at a time still holds across
      captures, streams, and files.
  hostPutsFiles:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/fileOffer"
    description: >
      Host offers a file for the guest's share. A share bounds what the
      other machine may reach on its own initiative — list, pull, write
      into — and never what a human deliberately sends, so the SOURCE of
      a push is any file the sender picks; only the DESTINATION must lie
      inside the share. The guest answers file.accept or file.refuse
      without prompting anyone (it is not necessarily attended), then
      the host sends file.begin, the bulk stream, and file.end. The
      guest confirms with file.done only once the bytes are written and
      the file is stamped: a put is not finished until the File Manager
      says so. While the bytes stream the guest reports what it has
      actually taken, with file.progress — the sender's own "handed to
      the socket" count is not evidence the far side received anything,
      and on a slow link it runs minutes ahead of the truth.
  hostChangesFiles:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/fileMove"
      - $ref: "#/channels/control/messages/fileTrash"
      - $ref: "#/channels/control/messages/fileRestore"
      - $ref: "#/channels/control/messages/fileMkdir"
    description: >
      Changing what is in the share, rather than what flows across it.
      Every one of these is reversible, which is the point: deleting
      moves an item to the Trash rather than erasing it, so the inverse
      is a move back, and the answer carries what the inverse needs.
      Every inverse is a move, expressed in names on both ends. A
      trashed item is named by where it landed — file.trash answers with
      the name it now has inside the Trash, which is not always the name
      it had, since the Trash may already hold one. That name plus the
      path it came from is everything file.restore needs, so nothing is
      remembered on either side and an undo survives a restart of either.
      The Trash is a real folder; a name in it is as durable a way to say
      "that item" as a path anywhere else.

      file.progress is also the sender's CLOCK. A sender may run no more
      than a bounded number of bytes ahead of the count the receiver has
      confirmed, because a bulk stream offered faster than the link
      carries it accumulates in the sending kernel's buffer, and from the
      moment that buffer is non-empty the careful gaps between writes
      stop existing on the wire (see the pacing rule in
      docs/architecture.md). That is not a tuning preference: on this
      link it is the difference between 340 KB/s and 5 KB/s, and the
      collapse does not recover on its own.

      Transfers RESUME rather than restart. An offer may carry a
      resumeToken naming the source file; a receiver holding a partial
      recorded under that same token answers file.accept with `have`,
      and the sender begins at that offset with file.begin carrying it.
      A receiver never resumes onto a file it cannot prove is the same
      one — no token, or a token it does not recognise, means start at
      zero, which is merely slow where the alternative is silently
      wrong. file.end may carry a crc32 over the whole file, which
      matters most exactly here: a resumed file is stitched from two
      sessions and nothing else checks the seam.

  guestServesFiles:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/fileListing"
      - $ref: "#/channels/control/messages/fileRefuse"
      - $ref: "#/channels/control/messages/fileBegin"
      - $ref: "#/channels/control/messages/fileEnd"
      - $ref: "#/channels/control/messages/fileProgress"
    description: >
      Listings paginate (control frames cap at 4 KB); a transfer is the
      standard begin -> bulk -> end shape. The container rule: data-only
      files travel as the raw data fork; resource-only files as
      MacBinary; both-forks defaults to the data fork with MacBinary on
      request. Text conversion is the HOST's job - the guest ships raw
      bytes and metadata.
  hostAnswersOffer:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/captureAccept"
      - $ref: "#/channels/control/messages/captureRefuse"
    description: >
      Host grants or declines a guest-initiated capture offer. Accepting is
      policy, not ceremony — a host normally accepts unless a transfer is
      already in flight. A guest whose offer goes unanswered abandons it
      after a timeout and reports that to its human.
  hostRequestsCapture:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/captureRequest"
      - $ref: "#/channels/control/messages/captureCancel"
    description: >
      Host asks the guest to capture, and may abandon a transfer already in
      flight. Cancel is advisory: the guest stops sending bulk frames and
      closes the transfer with capture.end ok:false, so the host learns the
      outcome the same way it would from any other failure.
  censusExchange:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/censusRequest"
      - $ref: "#/channels/control/messages/censusReport"
    description: >
      The hardware census: either side asks, and whoever RECEIVES a
      census.request answers for its own machine — the family is
      symmetric by definition. Reports paginate exactly like file
      listings (control frames cap at 4 KB): each request carries a
      cursor, each report answers one bounded page and says whether
      more follow. Pagination is also the pacing mechanism — a probe
      does at most one page of work per request (the SCSI scan touches
      one target per page), so a census never stalls the wire. The
      outcome vocabulary and probe registry live in x-census below.
      In practice the host asks and the guest — the machine with hardware
      worth asking about — serves; a side that does not serve a probe
      answers outcome "refused" with a note (a well-formed refusal, never
      a protocol error), which is how the host answers a census.request
      aimed at it. The asymmetry is declared here, not accidental.
  hostBrowsesProcesses:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/processList"
    description: >
      process.list means the same thing whichever side sends it, and
      whoever RECEIVES it serves its OWN running processes - so the family
      is symmetric in MEANING. But NOW is a cockpit for driving old Macs
      from new ones, so it implements one direction only: the host asks,
      the guest (Process Manager) answers. The reverse (guest asking the
      host) is a non-goal and deliberately unimplemented - the host will
      ignore a process.list rather than serve one. Read-only and needs no
      share: a process list reveals nothing a person could not see in the
      Application menu. The listing paginates (frames cap at 4 KB) with
      cursor/more, and is also the mirror's degraded plane - process list
      and front app are legible without the resident anchor plane at all.
  guestServesProcesses:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/processListing"
    description: >
      The answer to process.list: one entry per running process, the
      guest's own. kind classifies each (application / background /
      finder); front marks the frontmost; isSelf marks the responder's
      own process, which is how a caller names the process on the other
      end of a connection without guessing at its file name; psnHigh/
      psnLow name the process to the drive verbs. Paginates when the
      list outgrows a 4 KB frame.
  hostBrowsesSoftware:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/softwareList"
    description: >
      software.list means the same thing whichever side sends it, and
      whoever RECEIVES it serves its OWN installed software — symmetric
      in MEANING, one direction in implementation, the process.list
      precedent exactly: the host asks, the guest answers, and the host
      will ignore a software.list rather than serve one. Cursor 1 (or
      absent) rebuilds the responder's inventory — for the "apps"
      domain that is a whole-volume catalog sweep, measured ~4 s on
      real hardware, so the asker's watchdog must outlive it. Later
      cursors page the same inventory without re-paying the sweep.
      Read-only.
  guestServesSoftware:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/softwareListing"
    description: >
      The answer to software.list: one entry per installed item. path is
      the launch key — the asker launches by sending the launch command
      with entry.path, so the name-ambiguity refusal can never fire from
      a listing; an empty path means the chain could not be named
      honestly and the entry is not launchable from afar. off marks the
      Extensions Manager's disabled siblings; running is the join
      against the responder's process list. version rides each served
      page — a bounded handful of fork opens per request, the price a
      page explicitly asks for — and is absent when a file has no
      readable 'vers'. Paginates by cursor/more inside 4 KB frames;
      note carries the honest edges (unknown domain, inventory
      truncated at the cache).
  hostDrivesProcess:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/processFront"
      - $ref: "#/channels/control/messages/processQuit"
      - $ref: "#/channels/control/messages/processShot"
    description: >
      The drive verbs, same host->guest arrow as the listing: process.front
      brings a process forward (SetFrontProcess), process.quit asks it to
      quit (a 'quit' Apple Event it may decline), and process.shot fronts a
      process then captures just its front window. Each names its target by
      the PSN echoed from a process.listing entry; the guest re-validates
      that PSN against a live process before acting. process.front and
      process.quit answer with process.result; process.shot answers with a
      capture transfer (capture.begin/bulk/end), or capture.end ok:false on
      failure - it reuses the capture transport rather than inventing one.
      Like the listing, the reverse direction is a non-goal - the guest
      issues no drive verbs at the host.

      A PSN is the identity a MACHINE names a process by; the `quit`
      x-command's name is the identity a PERSON names one by. Both reach
      the same implementation, and a caller that has a listing should use
      the PSN: it names exactly one process, where a name is capped at 31
      characters, need not be unique, and cannot be derived from anything
      else the wire reports (see isSelf on process.listing). process.quit
      on the responder's OWN process is refused for the same reason the
      command refuses it - the reply would be severed mid-send.
  guestAnswersDrive:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/processResult"
    description: >
      The one reply shape for both drive verbs: ok true when the verb was
      applied (for quit, that the event was sent - not that the app has
      gone, which it may decline), or ok false with a reason when the PSN
      no longer names a live process or the Toolbox refused.
  guestAsksCloud:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/cloudServices"
      - $ref: "#/channels/control/messages/cloudList"
      - $ref: "#/channels/control/messages/cloudDetail"
      - $ref: "#/channels/control/messages/cloudGet"
      - $ref: "#/channels/control/messages/cloudPreview"
    description: >
      The guest asks the HOST about its cloud. One direction by
      DEFINITION rather than by precedent: the family's subject is the
      modern machine's iCloud, which the classic machine does not have —
      so unlike files there is no symmetric half waiting to be
      implemented, and none is declared. A host never sends these; a
      side that receives one it does not serve ignores it like any
      control message it cannot decode.

      ADDITIVE family, no revision bump — the agent.access precedent:
      both shipping halves ignore an unknown control message once the
      handshake is past. Discovery is therefore by asking: a guest sends
      cloud.services, and silence past its own deadline means a host
      that predates the family. That is an ordinary outcome for the
      module's status line, not an error.

      cloud.services asks what is on offer. cloud.list pages one
      service's rows (cursor/more, the file.listing shape of pagination,
      inside the 4 KB control frame). cloud.detail asks for one item's
      card. cloud.get asks for one item AS A FILE, and its success is
      the ordinary file.offer -> file.accept -> file.begin -> bulk ->
      file.end sequence into the guest's share — a WAY IN to that
      family, never a second transfer mechanism (the put precedent).
      cloud.refuse answers only what fails BEFORE an offer exists; once
      the offer is on the wire, the file family owns the outcome,
      including the one-transfer-wide lane.

      cloud.preview asks for one item AS PIXELS: a small transfer
      (preview.begin, bulk frames, preview.end) of raw indexed rows the
      host has already resized to fit the asked box and dithered to the
      asked depth. The HOST does all rendering — the same division as
      text conversion, applied to pixels: the modern machine is the only
      side that can decode a HEIC, and the classic machine should only
      ever CopyBits what arrives. It rides the one-transfer-wide lane
      like everything else on the bulk channel, so while a download (or
      anything else) holds the lane the ask is refused busy via
      cloud.refuse — a bounded prefix of the same bargain cloud.get
      strikes, never a queue.
  hostServesCloud:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/cloudReport"
      - $ref: "#/channels/control/messages/cloudListing"
      - $ref: "#/channels/control/messages/cloudCard"
      - $ref: "#/channels/control/messages/cloudRefuse"
      - $ref: "#/channels/control/messages/previewBegin"
      - $ref: "#/channels/control/messages/previewEnd"
    description: >
      The host's answers. Every human-readable string in them — labels,
      titles, subtitles, card rows — is converted BEFORE sending:
      MacRoman-expressible, composed, no code the guest would have to
      map. Conversion is the host's job in both directions of the file
      family, and it is the host's job here for the same reason — the
      modern machine is the only side that can spell both alphabets.
      The service registry, each service's row semantics, and the
      additive rule for new services live in x-cloud below.
  guestAsksChat:
    action: send
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/chatModels"
      - $ref: "#/channels/control/messages/chatSend"
      - $ref: "#/channels/control/messages/chatCancel"
      - $ref: "#/channels/control/messages/chatReset"
    description: >
      The guest asks the HOST's language models. One direction by
      DEFINITION, the cloud rule: the family's subject is the modern
      machine's model harness — its providers, its credentials, its
      network — which the classic machine does not have. A host never
      sends these; a side that receives one it does not serve ignores
      it like any control message it cannot decode.

      ADDITIVE family, no revision bump — the cloud.services precedent
      exactly. Discovery is by asking: a guest sends chat.models, and
      silence past its own deadline means a host that predates the
      family. That is a status line, not an error.

      DISCOVERY IS TWO-STEP AND LAZY. chat.models without a provider
      lists providers; with one it lists THAT provider's models, one
      bounded page at a time (cursor/more, the cloud.list shape), and
      a guest asks only for the provider somebody selected. Model rows
      carry a HOST-MINTED ref, not the provider's model name: names
      are unbounded out in the world and a fixed classic buffer is
      not, which cost a metal evening (a 48-byte name silently lost
      its last byte and every send of it came back unknown). The ref
      is opaque, connection-scoped, and never shown to a person — the
      label is the human-facing name everywhere.

      THE CONVERSATION LIVES ON THE HOST, per connection. chat.send
      carries one turn — the text just typed — and never history; the
      host appends it to the conversation it keeps for this connection
      and answers from there. A reconnect therefore starts a fresh
      conversation implicitly; chat.reset exists so a person can get a
      blank page without dropping the link. One turn streams at a time
      per connection: a chat.send while one is unfinished is answered
      chat.result ok:false busy — the answer sink is one transcript,
      the exec-busy rule.

      chat.cancel asks the host to stop the streaming turn and is
      ALWAYS answered — chat.result ok:false "cancelled" if stopped,
      "not-running" if the host no longer has it. The unanswered-cancel
      wedge is the one stream.stop was hardened against; this family
      inherits the rule. chat.reset is refused busy while a turn
      streams (cancel first — one rule, no race between a discard and
      an arriving delta).
  hostServesChat:
    action: receive
    channel: { $ref: "#/channels/control" }
    messages:
      - $ref: "#/channels/control/messages/chatCatalog"
      - $ref: "#/channels/control/messages/chatDelta"
      - $ref: "#/channels/control/messages/chatStatus"
      - $ref: "#/channels/control/messages/chatResult"
    description: >
      The host's answers. A turn's reply is zero or more chat.delta
      frames, then exactly one chat.result — the exec.output split,
      borrowed with its reason: the result is TERMINAL STATUS ONLY and
      never carries reply text, so a host that answers in one shot and
      a host that streams look the same to the guest.

      Every human-readable string — labels, details, delta text, status
      lines, result messages — is converted BEFORE sending:
      MacRoman-expressible, composed, no code the guest would have to
      map. The modern machine is the only side that can spell both
      alphabets, the hostServesCloud rule verbatim. The guest's prompt
      travels the other way as MacRoman by construction (it was typed
      on the guest); the host transcodes it toward its provider.

      chat.status is the family's liveness. A host running a model that
      pauses to use tools can go a minute without a delta; status says
      what is happening, and the guest's quiet deadline re-arms on
      EITHER a delta or a status. A host that serves chat MUST keep one
      of the two flowing while a turn is open — a guest is entitled to
      declare a turn dead after 60 seconds of total silence and cancel
      it.

      preview.begin and preview.end bracket a cloud.preview's answer,
      the way capture and scene bracket theirs: begin says what the bulk
      bytes are (dimensions, depth, rowBytes, total), end closes the
      transfer. A service that cannot render one refuses not-listable —
      the same well-formed refusal an older host's silence approximates,
      which is what keeps the ask additive.

