# When to merge, and when to sweep. Read by tools/arc-status.
#
# These exist so the answer is never "when it feels good". They are meant
# to be argued with and changed — but changed HERE, deliberately, and not
# reinterpreted in the moment by whoever is tired.
#
# Lines are KEY=VALUE. Blank lines and # comments ignored.

# ---------------------------------------------------------------- MERGE
# A MERGE-TEST-DRIVE round fires when ANY of these is true. Each is a
# count the tool can take without asking anyone.

# Finished lanes sitting outside the tree. Three is the point at which
# their conflicts start interacting rather than merely existing.
MERGE_IDLE_LANES=3

# Total unlanded commits, regardless of how many lanes. A single lane can
# be a jam by itself.
MERGE_UNLANDED_COMMITS=40

# Conflicts any ONE unlanded lane would hit. Past this the merge is a
# project rather than a chore, and it only grows.
MERGE_LANE_CONFLICTS=5

# main having anything we do not: always merge. It is somebody else's
# work and drift is silent.
MERGE_ON_MAIN_AHEAD=1

# Anything touching the resident or the shared table owes a bake, and a
# stale resident invalidates every measurement taken after it.
MERGE_ON_EXT_TOUCHED=1

# Paths everything else builds on. An unlanded lane touching one of these
# means every other lane is working against a tree that is about to
# change underneath it.
FOUNDATION=mirror/host/MirrorKit/Sources/MirrorKitUI/SceneRenderer.swift
FOUNDATION=mirror/host/MirrorKit/Sources/MirrorKitUI/DisplayReplay.swift
FOUNDATION=mirror/host/MirrorKit/Sources/MirrorKitUI/UnknownVisual.swift
FOUNDATION=now-host/Sources/Host/NOWMirrorContentPlane.swift
FOUNDATION=now-host/Sources/Host/MirrorStateEngine.swift
FOUNDATION=now-host/Sources/Host/HostAppState.swift
FOUNDATION=now-guest-ppc/src/scene/
FOUNDATION=now-guest-ppc/src/act/
FOUNDATION=now-guest-ppc/src/peek/
FOUNDATION=contract/asyncapi.yaml
FOUNDATION=contract/peek_table.h
FOUNDATION=ext/

# ---------------------------------------------------------------- SWEEP
# A FULL SWEEP fires when EVERY gate branch below is landed AND at least
# one merge-test-drive round has run since the last of them landed.
#
# The second half matters: a sweep of a tree whose newest work has never
# been merged with the rest measures the lanes, not the product.
#
# Everything not listed here lands into the sweep AFTER this one. That is
# the whole point — a sweep must happen while work is still in flight to
# steer, so the gate is deliberately short.

# Sweep B (next). Rationale in plan 018: render defects dominate every
# render axis, and controls that render but cannot be used would make a
# scored sweep re-measure one cause across every target.
SWEEP_GATE=claude/019-integration-2
SWEEP_GATE=claude/018-render-defects
SWEEP_GATE=claude/018-control-semantics

# Discretionary sweeps, which stay human calls and are NOT computed:
#   - a new capability class landed (not a fix — a kind of thing the
#     product could not do before)
#   - before a handoff to a new session, so the next one starts from a
#     measurement rather than a story

# --------------------------------------------------------------- KNOWLEDGE
# Work that is not written down did not happen. Checked, not remembered.

# A lane shipping code and touching no docs/ is flagged. Not a refusal —
# some lanes legitimately only move code — but it must be seen and said.
KNOWLEDGE_FLAG_UNDOCUMENTED=1

# Hours without a new corpus finding before it is called out. The corpus
# outlives this repository; docs/ does not. A durable lesson left only in
# docs/ is one the next project pays for again.
KNOWLEDGE_CORPUS_STALE_HOURS=12

# ------------------------------------------------- ROUND 8, LOCKED 2026-08-07
# Michelle: "lock a point to kick off the next merge/test round". So this is
# a condition, not a feeling, and it is checked by tools/arc-status rather
# than remembered by whoever is awake.
#
# Round 7 landed 15 lanes / 88 commits at GATE_EXIT=0. The next-up group is
# six lanes: drag-break-4, flicker-measurement, window-widget-flags,
# blit-generation-key, sweep-d, and housekeeping.
#
# ROUND 8 FIRES on the FIRST of:
#
#   * FIVE of the six next-up lanes idle AND green. Five not six, because one
#     lane blocked on a hard problem must not hold the other five out of the
#     tree — that is how a round grows from 69 commits to 96 between rounds.
#   * 60 unlanded commits, regardless of lane count. Round 7 resolved a
#     seven-file silent revert at 88; smaller rounds resolve conflicts by
#     reading rather than by luck.
#   * SWEEP D reporting a REGRESSION. A regression outranks any seam, and it
#     is measured against a tree, so the tree it names must be the one that
#     moves.
#   * Any unlanded lane touching ext/ or contract/peek_table.h — unchanged
#     from MERGE_ON_EXT_TOUCHED, and now doubly load-bearing because two
#     resident changes are already sitting unreceipted.
#
# ROUND 8 DOES NOT WAIT FOR: the asset-packs arc, the scene IR contract work,
# or anything reserved for Michelle. Those land in 9 or later by design — a
# round that waits for the largest outstanding thing measures nothing on time.
ROUND8_IDLE_GREEN_LANES=5
ROUND8_UNLANDED_COMMITS=60
ROUND8_ON_SWEEP_REGRESSION=1
