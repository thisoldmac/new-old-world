version: 1
base_path: /
global_nav_label: Docs
required_ci_check: Documentation
repository_owner: thisoldmac
canonical_origin: https://docs.newoldworldmac.com
website_repository: https://github.com/thisoldmac/newoldworld-web
security_contact: mailto:github@shelbel.net
security_expires: 2027-08-11T00:00:00Z
release_requirements:
  - canonical_origin
  - website_repository
  - security_contact
  - security_expires
notes:
  - The selected GitHub owner is thisoldmac and the public security contact is github@shelbel.net.
  - The public website is a separate repository and owns the main-site deployment.
  - The documentation target is https://docs.newoldworldmac.com/, independently deployed from this application repository with GitHub Pages.
  - The website owns one stable link to the documentation; a docs update does not rebuild or redeploy its Azure Container App image.
  - The Pages workflow deploys only the exact main revision whose integrated CI run completed successfully.
  - NOW_DOCS_RELEASE=1 refuses if the canonical origin or future security expiry is removed.
