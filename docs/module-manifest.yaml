version: 2
host_registry: now-host/Sources/Host/ModuleRegistry.swift
ppc_registry: now-guest-ppc/src/workshop/workshop_registry.c
ppc_contract: now-guest-ppc/src/workshop/workshop_module.h
ppc_wiring: now-guest-ppc/src/workshop/workshop_window.c
guest_68k_registry: now-guest-68k/src/commands/commands68.c
modules:
  - id: screen
    title: Screen
    tier: core
    domains: []
    feature_id: null
    page: user-guide/reference/modules/screen.md
    ppc_pages: [kWorkshopScreenshots]
    guest_68k: supported-subset
    title_overrides:
      kWorkshopScreenshots: >-
        PPC keeps its own window/rail name "Screenshots" (also this
        module's own doc: "PowerPC Screenshots page"); "Screen" is the
        cross-app grouping label, not the on-machine page name.
  - id: files
    title: Files
    tier: core
    domains: []
    feature_id: null
    page: user-guide/reference/modules/files.md
    ppc_pages: [kWorkshopFiles]
    guest_68k: supported-subset
  - id: icloud
    title: iCloud
    tier: experimental
    domains: []
    feature_id: null
    page: user-guide/reference/modules/icloud.md
    ppc_pages: [kWorkshopCloud]
    guest_68k: unavailable
  - id: processes
    title: Processes
    tier: core
    domains: []
    feature_id: null
    page: user-guide/reference/modules/processes.md
    ppc_pages: [kWorkshopProcesses]
    guest_68k: supported-subset
  - id: mirror
    title: Mirror
    tier: experimental
    domains: []
    feature_id: null
    page: user-guide/reference/modules/mirror.md
    ppc_pages: [kWorkshopMirror]
    guest_68k: unavailable
  - id: continuity
    title: Continuity
    tier: experimental
    domains: []
    feature_id: null
    page: user-guide/reference/modules/continuity.md
    # Host-side feature: the guest's half is the resident pointer plane and
    # the application's intake, which have no Workshop page of their own.
    ppc_pages: []
    guest_68k: unavailable
  - id: console
    title: Console
    tier: core
    domains: []
    feature_id: null
    page: user-guide/reference/modules/console.md
    ppc_pages: [kWorkshopConsole]
    guest_68k: supported
  - id: chat
    title: Chat
    tier: experimental
    domains: []
    feature_id: null
    page: user-guide/reference/modules/chat.md
    ppc_pages: [kWorkshopChat]
    guest_68k: unavailable
  - id: web
    title: Web Proxy
    tier: experimental
    domains: []
    feature_id: null
    page: user-guide/reference/modules/web.md
    ppc_pages: [kWorkshopWeb]
    guest_68k: unavailable
    title_overrides:
      kWorkshopWeb: >-
        PPC's own rail name is "Web" (the module doc itself repeatedly says
        "Workshop Web page"); "Web Proxy" is the cross-app product name.
  - id: development
    title: Development
    tier: experimental
    domains: []
    feature_id: null
    page: user-guide/reference/modules/development.md
    ppc_pages: [kWorkshopDevelopment]
    guest_68k: unavailable
  - id: census
    title: Hardware
    tier: core
    domains: []
    feature_id: null
    page: user-guide/reference/modules/hardware.md
    ppc_pages: [kWorkshopHardware]
    guest_68k: supported-subset
  - id: diagnostics
    title: Diagnostics
    tier: debug
    domains: []
    feature_id: null
    page: user-guide/reference/modules/diagnostics.md
    ppc_pages: [kWorkshopDiagnostics]
    guest_68k: console-only
  - id: networking
    title: Networking
    tier: core
    domains: []
    feature_id: null
    page: user-guide/reference/modules/networking.md
    ppc_pages: [kWorkshopNetworking]
    guest_68k: main-window-summary
  - id: software
    title: Software
    tier: core
    domains: []
    feature_id: null
    page: user-guide/reference/modules/software.md
    ppc_pages: [kWorkshopSoftware]
    guest_68k: supported-subset
  - id: mcp
    title: MCP
    tier: experimental
    domains: []
    feature_id: null
    page: user-guide/reference/modules/mcp.md
    ppc_pages: [kWorkshopMCP]
    guest_68k: unavailable
  - id: logs
    title: Logs
    tier: debug
    domains: []
    feature_id: null
    page: user-guide/reference/modules/logs.md
    ppc_pages: [kWorkshopLogs]
    guest_68k: console-only
  - id: settings
    title: Connections
    tier: core
    domains: []
    feature_id: null
    page: user-guide/reference/modules/connections-and-preferences.md
    ppc_pages: [kWorkshopPreferences, kWorkshopConnection]
    guest_68k: main-window
    title_overrides:
      kWorkshopPreferences: >-
        Preferences is a second, distinct PPC page inside this module (rail
        rearrangement, density); it is not the connection surface, so it
        keeps its own name rather than the module's grouping title.
      kWorkshopConnection: >-
        PPC's own page is named "Connection" (singular, one persistent link
        at a time — also this module's own doc: "separate Connection and
        Preferences pages"); "Connections" is the cross-app grouping label.
