site_name: New Old World
site_description: User and developer documentation for New Old World
site_url: !ENV [NOW_DOCS_SITE_URL, "https://example.invalid/"]
docs_dir: docs
site_dir: build-docs/site
use_directory_urls: true
strict: true

validation:
  links:
    not_found: info
    absolute_links: info
    unrecognized_links: info

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: orange

plugins:
  - search

hooks:
  - docs/hooks/provenance.py
  - docs/hooks/release_features.py
  - docs/hooks/module_taxonomy.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_css:
  - assets/stylesheets/now-docs.css

extra_javascript:
  - https://unpkg.com/mermaid@11.16.1/dist/mermaid.min.js
  - assets/javascripts/mermaid-init.js

exclude_docs: |
  *
  !index.md
  !user-guide/
  !user-guide/**
  !developer-guide/
  !developer-guide/**
  !agent-guide/
  !agent-guide/**
  !generated/
  !generated/**
  !assets/
  !assets/**
  !status.md
  !known-wrong.md
  !open-issues.md
  !architecture.md
  !contract-coverage.md
  !mcp-coverage.md
  !command-parity.md
  !emu-readiness.md
  !files.md
  !icloud.md
  !mirror-knowledge.md
  !processes-and-peek.md
  !software-module.md
  !development.md
  !plans/2026-08-10-030-handoff.md
  !plans/2026-08-10-031-feat-development-agent-loop-hardening-plan.md

